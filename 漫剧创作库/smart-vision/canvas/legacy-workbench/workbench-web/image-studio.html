<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫剧创作库 · 生图工具</title>
  <style>
    :root {
      --bg: #0b1120;
      --bg2: #111827;
      --panel: rgba(17,24,39,.92);
      --line: rgba(255,255,255,.08);
      --line-hover: rgba(255,255,255,.15);
      --text: #e8edf5;
      --muted: #8896ab;
      --accent: #7c8aff;
      --accent2: #a78bfa;
      --ok: #34d399;
      --warn: #fbbf24;
      --error: #f87171;
      --input-bg: rgba(9,14,28,.85);
      --radius: 10px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .hidden { display: none !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }
    button, input, textarea, select { font: inherit; }
    button {
      appearance:none; border:1px solid var(--line); border-radius:var(--radius-sm);
      padding:6px 12px; cursor:pointer; color:var(--text); background:var(--input-bg); transition:.15s;
    }
    button:hover { border-color:var(--line-hover); background:rgba(255,255,255,.04); }
    button.primary { background:linear-gradient(135deg,#6366f1,#7c8aff); border-color:transparent; color:#fff; }
    button.success { background:linear-gradient(135deg,#059669,#10b981); border-color:transparent; color:#fff; }
    button.sm { padding:4px 9px; font-size:11px; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    input[type="text"], textarea, select {
      width:100%; border:1px solid var(--line); background:var(--input-bg); color:var(--text);
      border-radius:var(--radius-sm); padding:8px 10px; outline:none;
    }
    textarea:focus, input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(124,138,255,.15); }

    .top-bar {
      display:flex; align-items:center; justify-content:space-between; padding:12px 18px 10px;
      border-bottom:1px solid var(--line); background:var(--bg2); position:sticky; top:0; z-index:50;
    }
    .top-bar-left { display:flex; align-items:center; gap:10px; }
    .top-bar h1 { font-size:14px; font-weight:700; color:#fff; }
    .top-bar h1 span { color:var(--accent); }
    .top-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:rgba(124,138,255,.15); color:var(--accent); font-size:10px; font-weight:600; }
    .top-bar-right { display:flex; gap:6px; align-items:center; }

    .main-wrap {
      max-width:1680px; margin:0 auto; display:grid; grid-template-columns:minmax(360px,470px) minmax(0,1fr);
      min-height:calc(100vh - 46px);
    }
    .left-panel { border-right:1px solid var(--line); overflow-y:auto; max-height:calc(100vh - 46px); }
    .result-panel { display:flex; flex-direction:column; overflow-y:auto; max-height:calc(100vh - 46px); }
    .panel-section { padding:14px 16px; border-bottom:1px solid var(--line); }
    .section-title { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }

    .mode-tabs { display:flex; gap:0; margin-bottom:14px; background:var(--input-bg); border-radius:var(--radius-sm); padding:3px; }
    .mode-tab { flex:1; padding:6px 0; text-align:center; border-radius:6px; border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; }
    .mode-tab.active { background:linear-gradient(135deg,#6366f1,#7c8aff); color:#fff; }

    .field-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 10px; }
    .field { display:grid; gap:4px; }
    .field.full { grid-column:1/-1; }
    .field.hidden { display:none; }
    label { font-size:11px; color:var(--muted); font-weight:600; }
    .hint, .sub-note { font-size:10.5px; color:#55627a; line-height:1.45; }
    .toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .dir-picker { display:flex; gap:6px; align-items:center; }
    .dir-picker input { flex:1; }
    .dir-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.25); color:#6ee7b7; font-size:10px; font-weight:600; cursor:pointer; transition:.15s; max-width:220px; overflow:hidden; }
    .dir-badge:hover { background:rgba(52,211,153,.22); border-color:rgba(52,211,153,.45); }
    .dir-badge .dir-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dir-badge-none { background:rgba(255,255,255,.04); border-color:var(--line); color:var(--muted); }

    .status-line { margin-top:10px; padding:7px 10px; border-radius:var(--radius-sm); font-size:11.5px; border:1px solid var(--line); color:var(--muted); background:rgba(255,255,255,.03); }
    .status-line.ok { color:#6ee7b7; background:rgba(16,185,129,.08); border-color:rgba(16,185,129,.2); }
    .status-line.warn { color:#fcd34d; background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.2); }
    .status-line.error { color:#fca5a5; background:rgba(248,113,113,.08); border-color:rgba(248,113,113,.2); }

    .progress-wrap { margin-top:10px; }
    .progress-wrap.hidden { display:none; }
    .progress-bar { width:100%; height:4px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; }
    .progress-fill { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--ok)); transition:width .35s ease; }
    .progress-text { margin-top:5px; font-size:11px; color:var(--muted); }

    .edit-mode-tabs { display:flex; gap:0; margin-bottom:10px; background:var(--input-bg); border-radius:var(--radius-sm); padding:3px; }
    .edit-mode-tab { flex:1; padding:5px 0; text-align:center; border-radius:6px; border:none; background:transparent; color:var(--muted); font-size:11.5px; font-weight:600; cursor:pointer; }
    .edit-mode-tab.active { background:linear-gradient(135deg,#059669,#10b981); color:#fff; }

    .prompt-builder {
      display:grid; gap:7px; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:rgba(255,255,255,.02);
    }
    .prompt-lane {
      display:grid; grid-template-columns:70px minmax(0,1fr); gap:6px; align-items:start;
    }
    .lane-label {
      font-size:10.5px; color:var(--muted); font-weight:700; padding-top:4px;
    }
    .lane-body {
      min-height:34px; border:1px dashed var(--line); border-radius:8px; padding:5px 6px; display:flex; flex-wrap:wrap; gap:5px; align-items:flex-start;
      background:rgba(9,14,28,.55);
    }
    .prompt-chip {
      display:inline-flex; align-items:flex-start; gap:5px; padding:4px 7px; border-radius:8px; background:rgba(124,138,255,.12); border:1px solid rgba(124,138,255,.25); color:#dbe4ff; max-width:100%;
    }
    .prompt-chip.custom { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.25); color:#d1fae5; }
    .chip-text { font-size:10.5px; line-height:1.35; word-break:break-word; }
    .chip-remove {
      width:14px; height:14px; min-width:14px; padding:0; border:none; border-radius:999px; background:rgba(255,255,255,.12); color:#fff; font-size:9px; line-height:14px;
    }
    .lane-input {
      border:none !important; box-shadow:none !important; background:transparent !important; min-width:90px; padding:2px 1px !important; color:var(--text); font-size:10.5px;
    }
    .lane-empty { font-size:10px; color:#5f6d84; padding:3px 1px; }

    .prompt-free-input {
      width:100%; min-height:160px; resize:vertical; border:1px solid var(--line); background:var(--input-bg); color:var(--text);
      border-radius:var(--radius-sm); padding:10px 12px; outline:none; font-size:12.5px; line-height:1.6;
    }
    .prompt-free-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(124,138,255,.15); }
    .prompt-free-input::placeholder { color:#4b5563; }

    /* ── img2img 统一混合编辑器（参考 Seedance 2.0 @交互） ── */
    .i2i-editor {
      position:relative;
      display:flex; flex-direction:column; gap:6px;
      padding:10px 12px; border:1px solid var(--line); border-radius:12px;
      background:rgba(15,23,42,.7); min-height:72px;
    }
    .i2i-input-box {
      display:flex; flex-wrap:wrap; gap:5px; align-items:center; flex:1; min-height:32px; line-height:1.6;
    }
    .i2i-input-box:empty::before {
      content:'输入提示词，@ 引用图片...'; color:#4b5563; font-size:12px; pointer-events:none;
    }
    /* 图片引用 chip */
    .i2i-img-chip {
      display:inline-flex; align-items:center; gap:5px; padding:2px 6px 2px 2px; border-radius:8px;
      background:rgba(30,41,59,.9); border:1px solid rgba(255,255,255,.12); cursor:default; flex-shrink:0; max-width:104px;
      transition:.15s;
    }
    .i2i-img-chip:hover { border-color:rgba(251,146,60,.45); }
    .i2i-img-chip img {
      width:28px; height:28px; border-radius:5px; object-fit:cover; display:block; flex-shrink:0;
    }
    .i2i-img-chip-name {
      font-size:11px; color:#e2e8f0; font-weight:600; white-space:nowrap;
    }
    /* 文字标签 chip（词库/预设） */
    .i2i-tag-chip {
      display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 8px; border-radius:16px;
      font-size:11.5px; line-height:1.35; cursor:default; flex-shrink:0;
    }
    .i2i-tag-chip.tag {
      background:rgba(99,102,241,.18); border:1px solid rgba(99,102,244,.35); color:#a5b4fc;
    }
    .i2i-tag-chip.preset {
      background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.35); color:#fde68a;
    }
    .i2i-inline-text {
      display:inline-flex; align-items:flex-start; gap:4px; max-width:100%;
      font-size:12.5px; line-height:1.6; color:var(--text);
      padding:0 1px; border-radius:6px; cursor:text; flex:0 1 auto;
    }
    .i2i-inline-text:hover {
      background:rgba(255,255,255,.04);
    }
    .i2i-inline-text .i2i-inline-text-value {
      min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; flex:1 1 auto;
    }
    .i2i-chip-close {
      width:15px; height:15px; min-width:15px; padding:0; border:none; border-radius:50%;
      background:rgba(255,255,255,.1); color:#94a3b8; font-size:10px; line-height:15px;
      cursor:pointer; display:inline-grid; place-items:center; margin-left:-2px;
    }
    .i2i-chip-close:hover { background:rgba(248,113,113,.5); color:#fff; }
    /* 自由文本输入 */
    .i2i-text-input {
      flex:1; min-width:120px; border:none !important; box-shadow:none !important;
      background:transparent !important; color:var(--text); font-size:12.5px;
      padding:2px 0 !important; outline:none; line-height:1.6;
    }
    .i2i-text-input::placeholder { color:#4b5563; }

    /* @图片选择弹出面板 */
    .i2i-at-popup {
      position:absolute; z-index:300; bottom:calc(100% + 6px); left:0;
      width:260px; max-height:200px; overflow-y:auto; padding:8px;
      background:#1e293b; border:1px solid rgba(255,255,255,.14); border-radius:12px;
      box-shadow:0 12px 40px rgba(0,0,0,.55);
      display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    }
    .i2i-at-popup::after {
      content:''; position:absolute; left:16px; bottom:-6px;
      border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #1e293b;
    }
    .i2i-at-item {
      aspect-ratio:1; border-radius:8px; overflow:hidden; cursor:pointer;
      border:2px solid transparent; transition:.15s; position:relative;
    }
    .i2i-at-item:hover { border-color:var(--accent); transform:scale(1.05); z-index:1; }
    .i2i-at-item.used { opacity:.35; pointer-events:none; }
    .i2i-at-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .i2i-at-item-label {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.55); font-size:9px; color:#e2e8f0; opacity:0; transition:.15s;
    }
    .i2i-at-item:hover .i2i-at-item-label { opacity:1; }
    .i2i-at-empty {
      grid-column:1/-1; text-align:center; padding:16px 8px; font-size:11px; color:#6b7280;
    }

    .img2img-zone { display:flex; flex-direction:column; gap:5px; }
    .img2img-stack { display:flex; align-items:flex-start; gap:6px; min-height:58px; padding:8px; border:1.5px dashed var(--line); border-radius:var(--radius-sm); background:var(--input-bg); }
    .img2img-stack:hover { border-color:var(--accent); }
    .img2img-add-btn {
      width:50px; height:50px; display:grid; place-items:center; border-radius:var(--radius-sm); border:2px dashed var(--line);
      color:var(--muted); font-size:22px; flex-shrink:0; user-select:none;
    }
    .img2img-add-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(124,138,255,.06); }
    .img2img-stack-container { flex:1; display:flex; flex-wrap:nowrap; align-items:flex-start; min-width:0; max-height:74px; overflow-x:auto; overflow-y:hidden; padding:2px 6px 2px 0; }
    .img2img-stack-container.expanded { max-height:400px; flex-wrap:wrap; overflow-y:auto; overflow-x:hidden; gap:8px; }
    .stack-thumb {
      position:relative; width:54px; height:54px; margin-left:-16px; border-radius:8px; overflow:hidden; border:2px solid var(--bg); box-shadow:0 3px 10px rgba(0,0,0,.34); cursor:pointer; flex-shrink:0;
    }
    .stack-thumb:first-child{margin-left:0}
    .stack-thumb:nth-child(1){z-index:10}.stack-thumb:nth-child(2){z-index:9}.stack-thumb:nth-child(3){z-index:8}.stack-thumb:nth-child(4){z-index:7}.stack-thumb:nth-child(n+5){z-index:6}
    .img2img-stack-container.expanded .stack-thumb{margin-left:0}
    .stack-thumb:hover { transform:translateY(-3px) scale(1.08); z-index:20 !important; }
    .stack-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .stack-thumb-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;border:none;background:rgba(239,68,68,.85);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0;cursor:pointer;opacity:0;z-index:3;}
    .stack-thumb:hover .stack-thumb-del{opacity:1}
    .stack-order-badge,.stack-count-badge{position:absolute;background:rgba(0,0,0,.72);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:999px;pointer-events:none;z-index:2;}
    .stack-order-badge{top:3px;left:3px}
    .stack-count-badge{bottom:3px;right:3px}
    .img2img-hint{font-size:10.5px;color:#55627a;display:flex;justify-content:space-between;}
    .hidden-file-input{display:none;}

    .wordlist-header{
      display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--input-bg); cursor:pointer;
    }
    .wordlist-header:hover{border-color:var(--line-hover);}
    .wordlist-toggle{font-size:10px;color:var(--muted);}
    .wordlist-panel.hidden{display:none}
    .wordlist-panel{margin-top:6px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:rgba(9,14,28,.6);}
    .wordlist-tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);padding:5px 6px; max-height:92px; overflow:auto;}
    .wl-tab{padding:4px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-weight:500;}
    .wl-tab.active{background:rgba(99,102,241,.15);border-color:rgba(99,102,243,.35);color:#a5b4fc;font-weight:700}
    .wordlist-content{max-height:320px;overflow-y:auto;padding:10px 12px;}
    .wl-category{margin-bottom:10px}.wl-category:last-child{margin-bottom:0}
    .wl-category-title{font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
    .wl-category-title::before{content:'';display:inline-block;width:3px;height:11px;border-radius:2px;background:var(--accent);}
    .wl-items{display:flex;flex-wrap:wrap;gap:4px}
    .wl-item{padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#b0bac8;font-size:11px;cursor:pointer;line-height:1.42;white-space:nowrap;transition:all .15s ease;}
    .wl-item.combo{border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.06);color:#fde68a;}
    .wl-item.selected{background:linear-gradient(135deg,rgba(99,102,241,.38),rgba(129,140,248,.34));border-color:#95a0ff;color:#ffffff;box-shadow:0 0 0 1px rgba(167,139,250,.24) inset,0 0 0 1px rgba(99,102,241,.22);transform:translateY(-1px);}
    .wl-tip{font-size:10px;color:#4b5563;margin-top:2px}
    .preset-card {
      text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.03); color:var(--text); display:grid; gap:4px; width:100%; transition:all .16s ease;
    }
    .preset-card.selected{border-color:#95a0ff;background:linear-gradient(135deg,rgba(99,102,241,.24),rgba(167,139,250,.18));box-shadow:0 0 0 1px rgba(167,139,250,.2) inset,0 8px 20px rgba(79,70,229,.14);transform:translateY(-1px);}

    .result-image-area {
      flex:1; min-height:420px; display:grid; place-items:center; border-radius:var(--radius); border:1.5px dashed var(--line); background:var(--input-bg); overflow:hidden; cursor:pointer;
    }
    .result-image-area img { width:100%; height:100%; object-fit:contain; display:block; }
    .result-empty { color:#3d4a60; font-size:12.5px; }
    .result-actions { padding:10px 16px; display:flex; gap:6px; flex-wrap:wrap; border-top:1px solid var(--line); background:var(--bg2); position:sticky; bottom:0; z-index:10; }

    .gallery-section { border-top:1px solid var(--line); background:var(--bg2); }
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; padding:12px 16px; }
    .gallery-card{padding:6px;border-radius:var(--radius-sm);background:var(--input-bg);border:1px solid var(--line)}
    .gallery-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;background:rgba(255,255,255,.03);cursor:pointer;}
    .gallery-card strong{font-size:10.5px;color:var(--text);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .gallery-card span{font-size:9.5px;color:var(--muted)}

    .toast{position:fixed;right:16px;bottom:16px;background:#1e293b;color:#e2e8f0;font-weight:600;font-size:11.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);opacity:0;transform:translateY(8px);transition:.2s ease;pointer-events:none;z-index:99999}
    .toast.show{opacity:1;transform:translateY(0)}

    .lightbox-overlay{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.86);backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:all .25s ease}
    .lightbox-overlay.show{opacity:1;visibility:visible}
    .lightbox-img-wrap{max-width:92vw;max-height:90vh;border-radius:var(--radius);overflow:hidden;background:#000;display:grid;place-items:center;}
    .lightbox-img-wrap img{max-width:92vw;max-height:90vh;object-fit:contain;}
    .lightbox-close{position:absolute;top:16px;right:20px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;font-size:18px;display:grid;place-items:center;z-index:1}

    @media(max-width:1200px){ .main-wrap{grid-template-columns:minmax(320px,420px) 1fr;} }
    @media(max-width:900px){ .main-wrap{grid-template-columns:1fr;} .left-panel,.result-panel{max-height:none;border-right:none;} .prompt-lane{grid-template-columns:1fr;} .lane-label{padding-top:0;} }

    .model-config-btn{padding:2px 8px;border-radius:999px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);color:#6ee7b7;font-size:10px;font-weight:600;cursor:pointer;transition:.15s;}
    .model-config-btn:hover{background:rgba(16,185,129,.22);border-color:rgba(16,185,129,.45);}
    .modal-overlay{position:fixed;inset:0;z-index:200000;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:all .2s ease;}
    .modal-overlay.show{opacity:1;visibility:visible;}
    .modal-box{width:460px;max-width:94vw;max-height:88vh;overflow-y:auto;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:grid;gap:12px;}
    .modal-title{font-size:14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;}

<body>
  <div class="top-bar">

              <option value="4096x4096">4096 x 4096（4K）</option>

            </div>
          </div>

          <div class="field full" id="promptEditorField">

    </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <div class="lightbox-img-wrap"><img alt="预览大图" id="lightboxImg"/></div>
  </div>

  <div class="modal-overlay" id="modelConfigModal">
    <div class="modal-box">
      <div class="modal-title">

      <div class="mc-list" id="mcList"><div class="sub-note">暂无配置，请在下方添加。</div></div>
      <div class="mc-divider">添加 / 编辑模型</div>
      <div class="mc-form">
        <div><label>API 地址（Base URL）</label><input id="mcUrl" type="text" placeholder="如：https://api.openai.com/v1" /></div>
        <div><label>API Key</label><input id="mcKey" type="password" placeholder="sk-..." /></div>
        <div><label>模型名称</label><input id="mcModel" type="text" placeholder="如：gpt-image-1 / dall-e-3" /></div>
        <div class="mc-actions">
          <button class="sm" id="mcCancelBtn">取消</button>
          <button class="sm primary" id="mcSaveBtn">保存配置</button>
        </div>
      </div>
    </div>
  </div>

<script>
const API_BASE = '/api/workbench/image-studio';
const DEFAULT_OUTPUT_DIR = 'runninghub_outputs/image-studio-v3';
const WORDLIST_API = `${API_BASE}/wordlist`;
const OBJECT_STORAGE_UPLOAD_API = `${API_BASE}/upload-reference`;
const PRESET_WORDLIST_ID = 'preset-recipes';
const EMBEDDED_WORDLISTS = {"art-style.json":{"_meta":{"dimension":"艺术风格与调性","priority":2,"required":true,"description":"决定画面的整体画风和艺术质感，避免风格混乱。包含：品类风格、参考对标、质感调性","tip":"不可同时写入2种以上冲突风格（如国漫写实+日系萌系），会导致画风崩坏"},"categories":[{"id":"genre_realistic","name":"写实/摄影类","tip":"追求真实感，电影剧照质感","items":[{"keyword":"写实摄影风","usage":"电影剧照、真人质感"},{"keyword":"超写实主义（Hyperrealism）","usage":"超越照片的真实感"},{"keyword":"照片级真实感（Photorealistic）","usage":"难以分辨真假的拟真"},{"keyword":"电影感","usage":"胶片、宽画幅、叙事感"},{"keyword":"胶片质感","usage":"颗粒、色偏、怀旧"},{"keyword":"35mm胶片摄影","usage":"经典胶片颗粒感"},{"keyword":"胶片颗粒感","usage":"复古质感、噪点美学"},{"keyword":"电影摄影（Film Photography）","usage":"片场拍摄质感"},{"keyword":"拍立得风格","usage":"即时成像、白边框"},{"keyword":"黑白摄影","usage":"经典、高对比、情绪化"},{"keyword":"微距摄影","usage":"极微细节、景深极浅"},{"keyword":"产品摄影","usage":"商业产品、干净布光"},{"keyword":"美食摄影","usage":"诱人质感、暖光"},{"keyword":"街头摄影","usage":"纪实、随性、都市"}]},{"id":"genre_anime","name":"动漫/插画类","tip":"二次元与插画风格","items":[{"keyword":"日系动漫风格","usage":"二次元、热血、校园"},{"keyword":"国漫写实风格","usage":"漫剧首选，角色写实+国风审美"},{"keyword":"漫画风格（Manga）","usage":"黑白线稿、漫画分格"},{"keyword":"吉卜力风格","usage":"温暖、自然、手绘感"},{"keyword":"新海诚光影","usage":"极致光效、云层、天空"},{"keyword":"鸟山明画风","usage":"经典日漫、热血少年"},{"keyword":"赛璐璐上色（Cel Shading）","usage":"扁平色块、动画感"},{"keyword":"数字插画（Digital Illustration）","usage":"现代板绘、色彩丰富"},{"keyword":"手绘厚涂","usage":"笔触可见、艺术感"},{"keyword":"水彩插画","usage":"轻透、水渍边缘、柔和"},{"keyword":"铅笔素描","usage":"线条感、手绘、基础"},{"keyword":"水墨国风","usage":"古风、写意、东方美学"},{"keyword":"浮世绘","usage":"和风、传统版画质感"},{"keyword":"油画质感","usage":"古典、厚涂、艺术感"},{"keyword":"儿童插画","usage":"天真、明亮、绘本风"},{"keyword":"线条艺术（Line Art）","usage":"纯线条、无填充"},{"keyword":"矢量艺术（Vector Art）","usage":"锐利边缘、可缩放"},{"keyword":"剪纸艺术","usage":"层叠、纸质、民间"},{"keyword":"拼贴画（Collage）","usage":"混合素材、解构重组"},{"keyword":"像素复古","usage":"8-bit、游戏怀旧"}]},{"id":"genre_3d","name":"3D/CG类","tip":"三维建模、游戏与动画","items":[{"keyword":"3D CG渲染","usage":"游戏资产、精细建模感"},{"keyword":"3D写实渲染","usage":"超精细3D人物/场景"},{"keyword":"低多边形（Low Poly）","usage":"几何极简、 function showToast(text){ toast.textContent = text; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 1200); }
async function copyText(text, message='已复制'){
  if(!text){ showToast('没有可复制内容'); return; }
  try { await navigator.clipboard.writeText(text); }
  catch(_){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  showToast(message);
}
function escapeHtml(text){ return String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function withNoCache(url){ if(!url) return ''; return url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now(); }
function setStatus(text, level='warn'){ statusLine.className = `status-line ${level}`; statusLine.textContent = text || '等待'; }

function getOutputDirPath(raw){
  const value = String(raw || '').trim();
  if(!value) return DEFAULT_OUTPUT_DIR;
  if(value.startsWith('/') || value.includes('/')) return value;
  return 'runninghub_outputs/' + value;
}

function getDirDisplayName(dir){
  const value = String(dir || '').trim();
  if(!value) return '设置存图目录';
  const normalized = value.replace(/\\/g, '/').replace(/\/+$/, '');
  const name = normalized.split('/').filter(Boolean).pop();
  return name || normalized;
}

function updateDirButton(label=''){
  const btn = $('pickDirBtn');
  if(!btn) return;
  const text = String(label || '').trim() || '设置存图目录';
  btn.textContent = text;
  btn.title = text === '设置存图目录' ? '设置存图目录' : `当前目录：${text}`;
}

function updateDirBadge(){
  updateDirButton(state.outputDirLabel || getDirDisplayName(state.outputDirPath));
}

function makeWordlistSelectionKey(dimId, text){ return `${dimId}::${text}`; }
function makePresetSelectionKey(categoryId, text){ return `${categoryId}::${text}`; }

function syncSelectedWordlistUI(){
  document.querySelectorAll('.wl-item[data-selection-key]').forEach(el => {

  });
}

function syncSelectedPresetUI(){

  });
}

  syncSelectedWordlistUI();
  syncSelectedPresetUI();
}

function normalizeDimToLaneId(dimId){
  for(const lane of LANE_CONFIG){ if(lane.aliases.includes(dimId)) return lane.id; }
  return 'subject_action';
}

function syncPromptTextarea(){
  const parts = [];
  for(const lane of LANE_CONFIG){
    for(const item of state.promptLanes[lane.id]){ parts.push(item.text); }
    const custom = (state.laneInputs[lane.id] || '').trim();
    if(custom) parts.push(custom);
  }
  $('prompt').value = parts.join('，');
}

function renderPromptBuilder(){
  const builder = $('promptBuilder');
  builder.innerHTML = LANE_CONFIG.map(lane => {
    const chips = state.promptLanes[lane.id].map((item, idx) => `
      <span class="prompt-chip${item.kind==='custom'?' custom':''}">
        <span class="chip-text">${escapeHtml(item.text)}</span>
        <button type="button" class="chip-remove" data-lane-remove="${lane.id}" data-chip-idx="${idx}">×</button>
      </span>
    `).join('');
    return `
      <div class="prompt-lane">
        <div class="lane-label">${lane.label}</div>
        <div class="lane-body" data-lane-body="${lane.id}">
          ${chips || '<span class="lane-empty">点击下方词库标签添加</span>'}
          <input class="lane-input" data-lane-input="${lane.id}" type="text" placeholder="在这里补充自定义提示词" value="${escapeHtml(state.laneInputs[lane.id] || '')}" />
        </div>
      </div>
    `;
  }).join('');
  syncPromptTextarea();
}

function addPromptChip(dimId, text, kind='tag', meta={}){
  const laneId = normalizeDimToLaneId(dimId);
  const lane = state.promptLanes[laneId];
  const exists = lane.some(item => item.text === text && item.kind === kind && item.source === dimId);
  if(exists) return false;
  lane.push({ text, kind, source: dimId, meta });
  if(kind === 'tag') state.selectedWordlistKeys.add(makeWordlistSelectionKey(dimId, text));
  if(kind === 'preset' && meta.categoryId) state.selectedPresetKeys.add(makePresetSelectionKey(meta.categoryId, text));
  renderPromptBuilder();

function reorderUploadImages(fromIndex, toIndex){
  if(fromIndex === toIndex || fromIndex < 0 || toIndex < 0) return;
  const oldImages = [...state.uploadImages];
  const moved = oldImages[fromIndex];
  if(!moved) return;
  oldImages.splice(fromIndex, 1);
  oldImages.splice(toIndex, 0, moved);
  const indexMap = new Map();
  oldImages.forEach((img, newIdx) => {
    const oldIdx = state.uploadImages.indexOf(img);
    indexMap.set(oldIdx, newIdx);
  });
  state.uploadImages = oldImages;
  remapI2iImageChipIndexes(indexMap);
  renderStackThumbs();

function addImageRef(imgIdx){
  const img = state.uploadImages[imgIdx];
  if(!img) return;
  const input = $('i2iTextInput');
  const rawValue = input ? input.value : '';
  const caretStart = input ? input.selectionStart ?? rawValue.length : rawValue.length;
  const caretEnd = input ? input.selectionEnd ?? caretStart : caretStart;

  let insertAt = rawValue.lastIndexOf('@', caretStart);
  if(insertAt < 0) insertAt = caretStart;

  const beforeRaw = rawValue.slice(0, insertAt);
  const afterRaw = rawValue.slice(caretEnd);
  const beforeText = beforeRaw.trim();
  const nextInputValue = afterRaw.replace(/^\s+/, '');

  if(beforeText){
    const lastChip = state.i2iChips[state.i2iChips.length - 1];
    if(lastChip?.type === 'text') lastChip.text = `${lastChip.text}，${beforeText}`;
    else state.i2iChips.push({ type: 'text', text: beforeText });
  }

  addI2iChip({ type: 'image', imgIdx, name: img.name, dataUrl: img.dataUrl }, { nextInputValue });
  const nextInput = $('i2iTextInput');
  if(nextInput){
    nextInput.focus();

  showToast('已引用：' + img.name);
}

function shouldJoinI2iWithoutComma(prevPart, nextPart){
  if(!prevPart || !nextPart) return true;
  if(prevPart.type === 'image' || nextPart.type === 'image') return true;
  const prevText = String(prevPart.text || '');
  const nextText = String(nextPart.text || '');
  if(/[，,、；;：:\(（\[【\s]$/.test(prevText)) return true;
  if(/^[，,、；;：:）)】\]\.。!！?？\s]/.test(nextText)) return true;
  return false;
}

function buildI2iPromptText(options={}){
  const { withAt = true } = options;
  const parts = [];
  for(const chip of state.i2iChips){
    if(chip.type === 'image'){
      const ref = getImageRefLabel(chip.imgIdx);
      parts.push({ type: 'image', text: withAt ? '@' + ref : ref });
    } else {
      parts.push({ type: chip.type || 'text', text: chip.text });
    }
  }
  const freeText = ($('i2iTextInput')?.value || '').trim();
  if(freeText) parts.push({ type: 'text', text: freeText });

  let result = '';
  parts.forEach((part, idx) => {
    const text = String(part.text || '').trim();
    if(!text) return;
    const prevPart = idx > 0 ? parts[idx - 1] : null;
    if(result && !shouldJoinI2iWithoutComma(prevPart, part)){
      result += '，';
    }
    result += text;
  });
  return result;
}

function buildDirectApiHeaders(apiKey){

function extractDirectImageItem(responsePayload){
  const data = responsePayload?.data;
  if(Array.isArray(data) && data.length && typeof data[0] === 'object') return data[0];
  const errorText = String(responsePayload?.error || responsePayload?.message || responsePayload?.msg || '').trim();
  const errorCode = String(responsePayload?.code || '').trim();
  if(errorText){
    throw new Error(errorCode ? `上游接口返回错误（code=${errorCode}）：${errorText}` : `上游接口返回错误：${errorText}`);
  }
  throw new Error(`接口返回中未找到图片数据: ${JSON.stringify(responsePayload).slice(0, 300)}`);
}

function dataUrlToBlob(dataUrl){
  const match = String(dataUrl || '').match(/^data:([^;,]+)?(;base64)?,(.*)$/);
  if(!match) throw new Error('参考图数据格式无效');
  const mimeType = match[1] || 'image/png';
  const encoded = match[3] || '';
  const binary = match[2] ? atob(encoded) : decodeURIComponent(encoded);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mimeType });
}

async function uploadReferenceImageToObjectStorage(img){
  if(img?.remoteUrl && /^https?:\/\//i.test(String(img.remoteUrl))) return img;
  const blob = img?.file || dataUrlToBlob(img?.dataUrl || '');
  const fileName = img?.name || `reference-${Date.now()}.png`;
  const form = new FormData();
  form.append('file', blob, fileName);
  form.append('purpose', 'vision');
  form.append('mode', 'object_storage');
  const resp = await fetch(OBJECT_STORAGE_UPLOAD_API, { method: 'POST', body: form });
  const data = await resp.json().catch(() => ({}));
  if(!resp.ok || !data.ok) throw new Error(data?.error || data?.message || data?.msg || `COS 上传失败 HTTP ${resp.status}`);
  const remoteUrl = String(data.remoteUrl || data.url || '').trim();
  if(!/^https?:\/\//i.test(remoteUrl)) throw new Error('COS 上传未返回公网 URL');
  return {
    ...img,
    remoteUrl,
    url: remoteUrl,
    uploadRef: remoteUrl,
    providerRef: remoteUrl,
    fileId: remoteUrl,
    objectStorage: data
  };
}

function shouldUseObjectStorageReferences(protocol){
  const adapter = String(protocol?.adapter || '').trim();
  return adapter === 'gpt-image-v2' || adapter === 'gemini-image';
}

async function ensureObjectStorageReferences(payload){
  if(payload.action !== 'img2img' || !shouldUseObjectStorageReferences(payload.protocol || {})) return payload;
  const images = Array.isArray(payload.images) ? payload.images : (Array.isArray(payload.image) ? payload.image : []);
  if(!images.length) return payload;
  setStatus('正在将参考图上传到腾讯云 COS...', 'warn');
  const uploadedImages = [];
  for(const img of images){
    uploadedImages.push(typeof img === 'string' ? img : await uploadReferenceImageToObjectStorage(img));
  }
  state.uploadImages = uploadedImages;
  renderStackThumbs();
  if(state.i2iPopupOpen) showI2iAtPopup();
  return { ...payload, images: uploadedImages, image: uploadedImages };
}

function makeUploadFileName(name, fallback='reference.png'){
  const source = String(name || '').trim() || fallback;
  const safe = source.replace(/[\\/:*?"<>|]+/g, '_');
  return /\.(png|jpg|jpeg|webp)$/i.test(safe) ? safe : `${safe}.png`;
}

function base64ToBlob(base64, mimeType='image/png'){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i = 0; i < byteChars.length; i += 1) byteNumbers[i] = byteChars.charCodeAt(i);
  return new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
}

async function buildStandaloneResult(responsePayload){
  const item = extractDirectImageItem(responsePayload);
  const remoteUrl = String(item.url || item.image_url || '').trim();
  const b64 = String(item.b64_json || item.b64 || '').trim();
  const revisedPrompt = String(item.revised_prompt || responsePayload?.revised_prompt || '').trim();
  if(remoteUrl){
    return {
      saved: {
        url: remoteUrl,
        remoteUrl,
        revisedPrompt,
        filename: `image-studio-v3-${Date.now()}.png`,
        path: ''
      }
    };
  }
  if(b64){
    const blob = base64ToBlob(b64, 'image/png');
    const objectUrl = URL.createObjectURL(blob);
    return {
      saved: {
        url: objectUrl,
        remoteUrl: '',
        revisedPrompt,
        filename: `image-studio-v3-${Date.now()}.png`,
        path: '',
        blobObjectUrl: objectUrl,
        blob
      }
    };
  }
  throw new Error('接口已返回响应，但未包含 url 或 b64_json');
}

function resolveLocalImageProxyEndpoint(protocol){
  const adapter = String(protocol?.adapter || '').trim() || 'openai-edits';
  const endpointPath = String(protocol?.endpointPath || protocol?.endpoint_path || protocol?.endpoint || '').trim();
  if(endpointPath && /\/images\/generations(?:\/|$)/i.test(endpointPath)) return '/v1/images/generations';
  if(endpointPath && /\/images\/edits(?:\/|$)/i.test(endpointPath)) return '/v1/images/edits';
  if(adapter === 'openai-generations' || adapter === 'gpt-image-v2' || adapter === 'gemini-image') return '/v1/images/generations';
  return '/v1/images/edits';
}

async function generateImageStandalone(payload){
  const protocol = payload.protocol || {};
  const adapter = String(protocol?.adapter || '').trim() || 'openai-edits';
  const isGenerations = (adapter === 'openai-generations' || adapter === 'gpt-image-v2');
  const isGemini = (adapter === 'gemini-image');
  const endpoint = resolveLocalImageProxyEndpoint(protocol);
  const requestPayload = {
    baseUrl: payload.baseUrl,
    apiKey: payload.apiKey,
    model: payload.model,
    prompt: payload.prompt,
    size: payload.size,
    response_format: 'url',
    outputDir: payload.outputDir || DEFAULT_OUTPUT_DIR,
    protocol
  };
  ['quality', 'style', 'outputFormat', 'aspect_ratio', 'aspectRatio', 'resolution', 'imageSize', 'reasoning_effort', 'reasoningEffort', 'requestedRatio', 'requestedResolution', 'requestedPixelSize'].forEach(key => {
    if(payload[key] != null && payload[key] !== '') requestPayload[key] = payload[key];
  });
  if(payload.n != null) requestPayload.n = payload.n;
  if(!isGenerations && !isGemini) {
    requestPayload.background = payload.background || 'auto';
    if(payload.mask) requestPayload.mask = payload.mask;
  }
  const isProviderImageRef = value => {
    const ref = String(value || '').trim();
    if(!ref || /^data:/i.test(ref) || /^blob:/i.test(ref)) return false;
    return /^file-[\w-]+$/i.test(ref) || /^https?:\/\//i.test(ref);
  };
  const sourceImages = Array.isArray(payload.image) ? payload.image : (Array.isArray(payload.images) ? payload.images : []);
  const imageRefs = sourceImages.map(img => typeof img === 'string' ? img : (img?.uploadRef || img?.providerRef || img?.fileId || img?.id || img?.file_id || img?.remoteUrl || img?.image || '')).filter(isProviderImageRef);
  if(payload.action === 'img2img'){
    if(!imageRefs.length) throw new Error('图生图参考图必须先上传为 file-xxx 或公网 URL，不能使用本地 base64 预览图');
    if((adapter === 'gpt-image-v2' || adapter === 'gemini-image') && imageRefs.some(ref => !/^https?:\/\//i.test(String(ref)))){
      throw new Error('GPT-Image-v2 和 Gemini-Image 的参考图必须使用腾讯云 COS 公网 URL');
    }
    requestPayload.image = imageRefs;
  }

  const resp = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(requestPayload)
  });
  const data = await resp.json();
  if(!resp.ok) throw new Error(data?.error || data?.message || data?.msg || `HTTP ${resp.status}`);
  return {
    ok: true,
    action: payload.action,
    result: await buildStandaloneResult(data)
  };
}

function resolvePreviewUrl(saved){
  if(!saved) return '';
  if(saved.remoteUrl) return saved.remoteUrl;
  if(saved.url) return saved.url;
  if(saved.path) return `${API_BASE}/file?path=${encodeURIComponent(saved.path)}`;
  return '';
}
function isRemoteHttpUrl(url){ return /^https?:\/\//i.test(String(url||'').trim()); }
function proxyImageUrl(url){ return `${API_BASE}/proxy-image?remoteUrl=${encodeURIComponent(url)}`; }
function renderRemotePreviewFallback(url, message='图片在线预览加载失败'){
  const safeUrl = escapeHtml(url || '');
  return `<div class="result-empty" style="display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:14px;text-align:center;">
    <span>${escapeHtml(message)}</span>
    <span style="font-size:12px;color:#8b93a7;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">远程链接已保留：${safeUrl}</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <button class="sm" type="button" data-open-preview-url="${safeUrl}">在线预览</button>
      <button class="sm" type="button" data-copy-preview-url="${safeUrl}">复制链接</button>
    </div>
  </div>`;
}
function bindPreviewFallbackActions(url){
  resultImageShell.querySelectorAll('[data-open-preview-url]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); window.open(url, '_blank'); }));
  resultImageShell.querySelectorAll('[data-copy-preview-url]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); copyText(url, '远程图片链接已复制'); }));
}

function renderResult(payload){
  const result = payload?.result || null;
  state.latestResult = result;
  const saved = result?.saved || null;
  const previewUrl = resolvePreviewUrl(saved);
  if(previewUrl){
    const isRemote = isRemoteHttpUrl(previewUrl);
    const src = isRemote ? proxyImageUrl(previewUrl) : previewUrl;
    resultImageShell.innerHTML = `<img src="${withNoCache(src)}" alt="生成结果" />${isRemote ? `<div class="sub-note" style="padding:8px 0 0;text-align:center;">远程图片：若本地下载失败，已保留在线预览与复制链接。</div><div style="display:flex;gap:8px;justify-content:center;margin-top:6px;"><button class="sm" type="button" data-open-preview-url="${escapeHtml(previewUrl)}">在线预览</button><button class="sm" type="button" data-copy-preview-url="${escapeHtml(previewUrl)}">复制链接</button></div>` : ''}`;
    const img = resultImageShell.querySelector('img');
    if(img && isRemote){
      img.onerror = () => {
        resultImageShell.innerHTML = renderRemotePreviewFallback(previewUrl, saved?.downloadError ? `本地下载失败：${saved.downloadError}` : '图片代理预览失败，但远程链接已保留');
        bindPreviewFallbackActions(previewUrl);
      };
      bindPreviewFallbackActions(previewUrl);
    }
    resultImageShell.style.cursor = 'pointer';
    resultImageShell.style.borderStyle = 'solid';
  } else {
    resultImageShell.innerHTML = '<span class="result-empty">尚未生成结果</span>';
    resultImageShell.style.cursor = 'default';
    resultImageShell.style.borderStyle = 'dashed';
  }
}

const MC_STORAGE_KEY = 'image_studio_models_v3';
const MC_ACTIVE_KEY = 'image_studio_active_model_v3';
const DIR_STORAGE_KEY = 'image_studio_output_dir_v3';

function loadLocalModels(){
  try { return dedupeModels(JSON.parse(localStorage.getItem(MC_STORAGE_KEY) || '[]')); }
  catch(_){ return []; }
}
function saveLocalModels(models){
  localStorage.setItem(MC_STORAGE_KEY, JSON.stringify(dedupeModels(models)));
}
function getActiveModelIndex(){
  const idx = parseInt(localStorage.getItem(MC_ACTIVE_KEY), 10);
  return isNaN(idx) ? 0 : idx;
}
function setActiveModelIndex(idx){
  localStorage.setItem(MC_ACTIVE_KEY, String(idx));
}
function normalizeModelUrl(url){ return String(url || '').trim().replace(/\/+$/, ''); }
function normalizeModelKeyPart(value){ return String(value || '').trim().toLowerCase().replace(/[\s_\-+.]+/g, ''); }
function modelRealName(model){ return String(model?.model || model?.name || '').trim(); }
function modelAliasName(model){
  const alias = String(model?.name || model?.alias || model?.nick || model?.nickname || model?.displayName || model?.ui?.label || '').trim();
  return alias || String(model?.model || '').trim();
}
function modelIdentity(model){
  const registered = String(model?.identityKey || model?._identityKey || '').trim();
  if(registered) return registered;
  return `${normalizeModelKeyPart(modelRealName(model))}::${normalizeModelKeyPart(modelAliasName(model))}`;
}
function dedupeModels(models){
  const result = [];
  const seen = new Set();
  for(const raw of Array.isArray(models) ? models : []){
    const realName = modelRealName(raw);
    const alias = modelAliasName(raw);
    const url = normalizeModelUrl(raw?.url);
    if(!realName && !url) continue;
    const item = { ...raw, id:String(raw?.id||'').trim()||modelIdentity({...raw,model:realName,name:alias}), name: alias || realName, model: realName || alias, url, key: String(raw?.key || raw?.apiKey || '').trim(), _identityKey:modelIdentity({...raw,model:realName,name:alias}) };
    const key = modelIdentity(item);
    if(seen.has(key)) continue;
    seen.add(key);
    result.push(item);
  }
  return result;
}
function mergeModels(localModels, serverModels){ return dedupeModels([...(localModels || []), ...(serverModels || [])]); }

function renderMcList(){
  const list = $('mcList');
  const localModels = loadLocalModels();
  if(!localModels.length){ list.innerHTML = '<div class="sub-note">暂无配置，请在下方添加。</div>'; return; }
  const activeIdx = getActiveModelIndex();
  list.innerHTML = localModels.map((m, i)=>`
    <div class="mc-item${i===activeIdx?' active':''}" data-mc-idx="${i}">
      <div class="mc-item-info">
        <div class="mc-item-name">${escapeHtml(m.name)}</div>

      </div>
      <button class="mc-item-del" data-mc-del="${i}" title="删除">×</button>
    </div>
  `).join('');
}

function applyModel(index){

  state.currentProtocol = m.protocol || {};
}

async function loadModels(){
  const select = $('modelSelect');
  select.innerHTML = '<option value="">加载中...</option>';
  let models = [];
  try{
    const response = await fetch(`${API_BASE}/models`, { cache:'no-store' });
    const data = await response.json();
    if(response.ok && data.ok) models = data.models || [];
  }catch(_){}
  const localModels = loadLocalModels();
  models = mergeModels(localModels, models);
  state.models = models;
  if(!models.length){ select.innerHTML = '<option value="">无可用模型，请点击「模型配置」添加</option>'; return; }
  select.innerHTML = models.map((m, i)=>`<option value="${i}">${escapeHtml(m.note ? m.name + ' (' + m.note + ')' : m.name)}</option>`).join('');
  const activeIdx = getActiveModelIndex();
  select.value = String(Math.min(activeIdx, models.length - 1));
  applyModel(Math.min(activeIdx, models.length - 1));
}

function saveModelConfig(){
  const url = $('mcUrl').value.trim();
  const key = $('mcKey').value.trim();
  const model = $('mcModel').value.trim();
  if(!url){ showToast('请填写 API 地址'); return; }
  if(!model){ showToast('请填写模型名称'); return; }
  const localModels = loadLocalModels();
  const entry = { name: model, model, url: normalizeModelUrl(url), key };
  const existingIdx = localModels.findIndex(item => modelIdentity(item) === modelIdentity(entry));
  if(existingIdx >= 0) localModels[existingIdx] = { ...localModels[existingIdx], ...entry };
  else localModels.push(entry);
  saveLocalModels(localModels);
  setActiveModelIndex(Math.max(0, existingIdx >= 0 ? existingIdx : localModels.length - 1));
  renderMcList();
  $('mcUrl').value=''; $('mcKey').value=''; $('mcModel').value='';
  showToast('配置已保存');
  loadModels();
}

function deleteLocalModel(idx){
  const localModels = loadLocalModels();
  localModels.splice(idx, 1);
  saveLocalModels(localModels);
  if(getActiveModelIndex() >= localModels.length) setActiveModelIndex(Math.max(0, localModels.length - 1));
  renderMcList();
  loadModels();
  showToast('已删除');
}

let progressTimer = null;
function showProgress(){
  const wrap = $('progressWrap'), fill = $('progressFill'), text = $('progressText');
  wrap.classList.remove('hidden'); fill.style.width = '10%'; text.textContent = '生成中...';
  progressTimer = setInterval(()=>{
    const current = parseInt(fill.style.width || '10', 10);
    if(current < 90) fill.style.width = `${current + 8}%`;
  }, 700);
}
function finishProgress(ok){
  clearInterval(progressTimer); progressTimer = null;
  const fill = $('progressFill'), text = $('progressText');
  if(ok){ fill.style.width = '100%'; text.textContent = '完成'; setTimeout(()=>$('progressWrap').classList.add('hidden'), 900); }
  else { text.textContent = '失败'; setTimeout(()=>$('progressWrap').classList.add('hidden'), 1200); }
}

async function generateImage(){
  let payload = buildPayload();
  if(!payload.baseUrl){ setStatus('请先选择模型（URL 未加载）。', 'error'); return; }
  if(!payload.apiKey){ setStatus('请先选择模型（Key 未加载）。', 'error'); return; }
  if(!payload.model){ setStatus('请先选择模型。', 'error'); return; }
  if(!payload.prompt){ setStatus('请填写提示词。', 'error'); return; }
  if(state.mode === 'img2img' && !state.uploadImages.length){ setStatus('请至少上传一张参考图。', 'error'); return; }
  $('generateBtn').disabled = true;
  showProgress();
  try{
    payload = await ensureObjectStorageReferences(payload);
    const data = IS_STANDALONE_MODE
      ? await generateImageStandalone(payload)
      : await (async()=>{
          const resp = await fetch(`${API_BASE}/generate`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
          const data = await resp.json();
          if(!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
          return data;
        })();
    renderResult(data);
    refreshGallery();
    setStatus(IS_STANDALONE_MODE ? '独立版生成完成，可直接下载结果。' : '生成完成', 'ok');
    finishProgress(true);
  }catch(err){
    setStatus('生成失败：' + err.message, 'error');
    finishProgress(false);
  } finally { $('generateBtn').disabled = false; }
}

  renderI2iEditor();
  if(state.i2iPopupOpen) showI2iAtPopup();
  showToast('已移除');
}
function handleImageFiles(fileList){
  if(!fileList || !fileList.length) return;
  const remain = MAX_UPLOAD - state.uploadImages.length;
  if(remain <= 0){ showToast(`最多${MAX_UPLOAD}张`); return; }
  const files = Array.from(fileList).slice(0, remain);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      state.uploadImages.push({ name:file.name, dataUrl:String(reader.result || ''), file });
      loaded += 1;
      if(loaded === files.length){
        renderStackThumbs();
        if(state.i2iPopupOpen) showI2iAtPopup();
        showToast(`已添加${loaded}张`);
      }
    };
    reader.readAsDataURL(file);
  });
}

async function pickOutputDirectory(){
  const btn = $('pickDirBtn');
  const prevText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '选择中...';
  try{
    // 优先尝试后端 API
    const resp = await fetch(`${API_BASE}/pick-directory`, { cache:'no-store' });
    const ct = (resp.headers.get('content-type') || '').toLowerCase();
    if(!ct.includes('json')){
      throw new Error('BACKEND_UNAVAILABLE');
    }
    const data = await resp.json();
    if(!resp.ok || !data.ok) throw new Error(data.error || '选择目录失败');
    const selectedPath = String(data.directory || '').trim() || DEFAULT_OUTPUT_DIR;
    state.outputDirPath = selectedPath;
    state.outputDirLabel = getDirDisplayName(selectedPath);
    $('outputDir').value = state.outputDirPath;
    localStorage.setItem(DIR_STORAGE_KEY, state.outputDirPath);
    updateDirButton(state.outputDirLabel);
    showToast('已选择目录：' + state.outputDirLabel);
  }catch(err){
    if(err?.message === 'BACKEND_UNAVAILABLE' || (err?.message || '').includes('JSON') || (err?.message || '').includes('Failed to fetch')){
      // 后端不可用，回退到浏览器本地目录选择
      try {
        if('showDirectoryPicker' in window){
          const h = await window.showDirectoryPicker({ mode: 'readwrite' });
          const dirName = h.name || '设置存图目录';
          state.outputDirPath = getOutputDirPath(dirName);
          state.outputDirLabel = dirName;
          $('outputDir').value = state.outputDirPath;
          localStorage.setItem(DIR_STORAGE_KEY, dirName);
          updateDirButton(state.outputDirLabel);
          showToast('已选择目录（本地模式）：' + state.outputDirLabel);
          setStatus('已选择本地目录（保存功能需通过「存入图库」按钮下载）', 'warn');
          return;
        }
        // webkitdirectory 回退
        const inp = document.createElement('input');
        inp.type = 'file'; inp.webkitdirectory = true; inp.style.display = 'none';
        document.body.appendChild(inp);
        inp.addEventListener('change', () => {
          if(inp.files.length){
            const dirName = inp.files[0].webkitRelativePath.split('/')[0] || '设置存图目录';
            state.outputDirPath = getOutputDirPath(dirName);
            state.outputDirLabel = dirName;
            $('outputDir').value = state.outputDirPath;
            localStorage.setItem(DIR_STORAGE_KEY, dirName);
            updateDirButton(state.outputDirLabel);
            showToast('已选择目录（只读模式）：' + dirName);
            setStatus('已选择本地目录（只读模式，保存功能需通过「存入图库」按钮下载）', 'warn');
          }
          document.body.removeChild(inp);
        });
        inp.click();
        return;
      }catch(e2){
        const msg = e2?.message || '浏览器不支持目录选择';
        setStatus('目录选择失败：' + msg, 'error');
        showToast(msg);
        updateDirButton(state.outputDirLabel || prevText);
        return;
      }
    }
    const msg = err?.message || '选择目录失败';
    setStatus('目录选择失败：' + msg, 'error');
    showToast(msg);
    updateDirButton(state.outputDirLabel || prevText);
  } finally {
    btn.disabled = false;
    if(btn.textContent === '选择中...') updateDirButton(state.outputDirLabel || prevText);
  }
}

});
stackContainer.addEventListener('drop', e=>{
  const thumb = e.target.closest('.stack-thumb');
  if(!thumb) return;
  e.preventDefault();
  const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
  const toIndex = parseInt(thumb.dataset.idx, 10);
  stackContainer.querySelectorAll('.stack-thumb.drag-over').forEach(el => el.classList.remove('drag-over'));
  if(Number.isNaN(fromIndex) || Number.isNaN(toIndex)) return;
  reorderUploadImages(fromIndex, toIndex);
  showToast(`已调整到图${toIndex + 1}`);
});
stackContainer.addEventListener('dragend', ()=>{
  stackContainer.querySelectorAll('.stack-thumb.dragging, .stack-thumb.drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
});
