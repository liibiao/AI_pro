  function requestBodyChars(body){
    if (!body) return 0;
    if (body instanceof FormData) return -1;
    if (typeof body === 'string') return body.length;
    try { return JSON.stringify(body).length; } catch { return -1; }
  }

  function messageChars(messages){
    return (Array.isArray(messages) ? messages : []).reduce((sum,message) => sum + String(message?.content || '').length,0);
  }

  async function readApiPayload(response){
    const raw = await response.text().catch(() => '');
    if (!raw) return {};
    try {
      return JSON.parse(raw);
    } catch {
      return {message:raw.slice(0,600),rawText:raw.slice(0,1200)};
    }
  }

  function apiFailureMessage(kind,url,options,error){
    const method = String(options.method || 'GET').toUpperCase();
    const bodyChars = requestBodyChars(options.body);
    const tokenState = kind === '后台 API' ? (getAdminToken() ? 'present' : 'missing') : 'not-required';
    const detail = error instanceof Error ? error.message : String(error || 'unknown');
    const online = typeof navigator !== 'undefined' ? navigator.onLine : 'unknown';
    return `${kind} 网络请求失败：${method} ${url} 未收到 HTTP 响应。detail=${detail}；bodyChars=${bodyChars}；token=${tokenState}；browserOnline=${online}。常见原因：后台服务未监听、CORS/同源策略、请求体过大、服务重启、上游代理连接被中断。`;
  }

  function apiHttpErrorMessage(kind,url,options,response,payload){
    const method = String(options.method || 'GET').toUpperCase();
    const bodyChars = requestBodyChars(options.body);
    const tokenState = kind === '后台 API' ? (getAdminToken() ? 'present' : 'missing') : 'not-required';
    const code = payload.code || payload.errorCode || payload.statusCode || '';
    const message = payload.error || payload.message || payload.rawText || `HTTP ${response.status}`;
    const detail = payload.rawText && payload.rawText !== message ? `；raw=${String(payload.rawText).slice(0,500)}` : '';
    return `${kind} HTTP ${response.status}：${message}${code ? `；code=${code}` : ''}；method=${method}；url=${url}；bodyChars=${bodyChars}；token=${tokenState}${detail}`;
  }

  async function adminApi(path,options={}){
    const token = getAdminToken();
    if (!token) throw new Error('请先在同源 canvas-next 登录，缺少 canvas_platform_token');
    const headers = new Headers(options.headers || {});
    if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) headers.set('Content-Type','application/json');
    headers.set('Authorization','Bearer ' + token);
    const url = /^https?:\/\//i.test(path) ? path : getAdminApiBase() + (path.startsWith('/') ? path : '/' + path);
    let response;
    try {
      response = await fetch(url,{cache:'no-store',...options,headers});
    } catch (error) {
      throw new Error(apiFailureMessage('后台 API',url,options,error));
    }
    const payload = await readApiPayload(response);
    if (!response.ok || payload.ok === false) {
      throw new Error(apiHttpErrorMessage('后台 API',url,options,response,payload));
    }
    return payload;
  }

  async function bridgeApi(path,options={}){
    const headers = new Headers(options.headers || {});
    if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) headers.set('Content-Type','application/json');
    const url = /^https?:\/\//i.test(path) ? path : getBridgeBase() + (path.startsWith('/') ? path : '/' + path);
    let response;
    try {
      response = await fetch(url,{cache:'no-store',...options,headers});
    } catch (error) {
      throw new Error(apiFailureMessage('Bridge API',url,options,error));
    }
    const payload = await readApiPayload(response);
    if (!response.ok || payload.ok === false) {
      throw new Error(apiHttpErrorMessage('Bridge API',url,options,response,payload));
    }
    return payload;
  }

  async function callBackendLlmChat(messages,options={}){
    const model = getExecutionModel();
    const promptChars = messageChars(messages);
    if (promptChars > 420000) {
      throw new Error(`智能画布传入 LLM 的上下文过大（${promptChars} 字符），已阻止上游调用。请检查节点输出是否携带了完整 llmRawText / runtime / inheritedPayload 嵌套数据。`);
    }
    const payload = await adminApi('/api/generate/llm/chat',{
      method:'POST',
      body:JSON.stringify({
        modelId:model.id,
        messages,
        maxOutputTokens:options.maxOutputTokens || 4096,
        endpointPath:model.endpointPath || '/chat/completions',
        extra:{...(options.extra || {}),smartCanvasContextLabel:options.contextLabel || '',smartCanvasPromptChars:promptChars}
      })
    });
    if (payload.mock || payload.upstream?.mock) {
      throw new Error('后台生成 Mock 模式仍开启，智能画布不能用 mock 文本做动态规划。请在后台管理系统“系统设置”关闭 generation.mock_mode 后再执行。');
    }
    const text = payload.text
      || payload.outputText
      || payload.content
      || payload.message?.content
      || payload.data?.text
      || payload.data?.outputText
      || payload.data?.content
      || payload.data?.message?.content
      || payload.choices?.[0]?.message?.content
      || payload.data?.choices?.[0]?.message?.content
      || payload.result?.text
      || '';
    return {...payload,text:String(text || ''),smartCanvasPromptChars:promptChars,smartCanvasContextLabel:options.contextLabel || ''};
  }

  function friendlyRuntimeError(error){
    const raw = error instanceof Error ? error.message : String(error);
    if (/USER_NOT_FOUND|UNAUTHORIZED|登录已过期|用户不存在|请先登录/i.test(raw)) {
      return `后台认证已失效或当前 token 对应用户不存在：${raw}。请在当前页面右侧“账户”重新登录，确保 canvas-next 与智能画布共用新的 canvas_platform_token 后再执行。`;
    }
    if (/MODEL_NOT_FOUND|模型不可用/i.test(raw)) {
      return `当前选择的后台 LLM 模型不可用：${raw}。请在顶部模型下拉切换到后台已启用的 GPT 5.5 / GPT 5.4，或到后台模型管理检查该模型状态。`;
    }
    if (/INSUFFICIENT_BALANCE|余额不足/i.test(raw)) {
      return `当前账号余额不足，后台已拒绝本次 LLM 调用：${raw}。请在后台账户/钱包补足额度，或切换到有余额的测试账号后再执行。`;
    }
    if (/PROVIDER_KEY_MISSING|上游 API Key 未配置|PROVIDER_DISABLED|上游渠道未启用/i.test(raw)) {
      return `当前模型的上游渠道不可用：${raw}。请到后台管理系统检查该 LLM 模型绑定的 provider、API Key、启用状态和 endpointPath。`;
    }
    if (/auth_unavailable|no auth available|providers=codex/i.test(raw)) {
      return '平台账号已登录，但本地 CLI Proxy / Codex 上游认证不可用。请在 http://127.0.0.1:8317/management.html 完成 Codex 认证，或切换到已认证的后台 LLM 模型后重试。';
    }
    if (/stream disconnected before completion|response\.completed|stream closed/i.test(raw)) {
      return '上游流式响应在完成前中断。通常是上下文过大、上游超时或本地 CLI Proxy 瞬断导致；当前智能画布会先压缩节点继承数据并拦截超大上下文，请重试该节点。';
    }
    if (/Failed to fetch|Load failed|NetworkError/i.test(raw)) {
      return `浏览器没有收到后台 HTTP 响应：${raw}。请优先检查后台 4000 是否可访问、请求体是否过大、服务是否刚重启、以及浏览器控制台/CORS 信息。`;
    }
    return raw;
  }

      if (directorRes.ok) {
        const payload = await directorRes.json();
        if (Array.isArray(payload.directors) && payload.directors.length) STYLE_STATE.directors = payload.directors;
      }
      STYLE_STATE.loaded = true;
    } catch (error) {
      STYLE_STATE.loaded = false;
      console.warn('style wordlists fallback active',error);
    }
  }

  function render(){
    world.innerHTML = '';
    Object.values(S.nodes).forEach((n) => renderNode(n));
    stage.classList.toggle('has-nodes', Object.keys(S.nodes).length > 0);
    updateHUD();
    drawConns();
    applyTransform();
  }

  function renderNode(n){
    const def = getDef(n.type);
    const el = document.createElement('div');
    el.className = `node node-type-${n.type} ports-visible ${n.status || 'waiting'}${n.entering ? ' node-entering' : ''}${n.id === S.selected ? ' selected' : ''}${S.multiSelected.has(n.id) ? ' multi-selected' : ''}`;
    el.id = n.id;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = n.w + 'px';
    el.style.setProperty('--node-w', n.w + 'px');
    el.innerHTML = `${renderNodeTools(n)}
      <button class="node-del" title="删除" aria-label="删除节点">×</button>
      <button class="node-add" title="快速创建下游" aria-label="快速创建下游">＋</button>
      <div class="node-resize"></div>
      <div class="node-label"><span class="node-label-ic">${def.icon}</span><span class="node-label-text">${esc(nodeDisplayName(n))}</span>${n.status === 'running' || n.status === 'failed' ? `<span class="node-label-status status-${n.status}">${statusText(n.status)}</span>` : ''}</div>
      <div class="ports">${renderPorts(n)}</div>
      <div class="node-body"><div class="node-body-scale"><div class="controls">${renderSmartContent(n)}</div></div></div>`;
    world.appendChild(el);
    bindNode(el,n);
    requestAnimationFrame(() => {
      const nodeEl = $(n.id);
      if (nodeEl) n.h = Math.max(230, nodeEl.offsetHeight);
      n.entering = false;
      drawConns();
      updateSelectionChrome();
    });
  }

  function renderNodeTools(n){
    const def = getDef(n.type);
    const canManual = S.mode !== 'auto';
    const dynamicStep = getDynamicNextStep(n);
    const nextType = dynamicStep ? stepNodeType(dynamicStep) : getNextType(n.type);
    const openWorkflow = def.workflow ? `<button class="node-tool-btn" data-action="openWorkflow" data-tip="打开无限画布" aria-label="打开无限画布">⛶</button>` : '';
    const edit = canManual ? `<button class="node-tool-btn" data-action="editNode" data-tip="编辑" aria-label="编辑">✎</button>` : '';
    const run = !isSetupOnlyNode(n) && n.status !== 'running' && (n.status === 'waiting' || n.status === 'failed' || S.mode === 'manual') ? `<button class="node-tool-btn" data-action="runNode" data-tip="执行" aria-label="执行">▶</button>` : '';
    const cancel = n.status === 'running' ? `<button class="node-tool-btn node-cancel-btn" data-action="cancelNode" data-tip="取消" aria-label="取消">×</button>` : '';
    const next = canManual && !isSetupOnlyNode(n) && n.status === 'success' && nextType ? `<button class="node-tool-btn" data-action="nextNode" data-tip="下一步" aria-label="下一步">→</button>` : '';
    return `<div class="node-tools"><button class="node-tool-btn" data-action="focusNode" data-tip="聚焦" aria-label="聚焦">⌖</button><button class="node-tool-btn" data-action="copyNode" data-tip="复制" aria-label="复制">⧉</button>${edit}${openWorkflow}<span class="node-tool-sep"></span>${cancel}${run}${next}</div>`;
  }

  function renderPorts(n){
    const def = getDef(n.type);
    const ins = (def.inputs || []).map((p) => `<span class="port in ${isPortConnected(n.id,p,'in') ? 'connected' : ''}" data-nid="${esc(n.id)}" data-kind="${esc(p)}" data-dir="in" data-port="${esc(p)}" title="${esc(p)}" aria-label="${esc(p)}"></span>`).join('');
    const outs = (def.outputs || []).map((p) => `<span class="port out ${isPortConnected(n.id,p,'out') ? 'connected' : ''}" data-nid="${esc(n.id)}" data-kind="${esc(p)}" data-dir="out" data-port="${esc(p)}" title="${esc(p)}" aria-label="${esc(p)}"></span>`).join('');
    return `<div class="port-row in">${ins}</div><div class="port-row out">${outs}</div>`;
  }

  function renderSmartContent(n){
    const def = getDef(n.type);
    if (n.type === 'svStyle') return renderStyleContent(n);
    if (n.type === 'svInput') return renderScriptInputContent(n);
    const label = statusText(n.status);
    const output = n.data?.summary || TYPE_OUTPUT[n.type] || def.desc;
    const upstream = n.values?.upstreamSummary ? `<small>上游数据：${esc(n.values.upstreamSummary)}</small>` : '';
    const globalStyle = resolveGlobalStyle(n);
    const styleGuard = globalStyle ? `<div class="smart-style-guard"><b>全片风格继承</b>${esc(globalStyle.name)} · ${esc(globalStyle.lighting || '')}</div>` : '';
    const index = Number.isFinite(Number(n.values?.dynamicStepIndex)) ? Number(n.values.dynamicStepIndex) + 3 : flowForTrack().indexOf(n.type) + 1;
    const nodeNo = index > 0 ? String(index).padStart(2,'0') : 'M';
    const body = renderNodeBody(n);
    return `<div class="preview-card smart-card">
      <div class="smart-meta"><span>${nodeNo} · ${esc(nodeDisplayName(n))}</span><span class="smart-chip ${n.status || 'waiting'}">${label}</span></div>
      <div class="smart-title">${esc(cardTitle(n))}</div>
      <div class="smart-desc">${esc(nodeDescription(n))}</div>
      ${styleGuard}
      ${body}
      ${renderOutputPanel(n,n.status === 'success' ? '输出结果' : n.status === 'running' ? '正在执行' : '节点说明',output,upstream)}
    </div>`;
  }

  function outputActionButton(n){
    if (n.status !== 'success') return '';
    return `<button class="smart-output-action" type="button" data-action="editOutput">查看/编辑</button>`;
  }

  function renderOutputPanel(n,title,body,extra=''){
    const error = n.status === 'failed' && n.error ? `<div class="smart-output-error">${esc(n.error)}</div>` : '';
    const content = n.status === 'success'
      ? renderDeliverablePreview(n,body,extra)
      : `${esc(body || '')}${extra || ''}`;
    return `<div class="smart-output"><div class="smart-output-head"><b>${esc(title)}</b>${outputActionButton(n)}</div>${error}${content}</div>`;
  }

  function renderStyleContent(n){
    const def = getDef(n.type);
    const label = statusText(n.status);
    const presets = STYLE_STATE.presets;
    const directors = STYLE_STATE.directors;
    const values = n.values || {};
    return `<div class="preview-card smart-card">
      <div class="smart-meta"><span>01 · ${esc(def.name)}</span><span class="smart-chip ${n.status || 'waiting'}">${label}</span></div>
      <div class="smart-title">${esc(values.styleName || 'HZW电影专业质感')}</div>
      <div class="smart-desc">这是全片生成的最高级风格约束，后续所有提示词、资产图、故事板和视频都必须继承。</div>
      <div class="smart-style-actions">
        <button class="smart-style-preset-btn" type="button" data-action="applyHzwPreset">HZW 一键预设</button>
        <span class="smart-chip">${STYLE_STATE.loaded ? '词库已加载' : '使用内置预设'}</span>
      </div>
      <div class="smart-form">
        <div class="smart-field"><label>影片风格预设</label><select data-field="stylePresetId">${presets.map((preset) => `<option value="${esc(preset.id)}" ${selected(values.stylePresetId,preset.id)}>${esc(preset.name || preset.id)}</option>`).join('')}</select></div>
        <div class="smart-grid-2">
          <div class="smart-field"><label>导演风格参考</label><select data-field="directorStyleId">${directors.slice(0,28).map((director) => `<option value="${esc(director.id)}" ${selected(values.directorStyleId,director.id)}>${esc(director.name || director.id)}</option>`).join('')}</select></div>
          <div class="smart-field"><label>媒介质感</label><input data-field="medium" value="${esc(values.medium || '')}" /></div>
        </div>
        <div class="smart-grid-2">
          <div class="smart-field"><label>光影锚点</label><input data-field="lighting" value="${esc(values.lighting || '')}" /></div>
          <div class="smart-field"><label>色彩锚点</label><input data-field="colorPalette" value="${esc(values.colorPalette || '')}" /></div>
        </div>
        <div class="smart-grid-2">
          <div class="smart-field"><label>材质/画质</label><input data-field="qualityRender" value="${esc(values.qualityRender || '')}" /></div>
          <div class="smart-field"><label>镜头语言</label><input data-field="cameraLanguage" value="${esc(values.cameraLanguage || '')}" /></div>
        </div>
        <div class="smart-field"><label>风格母版摘要</label><textarea class="smart-style-bible" data-field="styleBible">${esc(values.styleBible || '')}</textarea></div>
      </div>
      ${renderOutputPanel(n,n.status === 'success' ? '输出结果' : '严格继承规则',n.status === 'success' ? (n.data?.summary || values.negativeStyle || '') : (values.negativeStyle || '禁止下游临时换风格、禁止平亮棚拍、禁止风格混杂。'))}
    </div>`;
  }

  function renderScriptInputContent(n){
    const globalStyle = resolveGlobalStyle(n);
    const styleGuard = globalStyle ? `<div class="smart-style-guard"><b>全片风格继承</b>${esc(globalStyle.name)} · ${esc(globalStyle.lighting || '')}</div>` : '';
    return `<div class="preview-card smart-card smart-script-card">
      ${styleGuard}
      <textarea class="smart-script-textarea" data-field="script" placeholder="输入一句话创意、故事梗概、剧本原文，或导入文本 / Markdown / 图片后自动填充...">${esc(n.values.script || '')}</textarea>
      <div class="smart-script-actions">
        <input class="smart-file-input" type="file" data-script-file="${esc(n.id)}" multiple accept=".txt,.md,.markdown,.json,.csv,.png,.jpg,.jpeg,.webp,.gif,image/*,text/*">
        <button class="smart-import-btn" type="button" data-action="importScriptFile">导入</button>
      </div>
      ${n.status === 'success' ? renderOutputPanel(n,'输出结果',n.data?.summary || TYPE_OUTPUT[n.type] || '') : ''}
    </div>`;
  }

  function cardTitle(n){
    if (n.type === 'svWriter' && n.data?.episodes) return `已规划 ${n.data.episodes} 集 · ${n.data.videoCount} 个视频`;
    if (n.type === 'svVideoWorkflow' && n.data?.videoCount) return `视频生成 · ${n.data.videoCount} 个视频`;
    if (n.status === 'running') return nodeDisplayName(n) + '生成中';
    if (n.status === 'success') return nodeDisplayName(n) + '已完成';
    return nodeDisplayName(n);
  }

  function renderNodeBody(n){
    if (n.type === 'svInput') {
      return '';
    }
    if (n.type === 'svStyle') {
      return `<div class="smart-grid-2">
        ${fieldSelect('quality','画质',n.values.quality,['电影级','商业广告','动漫质感','写实短剧'])}
        ${fieldSelect('director','导演风格',n.values.director,['东方悬疑','黑色电影','热血漫改','都市情绪'])}
        ${fieldSelect('light','光影',n.values.light,['雨夜霓虹','高反差硬光','柔和自然光','冷暖对撞'])}
        ${fieldSelect('action','动作流派',n.values.action,['写实动作','武侠身法','赛博追逐','静态情绪'])}
      </div>`;
    }
    if (n.type === 'svAudio') {
      return `<div class="smart-grid-2">
        ${fieldSelect('voice','旁白',n.values.voice,['冷静叙事','热血燃向','悬疑低语','轻喜剧'])}
        ${fieldSelect('music','配乐',n.values.music,['悬疑弦乐','电子暗潮','国风鼓点','环境氛围'])}
        ${fieldSelect('sfx','音效密度',n.values.sfx,['低','中等','高'])}
        ${fieldSelect('tempo','节奏',n.values.tempo,['快节奏短视频','剧情推进','情绪沉浸'])}
      </div>`;
    }
    if (n.type === 'svAgentTask') {
      const basis = Array.isArray(n.values?.dataPackBasis) ? n.values.dataPackBasis.slice(0,3).join('；') : '';
      return `<div class="smart-list">
        <span>Agent <em>${esc(n.values?.agentRole || '数据包协作')}</em></span>
        <span>任务类型 <em>${esc(n.values?.taskType || 'creative_orchestration')}</em></span>
        <span>依据 <em>${esc(basis || '等待模型输出')}</em></span>
        <span>目标 <em>${esc(n.values?.expectedOutput || '按上游数据继续推演')}</em></span>
      </div>`;
    }
    if (isWorkflowType(n.type)) {
      return `<div class="smart-thumb" aria-hidden="true"></div>`;
    }
    if (n.status === 'success') {
      return `<div class="smart-list">${renderResultRows(n)}</div>`;
    }
    return `<div class="smart-list"><span>输入 <em>${esc((getDef(n.type).inputs || ['无'])[0] || '无')}</em></span><span>输出 <em>${esc((getDef(n.type).outputs || ['data'])[0])}</em></span></div>`;
  }

  function fieldSelect(field,label,value,options){
    return `<div class="smart-field"><label>${esc(label)}</label><select data-field="${esc(field)}">${options.map((opt) => `<option ${selected(value,opt)}>${esc(opt)}</option>`).join('')}</select></div>`;
  }

  function selected(current,opt){
    return String(current || '') === opt ? 'selected' : '';
  }

  function renderResultRows(n){
    const rows = n.data?.rows || [
      ['状态','已完成'],
      ['输出', (getDef(n.type).outputs || ['data'])[0]]
    ];
    return rows.slice(0,5).map(([k,v]) => `<span>${esc(k)}<em>${esc(v)}</em></span>`).join('');
  }

  function deliverableKindForNode(n){
    const type = typeof n === 'string' ? n : n?.type;
    const map = {
      svStyle:'style_bible',
      svInput:'creative_source_intake',
      svAudio:'audio_brief',
      svWriter:'adapted_script',
      svDirector:'director_brief',
      svShotTable:'shot_table',
      svAssetCard:'asset_cards',
      svAssetWorkflow:'asset_images',
      svStoryboardWorkflow:'storyboard',
      svVideoWorkflow:'video',
      svQa:'qa_report',
      svRelease:'release_package',
      svAgentTask:'agent_deliverable',
      svCustomInput:'source_script',
      svCustomPrompt:'prompt',
      svCustomSkill:'method_pack',
      svCustomWorkflow:'workflow_result',
      svCustomReview:'qa_report'
    };
    return map[type] || 'deliverable';
  }

  function deliverableKindLabel(kind){
    const map = {
      style_bible:'全片风格母版',
      creative_source_intake:'创作源识别报告',
      source_script:'剧本输入/创作源',
      audio_brief:'音频风格方案',
      adapted_script:'改编后分话剧本',
      ad_script:'广告脚本',
      screenplay:'电影剧本',
      creative_brief:'创意简报',
      product_brief:'商品创作简报',
      audience_strategy:'人群策略',
      selling_points:'卖点提炼',
      director_brief:'导演讲戏稿',
      shot_table:'分镜剧本表',
      asset_cards:'资产卡',
      asset_images:'资产图',
      product_images:'商品图',
      storyboard:'故事板',
      prompt:'提示词',
      video:'视频成片',
      qa_report:'QA 审核报告',
      release_package:'发布包',
      method_pack:'方法论/数据包',
      workflow_result:'画布工作流结果',
      agent_deliverable:'智能节点交付物',
      active_pack_deliverable:'创作库节点交付物',
      deliverable:'节点交付物'
    };
    return map[kind] || map.deliverable;
  }

  function deliverableTitleForNode(n){
    const map = {
      svStyle:'全片风格母版已锁定',
      svInput:'创作源已解析',
      svAudio:'音频风格方案',
      svWriter:'改编后分话剧本',
      svDirector:'导演讲戏稿',
      svShotTable:'分镜剧本表',
      svAssetCard:'角色/场景/道具资产卡',
      svAssetWorkflow:'资产图生成结果',
      svStoryboardWorkflow:'故事板生成结果',
      svVideoWorkflow:'视频生成结果',
      svQa:'QA 审核报告',
      svRelease:'发布包交付结果',
      svAgentTask:nodeDisplayName(n) || '智能节点交付物',
      svCustomWorkflow:'画布工作流结果'
    };
    return map[n?.type] || `${nodeDisplayName(n)}交付物`;
  }

  function rowsToDeliverableItems(rows){
    if (!Array.isArray(rows)) return [];
    return rows.slice(0,6).map((row) => {
      const title = Array.isArray(row) ? row[0] : row?.title;
      const description = Array.isArray(row) ? row[1] : row?.description;
      return {title:String(title || '结果项'),description:String(description || '')};
    });
  }

  function firstText(...values){
    for (const value of values) {
      if (value === null || value === undefined) continue;
      const text = typeof value === 'string' ? value : String(value);
      if (text.trim()) return text;
    }
    return '';
  }

  function normalizeDeliverableItem(item,kind,index=0){
    const raw = item && typeof item === 'object' ? item : {description:String(item || '')};
    const id = firstText(raw.id,raw.key,raw.shotId,raw.assetId,raw.videoId,`${kind}-${index + 1}`);
    const title = firstText(raw.title,raw.name,raw.shotTitle,raw.assetName,raw.videoTitle,raw.scene,raw.segmentTitle,`条目 ${index + 1}`);
    const description = firstText(raw.description,raw.summary,raw.preview,raw.content,raw.value,raw.beatSummary,raw.outputGoal);
    const assetPath = firstText(raw.assetPath,raw.path,raw.url,raw.src,raw.outputPath,raw.imagePath,raw.videoPath,raw.mediaPath);
    return {
      ...raw,
      id,
      title,
      description,
      episode:firstText(raw.episode,raw.episodeNo,raw.ep),
      segment:firstText(raw.segment,raw.segmentNo,raw.part,raw.timeRange),
      scene:firstText(raw.scene,raw.sceneTitle,raw.location),
      shotNo:firstText(raw.shotNo,raw.shot,raw.index,raw.no,raw.cameraNo),
      timeRange:firstText(raw.timeRange,raw.duration,raw.durationSeconds,raw.seconds),
      visual:firstText(raw.visual,raw.image,raw.frame,raw.picture,raw.screen,raw.frameDescription),
      action:firstText(raw.action,raw.motion,raw.performance,raw.characterAction),
      dialogue:firstText(raw.dialogue,raw.line,raw.lines,raw.voiceover,raw.subtitle),
      camera:firstText(raw.camera,raw.lens,raw.cameraMove,raw.shotType),
      assetType:firstText(raw.assetType,raw.type,raw.category,raw.kind),
      prompt:firstText(raw.prompt,raw.positivePrompt,raw.imagePrompt,raw.videoPrompt),
      negativePrompt:firstText(raw.negativePrompt,raw.negative),
      referenceImage:firstText(raw.referenceImage,raw.reference,raw.refImage),
      assetPath,
      mediaPath:assetPath,
      status:firstText(raw.status,raw.state,'待确认')
    };
  }

  function normalizeDeliverableItems(items,kind){
    const list = Array.isArray(items) ? items : [];
    return list.map((item,index) => normalizeDeliverableItem(item,kind,index)).filter((item) => item.title || item.description || item.assetPath);
  }

  function inferDeliverableBody(n,data){
    if (!data) return '';
    const output = data.output && typeof data.output === 'object' ? data.output : {};
    const candidates = [
      data.body,
      data.markdown,
      data.content,
      output.userFacingText,
      output.readableText,
      output.markdown,
      output.script,
      output.adaptedScript,
      output.shotTableMarkdown,
      output.assetCardsMarkdown,
      output.promptText,
      n?.type === 'svStyle' ? data.globalStyle?.styleBible : '',
      n?.type === 'svInput' ? (data.script || data.sourceScript) : ''
    ];
    const found = candidates.find((item) => typeof item === 'string' && item.trim());
    return found || '';
  }

  function defaultDeliverableForNode(n,dataOverride=null){
    const data = dataOverride || n?.data || {};
    const rows = Array.isArray(data.rows) ? data.rows : [];
    const kind = deliverableKindForNode(n);
    const workflowResult = isWorkflowType(n?.type);
    const output = data.output && typeof data.output === 'object' ? data.output : {};
    const outputItems = normalizeDeliverableItems(output.items, kind);
    return {
      kind,
      title:output.title || deliverableTitleForNode(n),
      summary:data.summary || output.summary || TYPE_OUTPUT[n?.type] || getDef(n?.type).desc,
      body:inferDeliverableBody(n,data),
      items:outputItems.length ? outputItems : rowsToDeliverableItems(rows),
      primaryArtifactLabel:workflowResult ? deliverableKindLabel(kind) : (data.primaryArtifactLabel || output.primaryArtifactLabel || ''),
      primaryArtifactPath:workflowResult ? '已生成后台画布任务，点击编辑进入无限画布查看/执行' : (data.primaryArtifactPath || output.primaryArtifactPath || '')
    };
  }

  function deliverableBodyLabel(kind){
    const map = {
      style_bible:'风格母版正文',
      creative_source_intake:'创作源识别正文',
      source_script:'剧本 / 创作源正文',
      audio_brief:'音频风格说明',
      adapted_script:'改编后分话剧本',
      director_brief:'导演讲戏正文',
      shot_table:'分镜表正文',
      asset_cards:'资产卡正文',
      asset_images:'资产图生成说明',
      product_images:'商品图生成说明',
      storyboard:'故事板说明',
      prompt:'提示词正文',
      video:'视频生成说明',
      qa_report:'审核报告正文',
      release_package:'发布包说明'
    };
    return map[kind] || '交付物正文 / 可读预览';
  }

  function deliverableItemsForEditor(n,d){
    const source = Array.isArray(d.items) ? d.items.filter(Boolean) : [];
    if (source.length) return source;
    const data = n.data || {};
    const rows = rowsToDeliverableItems(data.rows || []);
    if (rows.length) return rows;
    const count = Math.min(8,Math.max(1,Number(data.videoCount || data.episodePlan?.videoCount || 3)));
    if (d.kind === 'shot_table') return Array.from({length:count},(_,i) => ({title:`分镜段 ${String(i + 1).padStart(2,'0')}`,description:'等待大模型生成镜头画面、动作、对白和时长。',status:'待确认'}));
    if (d.kind === 'asset_cards') return ['角色资产','场景资产','道具资产'].map((title) => ({title,description:'等待按分镜表拆分资产卡。'}));
    if (['asset_images','product_images','storyboard','video'].includes(d.kind)) return Array.from({length:count},(_,i) => ({title:`${deliverableKindLabel(d.kind)} ${String(i + 1).padStart(2,'0')}`,description:'等待无限画布渲染返回结果。'}));
    return [];
  }

  function itemDescription(item){
    if (!item || typeof item !== 'object') return String(item || '');
    return item.description || item.preview || item.value || item.content || item.summary || '';
  }

  function itemPath(item){
    if (!item || typeof item !== 'object') return '';
    return item.assetPath || item.path || item.url || item.src || item.outputPath || '';
  }

  function isImagePath(path){
    return /\.(png|jpe?g|webp|gif|avif|svg)$/i.test(String(path || '').split('?')[0]);
  }

  function isVideoPath(path){
    return /\.(mp4|mov|webm|m4v)$/i.test(String(path || '').split('?')[0]);
  }

  function mediaSrcForPath(path){
    const raw = String(path || '').trim();
    if (!raw) return '';
    if (/^(https?:|data:|blob:|\/read\?|\/tools\/|\/wordlists\/)/i.test(raw)) return raw;
    if (raw.startsWith('/')) return raw;
    let safe = raw.split('#')[0].split('?')[0].replace(/\\/g,'/').replace(/^\.?\//,'');
    safe = safe.replace(/^smart-vision\/outputs\//,'').replace(/^outputs\//,'');
    if (!safe || safe.includes('\0') || safe.split('/').some((part) => part === '..')) return raw;
    return `/read?path=${encodeURIComponent(safe)}&raw=1`;
  }

  function renderDeliverableTable(items){
    const rows = items.slice(0,16).map((item,index) => {
      const title = item.title || item.name || `条目 ${index + 1}`;
      const desc = itemDescription(item);
      const status = item.status || item.state || '可查看';
      return `<tr><td>${String(index + 1).padStart(2,'0')}</td><td>${esc(title)}</td><td>${esc(shortText(desc,260))}</td><td>${esc(status)}</td></tr>`;
    }).join('');
    return `<table class="smart-deliverable-table">
      <thead><tr><th>序号</th><th>镜头/段落</th><th>内容</th><th>状态</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderShotDeliverableTable(items){
    const rows = items.slice(0,24).map((item,index) => {
      const shot = item.shotNo || String(index + 1).padStart(2,'0');
      const scene = firstText(item.scene,item.segment,item.episode,'待定场景');
      const time = item.timeRange || '待定';
      const visual = firstText(item.visual,item.description,item.action);
      const action = firstText(item.action,item.camera);
      const dialogue = firstText(item.dialogue,item.prompt);
      return `<tr><td>${esc(shot)}</td><td>${esc(time)}</td><td>${esc(scene)}</td><td>${esc(shortText(visual,220))}</td><td>${esc(shortText(action || dialogue,180))}</td><td>${esc(item.status || '待确认')}</td></tr>`;
    }).join('');
    return `<table class="smart-deliverable-table">
      <thead><tr><th>镜号</th><th>时长</th><th>场景</th><th>画面</th><th>动作/对白</th><th>状态</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderDeliverableCardGrid(items){
    return `<div class="smart-deliverable-cardgrid">${items.slice(0,12).map((item,index) => {
      const title = item.title || item.name || `资产 ${index + 1}`;
      const desc = itemDescription(item);
      const meta = firstText(item.assetType,item.status);
      const prompt = item.prompt ? `<span>提示词：${esc(shortText(item.prompt,180))}</span>` : '';
      return `<div class="smart-deliverable-card">${meta ? `<code>${esc(meta)}</code>` : ''}<b>${esc(title)}</b><span>${esc(shortText(desc,220))}</span>${prompt}</div>`;
    }).join('')}</div>`;
  }

  function renderMediaGrid(items,kind){
    return `<div class="smart-media-grid">${items.slice(0,12).map((item,index) => {
      const title = item.title || item.name || `${deliverableKindLabel(kind)} ${index + 1}`;
      const desc = itemDescription(item);
      const path = itemPath(item);
      const src = mediaSrcForPath(path);
      let media = '';
      if (isImagePath(path)) media = `<img src="${esc(src)}" alt="${esc(title)}">`;
      else if (isVideoPath(path)) media = `<video src="${esc(src)}" muted playsinline controls></video>`;
      const meta = [item.status,path].filter(Boolean).join(' · ');
      return `<div class="smart-media-tile"><div class="smart-media-thumb">${media}</div><div class="smart-media-meta"><b>${esc(title)}</b><span>${esc(shortText(desc || meta || '等待渲染结果返回',160))}</span>${meta ? `<span>${esc(shortText(meta,180))}</span>` : ''}</div></div>`;
    }).join('')}</div>`;
  }

  function renderDeliverableDetailEditor(n,d){
    const items = deliverableItemsForEditor(n,d);
    const body = `<div class="smart-field"><label>${esc(deliverableBodyLabel(d.kind))}</label><textarea data-output-field="body">${esc(d.body || '')}</textarea></div>`;
    if (d.kind === 'shot_table') {
      return `<div class="smart-deliverable-section"><div class="smart-deliverable-section-head">分镜剧本表 <small>${items.length} 项</small></div>${renderShotDeliverableTable(items)}${body}</div>`;
    }
    if (d.kind === 'asset_cards') {
      return `<div class="smart-deliverable-section"><div class="smart-deliverable-section-head">资产卡列表 <small>角色 / 场景 / 道具</small></div>${renderDeliverableCardGrid(items)}${body}</div>`;
    }
    if (['asset_images','product_images','storyboard','video'].includes(d.kind)) {
      const workflowAction = isWorkflowType(n.type) ? `<div class="smart-editor-action-row"><button class="smart-editor-action" type="button" data-editor-action="openWorkflow">进入无限画布查看/执行</button></div>` : '';
      return `<div class="smart-deliverable-section"><div class="smart-deliverable-section-head">${esc(deliverableKindLabel(d.kind))}交付区 <small>${items.length} 项</small></div>${renderMediaGrid(items,d.kind)}${workflowAction}${body}</div>`;
    }
    if (d.kind === 'qa_report' || d.kind === 'release_package') {
      return `<div class="smart-deliverable-section"><div class="smart-deliverable-section-head">${esc(deliverableKindLabel(d.kind))} <small>门禁结果</small></div>${items.length ? renderDeliverableTable(items) : ''}${body}</div>`;
    }
    return body;
  }

  function normalizeDeliverable(n,dataOverride=null){
    const data = dataOverride || n?.data || {};
    const output = data.output && typeof data.output === 'object' ? data.output : {};
    const raw = [
      data.userDeliverable,
      data.deliverable,
      data.customerDeliverable,
      data.readableDeliverable,
      output.userDeliverable,
      output.deliverable,
      output.customerDeliverable,
      output.readableDeliverable,
      data.llmResult?.userDeliverable,
      data.llmResult?.deliverable
    ]
      .find((item) => item && typeof item === 'object') || {};
    const fallback = defaultDeliverableForNode(n,data);
    const items = normalizeDeliverableItems(Array.isArray(raw.items) && raw.items.length ? raw.items : fallback.items, raw.kind || fallback.kind);
    return {
      ...fallback,
      ...raw,
      kind:raw.kind || fallback.kind,
      title:raw.title || fallback.title,
      summary:raw.summary || fallback.summary,
      body:raw.body || raw.markdown || raw.content || fallback.body,
      items,
      primaryArtifactLabel:raw.primaryArtifactLabel || fallback.primaryArtifactLabel,
      primaryArtifactPath:raw.primaryArtifactPath || fallback.primaryArtifactPath
    };
  }

  function renderDeliverablePreview(n,fallbackBody='',extra=''){
    const d = normalizeDeliverable(n);
    const summary = d.summary || fallbackBody || '';
    const body = d.body && d.body !== summary ? `<div class="smart-deliverable-body">${esc(shortText(d.body,900))}</div>` : '';
    const items = Array.isArray(d.items) && d.items.length
      ? `<div class="smart-deliverable-items">${d.items.slice(0,3).map((item) => `<div class="smart-deliverable-item"><b>${esc(item.title || item.name || '结果项')}</b><span>${esc(shortText(item.description || item.preview || item.value || '',180))}</span></div>`).join('')}</div>`
      : '';
    const artifact = d.primaryArtifactLabel
      ? `<div class="smart-deliverable-artifact">${esc(d.primaryArtifactLabel)}：${esc(d.primaryArtifactPath || '已生成')}</div>`
      : '';
    return `<div class="smart-deliverable">
      <span class="smart-deliverable-kind">${esc(deliverableKindLabel(d.kind))}</span>
      <div class="smart-deliverable-title">${esc(d.title || deliverableTitleForNode(n))}</div>
      ${summary ? `<div class="smart-deliverable-summary">${esc(shortText(summary,420))}</div>` : ''}
      ${body}
      ${items}
      ${artifact}
      ${extra || ''}
    </div>`;
  }

  function attachUserDeliverable(n,data,deliverable={}){
    const merged = {...data,userDeliverable:{...(data.userDeliverable || {}),...deliverable}};
    const normalized = normalizeDeliverable(n,merged);
    return {
      ...data,
      summary:data.summary || normalized.summary,
      userDeliverable:normalized
    };
  }

  function isPortConnected(nodeId,port,dir){
    return S.conns.some((c) => dir === 'in' ? c.to === nodeId && c.toPort === port : c.from === nodeId && c.fromPort === port);
  }

  function updateNodeSelection(){
    Object.values(S.nodes).forEach((n) => {
      const el = $(n.id);
      if (!el) return;
      el.classList.toggle('selected', n.id === S.selected);
      el.classList.toggle('multi-selected', S.multiSelected.has(n.id));
    });
    updateSelectionChrome();
    drawMinimap();
  }

  function selectedBounds(){
    const ids = selectedNodeIds();
    if (!ids.length) return null;
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    ids.forEach((id) => {
      const n = S.nodes[id];
      if (!n) return;
      minX = Math.min(minX,n.x);
      minY = Math.min(minY,n.y);
      maxX = Math.max(maxX,n.x + n.w);
      maxY = Math.max(maxY,n.y + (n.h || 250));
    });
    if (!Number.isFinite(minX)) return null;
    return {x:minX,y:minY,w:maxX - minX,h:maxY - minY,count:ids.length};
  }

  function updateSelectionChrome(){
    const box = $('selBbox');
    const toolbar = $('selToolbar');
    const count = selectedNodeIds().length;
    const badge = $('selCount');
    if (badge) {
      badge.style.display = count > 1 ? '' : 'none';
      badge.textContent = '已选 ' + count;
    }
    if (!box || !toolbar || count < 2) {
      box?.classList.remove('show');
      toolbar?.classList.remove('show');
      return;
    }
    const b = selectedBounds();
    if (!b) return;
    box.style.left = b.x * S.scale + S.tx + 'px';
    box.style.top = b.y * S.scale + S.ty + 'px';
    box.style.width = b.w * S.scale + 'px';
    box.style.height = b.h * S.scale + 'px';
    box.classList.add('show');
    toolbar.style.left = b.x * S.scale + S.tx + (b.w * S.scale) / 2 + 'px';
    toolbar.style.top = Math.max(16,b.y * S.scale + S.ty - 54) + 'px';
    $('selToolbarCount').textContent = count;
    toolbar.classList.add('show');
  }

  function clearSelection(){
    S.selected = null;
    S.multiSelected.clear();
    S.selectedConns.clear();
    updateNodeSelection();
    drawConns();
  }

  function selectNode(id,{add=false,toggle=false}={}){
    if (!S.nodes[id]) return;
    if (toggle) {
      if (S.multiSelected.has(id)) S.multiSelected.delete(id);
      else S.multiSelected.add(id);
      S.selected = S.multiSelected.has(id) ? id : ([...S.multiSelected][0] || null);
      updateNodeSelection();
      return;
    }
    if (!add) S.multiSelected.clear();
    S.selected = id;
    if (add) S.multiSelected.add(id);
    updateNodeSelection();
  }

  function hideMarquee(){
    const mq = $('marquee');
    if (mq) {
      mq.style.display = 'none';
      mq.style.left = '0';
      mq.style.top = '0';
      mq.style.width = '0';
      mq.style.height = '0';
    }
    stage.classList.remove('marqueeing');
    S.marquee = null;
  }

  function bindNode(el,n){
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const target = e.target;
      if (target.closest('button,input,textarea,select')) return;
      const port = target.closest('.port');
      if (port) {
        startConnect(e,n,port);
        return;
      }
      if (target.closest('.node-resize')) {
        S.resize = {id:n.id,startX:e.clientX,startY:e.clientY,w:n.w,pointerId:e.pointerId};
        el.classList.add('node-resizing');
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
      const additive = e.shiftKey || e.metaKey || e.ctrlKey;
      if (additive) selectNode(n.id,{toggle:true});
      else if (!S.multiSelected.has(n.id)) selectNode(n.id);
      else {
        S.selected = n.id;
        updateNodeSelection();
      }
      if (target.closest('.node-label,.preview-card,.node-body')) {
        const dragIds = S.multiSelected.has(n.id) && S.multiSelected.size > 1 ? [...S.multiSelected] : [n.id];
        S.drag = {
          id:n.id,
          ids:dragIds,
          multi:dragIds.length > 1,
          startX:e.clientX,
          startY:e.clientY,
          x:n.x,
          y:n.y,
          offsets:dragIds.map((id) => ({id,x:S.nodes[id].x,y:S.nodes[id].y})),
          pointerId:e.pointerId,
          moved:false
        };
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
    el.addEventListener('input', (e) => {
	      const field = e.target?.dataset?.field;
	      if (!field) return;
	      S.nodes[n.id].values[field] = e.target.value;
	      if (n.type === 'svStyle') lockStyleNode(n.id);
	    });
    el.addEventListener('change', (e) => {
      if (e.target?.matches?.('input[type="file"][data-script-file]')) {
        void handleScriptFileImport(n.id,e.target.files);
        e.target.value = '';
        return;
      }
      const field = e.target?.dataset?.field;
      if (!field) return;
      if (n.type === 'svStyle' && field === 'stylePresetId') {
        applyStylePreset(n.id,e.target.value);
        return;
      }
      if (n.type === 'svStyle' && field === 'directorStyleId') {
        applyDirectorStyle(n.id,e.target.value);
        return;
      }
	      S.nodes[n.id].values[field] = e.target.value;
	      if (n.type === 'svStyle') {
	        lockStyleNode(n.id);
	        render();
	      }
	    });
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      if (btn.classList.contains('node-del')) deleteNode(n.id);
      if (btn.classList.contains('node-add')) quickDownstream(n.id,true);
      if (action) handleNodeAction(action,n.id);
      e.stopPropagation();
    });
  }

  function handleNodeAction(action,id){
    if (action === 'focusNode') focusNode(id);
    if (action === 'copyNode') copyNode(id);
    if (action === 'editNode') editNode(id);
    if (action === 'editOutput') editOutput(id);
    if (action === 'openWorkflow') openWorkflowEditor(id);
    if (action === 'importScriptFile') triggerScriptImport(id);
    if (action === 'applyHzwPreset') applyStylePreset(id,HZW_PRESET_ID);
    if (action === 'applyStylePreset') applyStylePreset(id);
    if (action === 'runNode') runNode(id);
    if (action === 'cancelNode') cancelNode(id);
    if (action === 'nextNode') quickDownstream(id,true);
  }

  function triggerScriptImport(id){
    const input = $(id)?.querySelector('input[type="file"][data-script-file]');
    input?.click();
  }

  function lockStyleNode(id){
    const n = S.nodes[id];
    if (!n || n.type !== 'svStyle') return;
    n.status = 'success';
    n.error = '';
    n.data = makeNodeOutput(n);
    propagateGlobalStyle(id);
  }

  function applyStylePreset(id,presetId){
    const n = S.nodes[id];
    if (!n || n.type !== 'svStyle') return;
    const preset = findStylePreset(presetId || n.values?.stylePresetId || HZW_PRESET_ID);
    const prevDirector = n.values?.directorStyleId || 'generic';
    n.values = {...n.values,...styleValuesFromPreset(preset),directorStyleId:prevDirector};
    n.values.styleBible = makeStyleBibleText(preset,findDirectorStyle(prevDirector));
    lockStyleNode(id);
    render();
    toast(`${preset.name || '风格预设'}已应用为全片风格母版`);
  }

  function applyDirectorStyle(id,directorId){
    const n = S.nodes[id];
    if (!n || n.type !== 'svStyle') return;
    const director = findDirectorStyle(directorId || n.values?.directorStyleId || 'generic');
    n.values.directorStyleId = director.id;
    n.values.styleBible = makeStyleBibleText(findStylePreset(n.values.stylePresetId),director);
    lockStyleNode(id);
    render();
  }

  function propagateGlobalStyle(styleNodeId){
    const styleNode = S.nodes[styleNodeId];
    if (!styleNode || styleNode.type !== 'svStyle') return;
    const globalStyle = buildGlobalStyle(styleNode);
    const queue = S.conns.filter((c) => c.from === styleNodeId).map((c) => c.to);
    const seen = new Set();
    while (queue.length) {
      const id = queue.shift();
      if (!id || seen.has(id) || !S.nodes[id]) continue;
      seen.add(id);
      const node = S.nodes[id];
      node.values.globalStyle = JSON.parse(JSON.stringify(globalStyle));
      if (node.data) node.data.globalStyle = JSON.parse(JSON.stringify(globalStyle));
      S.conns.filter((c) => c.from === id).forEach((c) => queue.push(c.to));
    }
  }

  async function handleScriptFileImport(id,files){
    const n = S.nodes[id];
    if (!n || !files?.length) return;
    const list = Array.from(files);
    n.values.fileName = list.map((file) => file.name).join('、');
    setStatus('正在导入并识别资料',true);
    render();
    try {
      const importResult = await importFilesViaBridge(list);
      const importedText = String(importResult?.combinedText || '').trim();
      if (importedText) n.values.script = importedText;
      n.values.importResult = compactValueForLlm(importResult || {},0);
      n.values.importedFiles = Array.isArray(importResult?.artifactPaths) ? importResult.artifactPaths.map(String).filter(Boolean) : [];
      n.values.referenceImages = Array.isArray(importResult?.items)
        ? importResult.items.filter((item) => item.kind === 'image' && item.artifactPath).map((item) => item.artifactPath)
        : [];
      n.status = 'waiting';
      setStatus('导入识别完成',false);
      render();
      toast('导入内容已填入剧本输入框');
    } catch (error) {
      const fallbackText = await localImportFiles(list);
      if (fallbackText) n.values.script = fallbackText;
      n.status = 'waiting';
      setStatus('导入完成，识别服务未连通',false);
      render();
      toast(`导入已回填：${error instanceof Error ? error.message : String(error)}`,'warn');
    }
  }

  async function importFilesViaBridge(files){
    const payloadFiles = await Promise.all(files.map(fileToCreativeImportPayload));
    const response = await fetch(`${getBridgeBase()}/api/smart-vision/creative/import`,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({files:payloadFiles,executionModel:getExecutionModel()})
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || !payload.ok) throw new Error(payload.error || `Bridge HTTP ${response.status}`);
    return payload.data || {};
  }

  async function fileToCreativeImportPayload(file){
    const isImage = /^image\//i.test(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name);
    return {
      fileName:file.name,
      mimeType:file.type || (isImage ? 'image/*' : 'text/plain'),
      text:isImage ? '' : await file.text(),
      dataUrl:isImage ? await fileToDataUrl(file) : ''
    };
  }

  function fileToDataUrl(file){
    return new Promise((resolve,reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('file read failed'));
      reader.readAsDataURL(file);
    });
  }

  async function localImportFiles(files){
    const parts = [];
    for (const file of files) {
      if (/^image\//i.test(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name)) {
        parts.push(fallbackImageImport(file));
      } else {
        parts.push(await readTextImport(file));
      }
    }
    return parts.filter(Boolean).join('\n\n').trim();
  }

  async function readTextImport(file){
    const text = await file.text();
    if (/\.json$/i.test(file.name)) {
      try {
        return JSON.stringify(JSON.parse(text),null,2);
      } catch {
        return text;
      }
    }
    return text;
  }

  function fallbackImageImport(file){
    return [
      `【图片资料：${file.name}】`,
      '识别服务未连通，已作为参考图资料进入剧本输入。',
      '请基于这张图片补充画面文字、人物、场景、道具、动作和剧情线索。'
    ].join('\n');
  }

  function startConnect(e,n,port){
    const dir = port.dataset.dir;
    const anchor = nodeAnchor(n,dir === 'in' ? 'in' : 'out');
    S.connect = dir === 'in'
      ? {dir:'in',to:n.id,toPort:port.dataset.port,kind:port.dataset.port,x:anchor.x,y:anchor.y,mouseX:e.clientX,mouseY:e.clientY}
      : {dir:'out',from:n.id,fromPort:port.dataset.port,kind:port.dataset.port,x:anchor.x,y:anchor.y,mouseX:e.clientX,mouseY:e.clientY};
    stage.classList.add('connecting');
    port.classList.add('port-dragging');
    e.preventDefault();
    e.stopPropagation();
    drawConns();
  }

  function connectionExists(match){
    return S.conns.some((c) => Object.entries(match).every(([key,value]) => c[key] === value));
  }

  function commitConnection(from,fromPort,to,toPort,{message='已连接并传导上游数据'}={}){
    if (!S.nodes[from] || !S.nodes[to] || from === to) {
      toast('连接失败：节点不存在或不能连接自身','warn');
      cancelConnect();
      return false;
    }
    if (connectionExists({from,fromPort,to,toPort})) {
      toast('这条连线已经存在','warn');
      cancelConnect();
      return false;
    }
    S.conns = S.conns.filter((c) => !(c.to === to && c.toPort === toPort));
    S.conns.push({from,fromPort,to,toPort});
    passData(from,to);
    S.selected = to;
    S.multiSelected.clear();
    cancelConnect();
    render();
    if (message) toast(message);
    return true;
  }

  function finishConnect(e){
    if (!S.connect) return;
    const target = document.elementFromPoint(e.clientX,e.clientY);
    const nodeEl = target?.closest?.('.node');
    const port = target?.closest?.('.port');
    if (S.connect.dir === 'in') {
      if (port?.dataset?.dir === 'out' && nodeEl?.id && nodeEl.id !== S.connect.to) {
        return commitConnection(nodeEl.id,port.dataset.port,S.connect.to,S.connect.toPort);
      }
      if (nodeEl?.id && nodeEl.id !== S.connect.to) {
        const fromPort = firstOutput(nodeEl.id);
        if (fromPort) return commitConnection(nodeEl.id,fromPort,S.connect.to,S.connect.toPort);
      }
      return openConnectPicker(e.clientX,e.clientY);
    }
    if (port?.dataset?.dir === 'in' && nodeEl?.id && nodeEl.id !== S.connect.from) {
      return commitConnection(S.connect.from,S.connect.fromPort,nodeEl.id,port.dataset.port);
    }
    if (nodeEl?.id && nodeEl.id !== S.connect.from) {
      const toPort = firstInput(nodeEl.id);
      if (toPort) return commitConnection(S.connect.from,S.connect.fromPort,nodeEl.id,toPort);
    }
    openConnectPicker(e.clientX,e.clientY);
  }

  function cancelConnect(){
    S.connect = null;
    stage.classList.remove('connecting');
    document.querySelectorAll('.node.connect-target').forEach((el) => el.classList.remove('connect-target'));
    document.querySelectorAll('.port.connect-hover,.port.port-dragging').forEach((el) => el.classList.remove('connect-hover','port-dragging'));
    drawConns();
  }

  function firstInput(id){
    const n = S.nodes[id];
    return n ? (getDef(n.type).inputs || [])[0] : '';
  }

  function firstOutput(id){
    const n = S.nodes[id];
    return n ? (getDef(n.type).outputs || [])[0] : '';
  }

  function previousType(type){
    const flow = flowForTrack();
    const index = flow.indexOf(type);
    return index > 0 ? flow[index - 1] : '';
  }

  function preferredNextTypeForNode(node){
    const dynamicStep = getDynamicNextStep(node);
    if (dynamicStep) return stepNodeType(dynamicStep);
    if (S.track !== 'custom' && node?.type !== 'svStyle') return '';
    return getNextType(node?.type);
  }

  function connectCreateTypes(){
    if (!S.pendingConnect) return [];
    const flow = flowForTrack();
    const types = S.track === 'custom' ? CUSTOM_FLOW : Object.keys(NODE_DEFS);
    const preferred = S.pendingConnect.dir === 'in'
      ? previousType(S.nodes[S.pendingConnect.to]?.type)
      : preferredNextTypeForNode(S.nodes[S.pendingConnect.from]);
    const valid = types.filter((type) => {
      const def = getDef(type);
      return S.pendingConnect.dir === 'in' ? (def.outputs || []).length : (def.inputs || []).length;
    });
    return preferred ? [preferred,...valid.filter((type) => type !== preferred && flow.includes(type))] : valid;
  }

  function openConnectPicker(screenX,screenY){
    if (!S.connect) return;
    const p = screenToWorld(screenX,screenY);
    S.pendingConnect = {...S.connect,x:p.x,y:p.y,screenX,screenY};
    S.connect = null;
    stage.classList.remove('connecting');
    openPicker({x:p.x,y:p.y,screenX,screenY},{keepPending:true});
    toast('选择一个节点来完成连线');
    drawConns();
  }

  function completePendingConnection(type){
    const pending = S.pendingConnect;
    if (!pending) return false;
    const def = getDef(type);
    const x = pending.dir === 'in' ? pending.x - (def.w || 360) - 80 : pending.x;
    const node = createNode(type,x,pending.y - 80,{});
    if (pending.dir === 'in') {
      const out = (def.outputs || [])[0];
      if (!out) return false;
      commitConnection(node.id,out,pending.to,pending.toPort,{message:'已创建上游节点并完成连线'});
    } else {
      const input = (def.inputs || [])[0];
      if (!input) return false;
      commitConnection(pending.from,pending.fromPort,node.id,input,{message:'已创建下游节点并完成连线'});
    }
    S.pendingConnect = null;
    return true;
  }

  function deleteNode(id){
    delete S.nodes[id];
    S.conns = S.conns.filter((c) => c.from !== id && c.to !== id);
    S.multiSelected.delete(id);
    if (S.selected === id) S.selected = Object.keys(S.nodes)[0] || null;
    render();
  }

  function copyNode(id){
    const n = S.nodes[id];
    if (!n) return;
    const copy = createNode(n.type,n.x + 36,n.y + 36,JSON.parse(JSON.stringify(n.values || {})));
    copy.status = 'waiting';
    S.selected = copy.id;
    render();
    toast('节点已复制');
  }

  function selectedNodeIds(){
    if (S.multiSelected.size) return [...S.multiSelected].filter((id) => S.nodes[id]);
    return S.selected && S.nodes[S.selected] ? [S.selected] : [];
  }

  function copySelectionToClipboard(){
    const ids = selectedNodeIds();
    if (!ids.length) return false;
    const idSet = new Set(ids);
    const nodes = ids.map((id) => {
      const n = S.nodes[id];
      return {
        oldId:id,
        type:n.type,
        x:n.x,
        y:n.y,
        w:n.w,
        status:n.status,
        values:JSON.parse(JSON.stringify(n.values || {})),
        data:JSON.parse(JSON.stringify(n.data || {}))
      };
    });
    const conns = S.conns
      .filter((c) => idSet.has(c.from) && idSet.has(c.to))
      .map((c) => ({...c}));
    S.clipboard = {nodes,conns};
    S.pasteCount = 0;
    toast(`已复制 ${nodes.length} 个节点`);
    return true;
  }

  function pasteClipboard(){
    if (!S.clipboard?.nodes?.length) return false;
    S.pasteCount += 1;
    const offset = 42 * S.pasteCount;
    const idMap = new Map();
    S.multiSelected.clear();
    S.selectedConns.clear();
    S.clipboard.nodes.forEach((item) => {
      const node = createNode(item.type,item.x + offset,item.y + offset,JSON.parse(JSON.stringify(item.values || {})));
      node.w = item.w || node.w;
      node.status = 'waiting';
      node.data = JSON.parse(JSON.stringify(item.data || {}));
      idMap.set(item.oldId,node.id);
      S.multiSelected.add(node.id);
      S.selected = node.id;
    });
    S.clipboard.conns.forEach((c) => {
      const from = idMap.get(c.from);
      const to = idMap.get(c.to);
      if (from && to) S.conns.push({...c,from,to});
    });
    render();
    toast(`已粘贴 ${S.multiSelected.size} 个节点`);
    return true;
  }

  function deleteSelection(){
    const ids = selectedNodeIds();
    if (!ids.length) return false;
    const idSet = new Set(ids);
    ids.forEach((id) => delete S.nodes[id]);
    S.conns = S.conns.filter((c) => !idSet.has(c.from) && !idSet.has(c.to));
    S.multiSelected.clear();
    S.selectedConns.clear();
    S.selected = null;
    render();
    toast(`已删除 ${ids.length} 个节点`);
    return true;
  }

  function cutSelectionToClipboard(){
    if (!copySelectionToClipboard()) return false;
    deleteSelection();
    return true;
  }

  function getNextType(type){
    const flow = flowForTrack();
    const index = flow.indexOf(type);
    if (index < 0 || index >= flow.length - 1) return '';
    return flow[index + 1];
  }

  function findDownstream(id){
    const conn = S.conns.find((c) => c.from === id);
    return conn ? S.nodes[conn.to] : null;
  }

  function normalizeDynamicSteps(plan){
    const steps = Array.isArray(plan?.steps) ? plan.steps : [];
    return steps.map((raw,index) => {
      const taskType = String(raw?.taskType || raw?.type || '').trim() || 'creative_orchestration';
      return {
        ...raw,
        id:String(raw?.id || `dynamic-step-${index + 1}`),
        nodeType:stepNodeType(raw),
        title:String(raw?.title || raw?.name || `数据包任务 ${index + 1}`),
        taskType,
        pipelinePhase:String(raw?.pipelinePhase || raw?.phase || ''),
        agentRole:String(raw?.agentRole || raw?.agent || raw?.role || ''),
        skillIds:Array.isArray(raw?.skillIds) ? raw.skillIds.map(String) : Array.isArray(raw?.skills) ? raw.skills.map(String) : [],
        inputArtifacts:Array.isArray(raw?.inputArtifacts) ? raw.inputArtifacts.map(String) : [],
        outputArtifacts:Array.isArray(raw?.outputArtifacts) ? raw.outputArtifacts.map(String) : [],
        description:String(raw?.description || raw?.desc || raw?.expectedOutput || '由大模型按数据包方法论动态生成。'),
        dependsOn:Array.isArray(raw?.dependsOn) ? raw.dependsOn : [],
        dataPackBasis:Array.isArray(raw?.dataPackBasis) ? raw.dataPackBasis : Array.isArray(raw?.basis) ? raw.basis : [],
        expectedOutput:String(raw?.expectedOutput || raw?.output || ''),
        _index:index
      };
    });
  }

  function listHasItems(value){
    return Array.isArray(value) && value.filter((item) => String(item || '').trim()).length > 0;
  }

  function agentRoleMatchesContract(role){
    const text = String(role || '').trim().toLowerCase();
    if (!text) return false;
    return !['agent','数据包协作 agent','智能节点','node','task'].includes(text);
  }

  function deliverableHasVisibleContent(deliverable){
    if (!deliverable || typeof deliverable !== 'object') return false;
    if (String(deliverable.title || deliverable.summary || deliverable.body || deliverable.markdown || deliverable.content || '').trim()) return true;
    return Array.isArray(deliverable.items) && deliverable.items.length > 0;
  }

  function explicitBasisFromParsed(parsed,output,dynamicStep){
    if (listHasItems(parsed?.dataPackBasis)) return parsed.dataPackBasis;
    if (listHasItems(parsed?.basis)) return parsed.basis;
    if (listHasItems(output?.dataPackBasis)) return output.dataPackBasis;
    if (listHasItems(dynamicStep?.dataPackBasis)) return dynamicStep.dataPackBasis;
    if (Array.isArray(parsed?.agentTrace) && parsed.agentTrace.some((item) => listHasItems(item?.basis) || listHasItems(item?.dataPackBasis))) return ['agentTrace'];
    return [];
  }

  function assertAgentPipelinePlan(plan,steps){
    const issues = [];
    const mode = String(plan?.mode || '').trim();
    if (mode !== 'agent_pipeline_visualization') issues.push('dynamicPlan.mode 必须是 agent_pipeline_visualization');
    if (!steps.length) issues.push('dynamicPlan.steps 不能为空');
    steps.forEach((step,index) => {
      const label = step.title || step.id || `step-${index + 1}`;
      if (!String(step.pipelinePhase || '').trim()) issues.push(`${label} 缺少 pipelinePhase`);
      if (!agentRoleMatchesContract(step.agentRole)) issues.push(`${label} 缺少合法 agentRole`);
      if (!listHasItems(step.skillIds)) issues.push(`${label} 缺少 skillIds`);
      if (!listHasItems(step.dataPackBasis)) issues.push(`${label} 缺少 dataPackBasis`);
      if (!listHasItems(step.outputArtifacts)) issues.push(`${label} 缺少 outputArtifacts`);
      if (!String(step.expectedOutput || '').trim()) issues.push(`${label} 缺少 expectedOutput`);
    });
    if (issues.length) {
      throw new Error(`后台 LLM 返回的动态计划不符合 active data pack agents 流水线契约：${issues.slice(0,6).join('；')}`);
    }
  }

  function assertAgentNodeResult(parsed,n,dynamicStep){
    const output = parsed?.output && typeof parsed.output === 'object' ? parsed.output : {};
    const deliverable = parsed?.userDeliverable || parsed?.deliverable || output.userDeliverable || output.deliverable;
    const firstTrace = Array.isArray(parsed?.agentTrace) ? parsed.agentTrace.find((item) => item && typeof item === 'object') : null;
    const pipelinePhase = parsed?.pipelinePhase || output.pipelinePhase || firstTrace?.pipelinePhase || dynamicStep?.pipelinePhase || n.values?.pipelinePhase || '';
    const agentRole = parsed?.agentRole || output.agentRole || firstTrace?.agentRole || dynamicStep?.agentRole || n.values?.agentRole || '';
    const basis = explicitBasisFromParsed(parsed,output,dynamicStep);
    const issues = [];
    if (!String(pipelinePhase || '').trim()) issues.push('缺少 pipelinePhase');
    if (!agentRoleMatchesContract(agentRole)) issues.push('缺少合法 agentRole');
    if (!listHasItems(parsed?.skillIds) && !listHasItems(output.skillIds) && !listHasItems(firstTrace?.skillIds) && !listHasItems(dynamicStep?.skillIds) && !listHasItems(n.values?.skillIds)) issues.push('缺少 skillIds');
    if (!listHasItems(basis)) issues.push('缺少 dataPackBasis 或 agentTrace.basis');
    if (!deliverableHasVisibleContent(deliverable)) issues.push('缺少 userDeliverable 用户可见交付物');
    if (issues.length) {
      throw new Error(`后台 LLM 返回的节点结果不符合 active data pack agents 流水线契约：${issues.join('；')}。智能视界只展示当前数据包的 agent 交付物，不接受内部 JSON 或固定链路兜底。`);
    }
  }

  function applyDynamicPlan(plan,sourceNodeId){
    const steps = normalizeDynamicSteps(plan);
    if (!steps.length) return null;
    assertAgentPipelinePlan(plan,steps);
    S.dynamicPlan = {
      ...plan,
      sourceNodeId,
      mode:'agent_pipeline_visualization',
      steps,
      active:true,
      appliedAt:new Date().toISOString()
    };
    return S.dynamicPlan;
  }

  function getDynamicNextStep(source){
    if (!source || S.track === 'custom') return null;
    const steps = S.dynamicPlan?.steps || [];
    if (!steps.length) return null;
    if (source.type === 'svInput') return steps[0] || null;
    const currentIndex = Number(source.values?.dynamicStepIndex);
    if (Number.isFinite(currentIndex)) return steps[currentIndex + 1] || null;
    return null;
  }

  function nodeTypeForTaskType(taskType,fallback='svAgentTask'){
    const normalized = String(taskType || '').toLowerCase();
    if (normalized.includes('audio') || normalized.includes('sound')) return 'svAudio';
    if (normalized.includes('writer') || normalized.includes('script')) return 'svWriter';
    if (normalized.includes('director') || normalized.includes('camera')) return 'svDirector';
    if (normalized.includes('storyboard_image')) return 'svStoryboardWorkflow';
    if (normalized.includes('storyboard') || normalized.includes('shot')) return 'svShotTable';
    if (normalized.includes('asset_image') || normalized.includes('asset_workflow')) return 'svAssetWorkflow';
    if (normalized.includes('product_image') || normalized.includes('product_photo')) return 'svAssetWorkflow';
    if (normalized.includes('asset') || normalized.includes('style_bible')) return 'svAssetCard';
    if (normalized.includes('video')) return 'svVideoWorkflow';
    if (normalized.includes('qa') || normalized.includes('review')) return 'svQa';
    if (normalized.includes('release') || normalized.includes('publish')) return 'svRelease';
    return fallback;
  }

  function stepNodeType(step){
    const explicit = String(step?.nodeType || '').trim();
    if (explicit && NODE_DEFS[explicit]) return explicit;
    return nodeTypeForTaskType(step?.taskType || step?.type || '', 'svAgentTask');
  }

  function createDynamicNodeFromStep(step,source){
    const nextType = stepNodeType(step);
    return createNode(nextType, source.x + source.w + 170, source.y + smartLaneOffset(source,nextType), {
      taskType:step.taskType || taskTypeForNodeType(nextType),
      pipelinePhase:step.pipelinePhase || '',
      agentRole:step.agentRole || '数据包协作 Agent',
      skillIds:Array.isArray(step.skillIds) ? [...step.skillIds] : [],
      inputArtifacts:Array.isArray(step.inputArtifacts) ? [...step.inputArtifacts] : [],
      outputArtifacts:Array.isArray(step.outputArtifacts) ? [...step.outputArtifacts] : [],
      dynamicTitle:step.title || getDef(nextType).name,
      dynamicDescription:step.description || getDef(nextType).desc,
      dynamicStepId:step.id,
      dynamicStepIndex:step._index,
      dynamicStep:JSON.parse(JSON.stringify(step)),
      dataPackBasis:Array.isArray(step.dataPackBasis) ? [...step.dataPackBasis] : [],
      expectedOutput:step.expectedOutput || ''
    });
  }

  function quickDownstream(id,runAfter=false){
    const source = S.nodes[id];
    if (!source) return null;
    const existing = findDownstream(id);
    if (existing) {
      S.selected = existing.id;
      passData(id,existing.id);
      render();
      if (runAfter) runNode(existing.id);
      return existing;
    }
    const dynamicStep = getDynamicNextStep(source);
    const nextType = dynamicStep ? stepNodeType(dynamicStep) : (S.track === 'custom' || source.type === 'svStyle' ? getNextType(source.type) : '');
    if (!nextType) {
      toast(S.track === 'custom' ? '当前流程已经完成' : '等待大模型根据数据包生成下一步计划');
      return null;
    }
    const target = dynamicStep ? createDynamicNodeFromStep(dynamicStep,source) : createNode(nextType, source.x + source.w + 170, source.y + smartLaneOffset(source,nextType), {});
    const fromPort = (getDef(source.type).outputs || ['data'])[0];
    const toPort = (getDef(nextType).inputs || ['data'])[0];
    S.conns.push({from:id,fromPort,to:target.id,toPort});
    passData(id,target.id);
    S.selected = target.id;
    render();
    toast(dynamicStep ? '已按数据包动态计划生成并连接下一节点' : '已自动生成并连接下一节点');
    if (runAfter) runNode(target.id);
    return target;
  }

  function smartLaneOffset(source,nextType){
    if (S.track === 'custom') return 0;
    if (nextType === 'svAssetWorkflow') return 32;
    if (nextType === 'svStoryboardWorkflow') return 32;
    if (nextType === 'svVideoWorkflow') return 32;
    return 0;
  }

  function passData(fromId,toId){
    const from = S.nodes[fromId];
    const to = S.nodes[toId];
    if (!from || !to) return;
    const summary = from.data?.summary || TYPE_OUTPUT[from.type] || getDef(from.type).desc;
    const globalStyle = from.type === 'svStyle' ? buildGlobalStyle(from) : resolveGlobalStyle(from);
    const executionModel = from.data?.executionModel || from.values?.executionModel || getExecutionModel();
    to.values = {
      ...to.values,
      upstreamNode:fromId,
      upstreamType:from.type,
      upstreamSummary:summary,
      executionModel:JSON.parse(JSON.stringify(executionModel)),
      globalStyle:globalStyle ? JSON.parse(JSON.stringify(globalStyle)) : to.values.globalStyle,
      inheritedPayload:JSON.parse(JSON.stringify(compactPayloadForTransfer(from.data || {}))),
      dynamicPlan:S.dynamicPlan ? JSON.parse(JSON.stringify(S.dynamicPlan)) : to.values.dynamicPlan
    };
    if (globalStyle && to.data) to.data.globalStyle = JSON.parse(JSON.stringify(globalStyle));
  }

  function runNode(id){
    const n = S.nodes[id];
    if (!n || n.status === 'running') return;
    if (isSetupOnlyNode(n)) {
      lockStyleNode(id);
      const downstream = findDownstream(id);
      if (downstream) {
        passData(id,downstream.id);
        S.selected = downstream.id;
      }
      setStatus('全片风格母版已锁定',false);
      render();
      return;
    }
    n.status = 'running';
    n.error = '';
    setStatus(`${nodeDisplayName(n)}生成中`,true);
    render();
    const delay = isWorkflowType(n.type) ? 920 : 680;
    const timer = setTimeout(async () => {
      S.timers.delete(id);
      if (!S.nodes[id] || S.nodes[id].status !== 'running') return;
      await completeNode(id);
      if (S.mode === 'auto') {
        const next = quickDownstream(id,false);
        if (next) setTimeout(() => runNode(next.id), 180);
      }
    },delay);
    S.timers.set(id,timer);
  }

  async function completeNode(id){
    const n = S.nodes[id];
    if (!n) return;
    try {
      n.data = await makeNodeOutputAsync(n);
      if (n.data?.dynamicPlan) applyDynamicPlan(n.data.dynamicPlan,n.id);
      n.status = 'success';
      setStatus(`${nodeDisplayName(n)}已完成`,false);
      render();
    } catch (error) {
      n.status = 'failed';
      n.error = friendlyRuntimeError(error);
      setStatus(`${nodeDisplayName(n)}执行失败`,false);
      render();
      toast(n.error,'err');
    }
  }

  function findPayloadValue(payload,keys,depth=0){
    if (!payload || depth > 6 || typeof payload !== 'object') return '';
    for (const key of keys) {
      if (payload[key] !== undefined && payload[key] !== null && payload[key] !== '') return payload[key];
    }
    return findPayloadValue(payload.inheritedPayload || payload.sourcePayload || payload.parentPayload,keys,depth + 1);
  }

  function resolveSourceScript(n,seen=new Set()){
    if (!n || seen.has(n.id)) return '';
    seen.add(n.id);
    const direct = n.values.script || findPayloadValue(n.values.inheritedPayload,['script','sourceScript','rawScript','storyText']);
    if (direct) return String(direct);
    const upstreamId = n.values?.upstreamNode;
    if (upstreamId && S.nodes[upstreamId]) return resolveSourceScript(S.nodes[upstreamId],seen);
    return '';
  }

  function parseNumberToken(token){
    const raw = String(token || '').trim();
    if (!raw) return 0;
    if (/^\d+$/.test(raw)) return Number(raw);
    const map = {零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
    if (raw === '十') return 10;
    if (raw.includes('十')) {
      const [tens,ones] = raw.split('十');
      return (tens ? map[tens] || 0 : 1) * 10 + (ones ? map[ones] || 0 : 0);
    }
    return map[raw] || 0;
  }

  function parseScriptDurationSeconds(script){
    const text = String(script || '');
    const patterns = [
      {re:/\|\s*单集时长\s*\|[^|\n\r]*\|\s*约?\s*(\d{1,3})(?:\s*[-~—至]\s*(\d{1,3}))?\s*秒\s*\|/,label:'本话实际'},
      {re:/本话实际[^|\n\r]*?约?\s*(\d{1,3})(?:\s*[-~—至]\s*(\d{1,3}))?\s*秒/,label:'本话实际'},
      {re:/单集时长[^|\n\r]*?约?\s*(\d{1,3})(?:\s*[-~—至]\s*(\d{1,3}))?\s*秒/,label:'单集时长'},
      {re:/约\s*(\d{1,3})\s*秒/,label:'正文时长'}
    ];
    for (const item of patterns) {
      const m = text.match(item.re);
      if (m) {
        const a = Number(m[1]);
        const b = m[2] ? Number(m[2]) : a;
        return {seconds:Math.max(1,Math.round((a + b) / 2)),source:`${item.label} ${m[1]}${m[2] ? '-' + m[2] : ''} 秒`};
      }
    }
    return null;
  }

  function countScriptEpisodes(script){
    const text = String(script || '');
    const tokens = new Set();
    for (const m of text.matchAll(/第\s*([0-9一二两三四五六七八九十]+)\s*[话集]/g)) {
      const num = parseNumberToken(m[1]);
      if (num) tokens.add(String(num));
    }
    if (tokens.size) return tokens.size;
    const count = text.match(/(?:共|能做|生成)?\s*([0-9一二两三四五六七八九十]+)\s*集(?!时长)/);
    return count ? Math.max(1,parseNumberToken(count[1])) : 1;
  }

  function countScriptScenes(script){
    const text = String(script || '');
    const table = text.match(/\|\s*场景数\s*\|[^|\n\r]*\|\s*(?:约)?\s*(\d+)/);
    if (table) return Number(table[1]);
    const sceneMatches = text.match(/^#{0,4}\s*场景\s*\d+\s*[-－]\s*\d+/gm);
    return sceneMatches ? sceneMatches.length : 0;
  }

  function countScriptBeats(script){
    const text = String(script || '');
    const table = text.match(/\|\s*节拍密度\s*\|[^|\n\r]*\|\s*(?:约)?\s*(\d+)/);
    if (table) return Number(table[1]);
    const beatMatches = text.match(/△△|△/g);
    return beatMatches ? beatMatches.length : 0;
  }

  function normalizeEpisodePlan(plan){
    if (!plan || typeof plan !== 'object') return null;
    const episodes = Number(plan.episodes || plan.episodeCount || 0);
    const videoCount = Number(plan.videoCount || plan.totalVideos || 0);
    if (!episodes && !videoCount) return null;
    const segmentSeconds = Number(plan.segmentSeconds || 15);
    return {
      ...plan,
      episodes:Math.max(1,episodes || 1),
      segmentSeconds,
      videoCount:Math.max(1,videoCount || Math.ceil(Number(plan.estimatedSeconds || segmentSeconds) / segmentSeconds)),
      estimatedSeconds:Number(plan.estimatedSeconds || (videoCount || 1) * segmentSeconds)
    };
  }

  function inferEpisodePlan(n,script){
    const inherited = normalizeEpisodePlan(n.values.inheritedPayload?.episodePlan || n.values.inheritedPayload);
    if (!script && inherited) return inherited;
    const duration = parseScriptDurationSeconds(script);
    const sceneCount = countScriptScenes(script);
    const beatCount = countScriptBeats(script);
    const episodes = countScriptEpisodes(script) || inherited?.episodes || 1;
    const segmentSeconds = inherited?.segmentSeconds || 15;
    const estimatedSeconds = duration?.seconds || inherited?.estimatedSeconds || (beatCount ? Math.round(beatCount * 2.5) : Math.max(45,sceneCount * 20 || 60));
    const videoCount = Math.max(1,Math.ceil(estimatedSeconds / segmentSeconds));
    const basis = [
      duration?.source || (beatCount ? `节拍估算 ${beatCount} × 2.5 秒` : sceneCount ? `场景估算 ${sceneCount} 场` : '默认短剧单集 60 秒'),
      `${estimatedSeconds} 秒 / ${segmentSeconds} 秒一段 = ${videoCount} 个视频`
    ];
    return {episodes,videoCount,segmentSeconds,estimatedSeconds,sceneCount,beatCount,basis};
  }

  function extractSceneHints(script){
    const text = String(script || '');
    const scenes = [];
    for (const match of text.matchAll(/^#{0,4}\s*场景\s*([0-9一二三四五六七八九十]+(?:\s*[-－]\s*[0-9一二三四五六七八九十]+)?)\s*([^\n\r]*)/gm)) {
      scenes.push({
        id:match[1] || String(scenes.length + 1),
        title:(match[2] || '').trim() || `场景 ${match[1] || scenes.length + 1}`
      });
    }
    if (!scenes.length) {
      const compact = text.split(/\n+/).map((line) => line.trim()).filter(Boolean).find((line) => /场景|练武场|意识|房间|街|室|外|内/.test(line));
      if (compact) scenes.push({id:'1',title:shortText(compact.replace(/^#+\s*/,''),36)});
    }
    return scenes.slice(0,12);
  }

  function extractCharacterNames(script){
    const text = String(script || '');
    const names = new Set();
    for (const match of text.matchAll(/^\s*\**([\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9·]{1,8})\**\s*[：:]/gm)) {
      const name = match[1].trim();
      if (!/系统音|旁白|画外音|格式检查|项目|标准值|本话实际/.test(name)) names.add(name);
    }
    for (const match of text.matchAll(/【角色阶段】[：:]\s*([^\n\r]+)/g)) {
      match[1].split(/[，,、/]/).map((item) => item.replace(/[（(].*?[）)]/g,'').trim()).filter(Boolean).forEach((name) => names.add(name));
    }
    return Array.from(names).slice(0,8);
  }

  function extractScriptBeats(script){
    return String(script || '')
      .split(/\n+/)
      .map((line) => line.trim())
      .filter((line) => /△|【运镜】|特写|近景|中景|全景|低角度|推进|台词|系统音/.test(line))
      .slice(0,32);
  }

  function formatTimeRange(index,segmentSeconds){
    const start = Math.max(0,index * segmentSeconds);
    const end = start + segmentSeconds;
    const fmt = (value) => {
      const m = Math.floor(value / 60);
      const s = String(value % 60).padStart(2,'0');
      return `${m}:${s}`;
    };
    return `${fmt(start)}-${fmt(end)}`;
  }

  function compactValueForLlm(value,depth=0){
    if (value === null || value === undefined) return value;
    if (typeof value === 'string') return shortText(value,depth <= 1 ? 6000 : 1600);
    if (typeof value !== 'object') return value;
    if (depth > 4) return '[truncated]';
    if (Array.isArray(value)) return value.slice(0,24).map((item) => compactValueForLlm(item,depth + 1));
    const dropKeys = new Set([
      'llmRawText',
      'llmResult',
      'responseJson',
      'requestJson',
      'upstream',
      'raw',
      'contextPack',
      'referencesByKind',
      'workspaceDataPack',
      'workspaceDataPackFiles',
      'parsedReferences',
      'inheritedPayload',
      'sourcePayload',
      'parentPayload'
    ]);
    const output = {};
    Object.entries(value).slice(0,60).forEach(([key,item]) => {
      if (dropKeys.has(key)) return;
      if (key === 'dynamicPlan') {
        const plan = compactDynamicPlanForTransfer(item);
        if (plan) output[key] = plan;
        return;
      }
      if (key === 'sourceScript' || key === 'script' || key === 'rawScript' || key === 'storyText') {
        output[key] = shortText(item,12000);
        return;
      }
      output[key] = compactValueForLlm(item,depth + 1);
    });
    return output;
  }

  function basisTokensForNode(n){
    const step = n?.values?.dynamicStep || {};
    const items = [
      nodeDisplayName(n),
      taskTypeForNode(n),
      step.id,
      step.title,
      step.taskType,
      step.agentRole,
      step.description,
      ...(Array.isArray(step.dataPackBasis) ? step.dataPackBasis : []),
      ...(Array.isArray(n?.values?.dataPackBasis) ? n.values.dataPackBasis : []),
      ...(Array.isArray(n?.values?.dynamicPlan?.basis) ? n.values.dynamicPlan.basis : [])
    ].filter(Boolean).map((item) => String(item));
    const tokens = new Set();
    items.forEach((item) => {
      const lower = item.toLowerCase();
      tokens.add(lower);
      lower.split(/[\\/\s._#:@|,，;；()（）【】\[\]-]+/).filter((part) => part.length >= 3).forEach((part) => tokens.add(part));
    });
    return [...tokens].slice(0,80);

    const text = `${item?.id || ''} ${item?.title || item?.name || ''} ${item?.path || item?.file || ''} ${item?.sourceKind || item?.kind || ''}`.toLowerCase();
    return text ? tokens.some((token) => text.includes(token)) : false;

  function compactListForNode(list,tokens,matchLimit=18,fallbackLimit=8){
    const items = Array.isArray(list) ? list : [];
    const matched = items.filter((item) => itemMatchesBasis(item,tokens)).slice(0,matchLimit);
    const fallback = items.slice(0,fallbackLimit);
    const merged = [...matched,...fallback].filter((item,index,array) => {
      const key = item?.path || item?.id || item?.title || item?.name || String(index);
      return array.findIndex((other,otherIndex) => (other?.path || other?.id || other?.title || other?.name || String(otherIndex)) === key) === index;
    });
    return compactList(merged,matchLimit + fallbackLimit);
  }

  function compactReferencesForNode(runtime,n,tokens){
    const referencesByKind = {};
    Object.entries(runtime?.referencesByKind || {}).forEach(([kind,refs]) => {
      const items = Array.isArray(refs) ? refs : [];
      const matched = items.filter((item) => itemMatchesBasis(item,tokens)).slice(0,4);
      const fallback = items.slice(0,2);
      const merged = [...matched,...fallback].filter((item,index,array) => {
        const key = item?.path || item?.id || item?.title || String(index);
        return array.findIndex((other,otherIndex) => (other?.path || other?.id || other?.title || String(otherIndex)) === key) === index;
      }).slice(0,5);
      referencesByKind[kind] = merged.map((ref) => ({
        title:ref.title || ref.id || ref.path || '',
        path:ref.path || ref.file || '',
        sourceKind:ref.sourceKind || kind,
        excerpt:shortText(ref.content || ref.excerpt || ref.error || '',520)
      }));
    });
    return referencesByKind;
  }

  async function loadSmartCanvasRuntime(taskType,n){
    const normalized = String(taskType || 'creative_orchestration').trim() || 'creative_orchestration';
    const activeDataPackId = S.activeDataPackId || getActiveDataPack()?.id || '';
    const cacheKey = `${activeDataPackId}:${normalized}:${resolveSourceScript(n).length}:${resolveGlobalStyle(n)?.presetId || ''}`;
    if (S.dynamicRuntimeCache[cacheKey]) return S.dynamicRuntimeCache[cacheKey];
    const payload = await bridgeApi(SMART_CANVAS_RUNTIME_ENDPOINT,{
      method:'POST',
      body:JSON.stringify({
        activeDataPackId,
        taskType:normalized,
        nodeType:n.type,
        nodeTitle:nodeDisplayName(n),
        scriptText:resolveSourceScript(n),
        globalStyle:resolveGlobalStyle(n)
      })
    });
    const runtime = payload.data || payload;
    S.dynamicRuntime = runtime;
    S.dynamicRuntimeCache[cacheKey] = runtime;
    return runtime;
  }
