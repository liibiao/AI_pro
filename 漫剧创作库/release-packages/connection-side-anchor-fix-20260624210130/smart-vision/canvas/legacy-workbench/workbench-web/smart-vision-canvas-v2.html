  function collectArtifactLikeStrings(value,options={},depth=0,seen=new Set()){
    const output = [];
    const includeImagesOnly = options.imagesOnly === true;
    const push = (item) => {
      const text = String(item || '').trim();
      if (!text || seen.has(text)) return;
      const looksArtifact = /^(0[1-5]-|\.smart-vision\/|outputs\/|smart-vision\/outputs\/)/.test(text) || /\/(asset|storyboard|video|prompt|release|输入资料|资产|故事板|视频)\//i.test(text);
      const imageOk = !includeImagesOnly || /\.(png|jpe?g|webp|gif)$/i.test(text);
      if (looksArtifact && imageOk) {
        seen.add(text);
        output.push(text);
      }
    };
    if (value === null || value === undefined || depth > 6) return output;
    if (typeof value === 'string') {
      push(value);
      return output;
    }
    if (Array.isArray(value)) {
      value.forEach((item) => output.push(...collectArtifactLikeStrings(item,options,depth + 1,seen)));
      return output;
    }
    if (typeof value === 'object') {
      ['artifactPath','assetPath','path','localPath','imagePath','videoPath','outputPath','referenceImage'].forEach((key) => push(value[key]));
      Object.values(value).forEach((item) => output.push(...collectArtifactLikeStrings(item,options,depth + 1,seen)));
    }
    return output;
  }

  function collectWorkflowInputArtifacts(n,parsed){
    return [...new Set([
      ...collectArtifactLikeStrings(n.values?.inheritedPayload || {}),
      ...collectArtifactLikeStrings(n.data || {}),
      ...collectArtifactLikeStrings(parsed || {}),
      ...(Array.isArray(n.values?.inputArtifacts) ? n.values.inputArtifacts : []),
      ...(Array.isArray(n.values?.importedFiles) ? n.values.importedFiles : []),
      ...(Array.isArray(n.values?.referenceImages) ? n.values.referenceImages : [])
    ].map(String).filter(Boolean))];
  }

  function collectWorkflowReferenceImages(n,parsed){
    return [...new Set([
      ...collectArtifactLikeStrings(n.values?.inheritedPayload || {},{imagesOnly:true}),

  async function callDynamicDataPackLlm(n,runtime){

    const messages = [systemMessage,{role:'user',content:userPrompt}];
    const promptChars = messageChars(messages);
    if (n.type === 'svInput' && promptChars > 90000) {
      return callSegmentedDynamicPlanLlm(n,runtime,systemMessage,promptChars);
    }
    if (n.type !== 'svInput' && promptChars > 90000) {
      return callSegmentedDynamicNodeLlm(n,runtime,systemMessage,promptChars);
    }
    return callBackendLlmChat(messages,{
      maxOutputTokens:n.type === 'svInput' ? 8192 : 6144,
      contextLabel:n.type === 'svInput' ? 'dynamic-plan' : `dynamic-node:${taskTypeForNode(n)}`
    });
  }

  function extractJsonObject(text){
    const raw = String(text || '').trim();
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch {}
    const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fenced) {
      try {
        return JSON.parse(fenced[1]);
      } catch {}
    }
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try {
        return JSON.parse(raw.slice(start,end + 1));
      } catch {}
    }
    return null;
  }

  async function makeLlmEpisodePlanOutput(n){
    const base = makeNodeOutput(n);
    const script = base.sourceScript || resolveSourceScript(n);
    const globalStyle = resolveGlobalStyle(n);
    const response = await callBackendLlmChat([
      {role:'system',content:'你是漫剧工业化自动流水线的剧集规划 Agent。只返回严格 JSON，不要写 Markdown。'},
      {role:'user',content:[
        '请根据剧本和当前风格母版，规划 15 秒视频段落。',
        '输出 JSON 字段：episodes, estimatedSeconds, segmentSeconds, videoCount, basis, segments。',
        'segments 每项字段：index, title, timeRange, scene, beatSummary, outputGoal。',
        '不要固定每集 8 个视频，必须根据剧本文本、时长、节拍和场景推理。',
        '',
        `风格母版：${globalStyle ? JSON.stringify(globalStyle) : '未锁定'}`,
        '',
        `剧本：\n${script}`
      ].join('\n')}
    ],{maxOutputTokens:4096});
    const parsed = extractJsonObject(response.text || '');
    if (!parsed) throw new Error('后台 LLM 未返回可解析 JSON');
    const plan = normalizeEpisodePlan(parsed);
    if (!plan) throw new Error('后台 LLM 规划结果缺少 episodes/videoCount');
    const segmentRows = Array.isArray(parsed.segments)
      ? parsed.segments.slice(0,5).map((segment,index) => [`段${segment.index || index + 1}`,segment.title || segment.beatSummary || segment.timeRange || '未命名'])
      : [];
    return {
      ...base,
      ...parsed,
      episodePlan:{...plan,basis:parsed.basis || plan.basis || base.episodePlan?.basis || []},
      episodes:plan.episodes,
      videoCount:plan.videoCount,
      estimatedSeconds:plan.estimatedSeconds,
      plannerSource:'backend-llm',
      plannerRawText:response.text,
      backendUsage:response.usage || null,
      summary:`后台 ${executionModelLabel(base.executionModel)} 已规划 ${plan.episodes} 话，约 ${plan.estimatedSeconds} 秒，共 ${plan.videoCount} 个 ${plan.segmentSeconds} 秒视频。`,
      rows:[
        ['规划来源','后台 LLM'],
        ['执行模型',executionModelLabel(base.executionModel)],
        ['话数',`${plan.episodes} 话`],
        ['估算时长',`${plan.estimatedSeconds} 秒`],
        ['视频',`${plan.videoCount} 个`],
        ...segmentRows
      ]
    };
  }

  function makeNodeOutput(n){
    const script = resolveSourceScript(n);
    const plan = inferEpisodePlan(n,script);
    const episodes = plan.episodes;
    const videoCount = plan.videoCount;
    const globalStyle = resolveGlobalStyle(n);
    const executionModel = n.values?.executionModel || getExecutionModel();
    const executionModelName = executionModelLabel(executionModel);
    const common = {
      nodeId:n.id,
      type:n.type,
      generatedAt:new Date().toISOString(),
      summary:TYPE_OUTPUT[n.type] || getDef(n.type).desc,
      executionModel:JSON.parse(JSON.stringify(executionModel)),
      globalStyle:globalStyle ? JSON.parse(JSON.stringify(globalStyle)) : null,
      sourceScript:script,
      episodePlan:JSON.parse(JSON.stringify(plan)),
      episodes,
      videoCount,
      pipelinePhase:n.values?.pipelinePhase || n.values?.dynamicStep?.pipelinePhase || '',
      agentRole:n.values?.agentRole || '',
      skillIds:Array.isArray(n.values?.skillIds) ? JSON.parse(JSON.stringify(n.values.skillIds)) : Array.isArray(n.values?.dynamicStep?.skillIds) ? JSON.parse(JSON.stringify(n.values.dynamicStep.skillIds)) : [],
      inputArtifacts:Array.isArray(n.values?.inputArtifacts) ? JSON.parse(JSON.stringify(n.values.inputArtifacts)) : Array.isArray(n.values?.dynamicStep?.inputArtifacts) ? JSON.parse(JSON.stringify(n.values.dynamicStep.inputArtifacts)) : [],
      outputArtifacts:Array.isArray(n.values?.outputArtifacts) ? JSON.parse(JSON.stringify(n.values.outputArtifacts)) : Array.isArray(n.values?.dynamicStep?.outputArtifacts) ? JSON.parse(JSON.stringify(n.values.dynamicStep.outputArtifacts)) : [],

    const finish = (data={},deliverable={}) => attachUserDeliverable(n,{...common,...data},deliverable);

    if (n.type === 'svAudio') return finish({audio:{voice:n.values.voice,music:n.values.music,sfx:n.values.sfx,tempo:n.values.tempo},summary:`音频风格锁定：${n.values.voice} / ${n.values.music}。`,rows:[['执行模型',executionModelName],['旁白',n.values.voice],['配乐',n.values.music],['音效',n.values.sfx],['节奏',n.values.tempo]]},{

    if (n.type === 'svWriter') return finish({summary:`已识别 ${episodes} 话，约 ${plan.estimatedSeconds} 秒，规划 ${videoCount} 个 ${plan.segmentSeconds} 秒视频。`,rows:[['执行模型',executionModelName],['话数',`${episodes} 话`],['估算时长',`${plan.estimatedSeconds} 秒`],['视频',`${videoCount} 个`],['规划依据',plan.basis.join('；')]]},{

      body:`话数：${episodes} 话\n估算时长：${plan.estimatedSeconds} 秒\n视频段：${videoCount} 个，每段约 ${plan.segmentSeconds} 秒\n规划依据：${plan.basis.join('；')}`,
      items:makeShotDeliverableItems(plan,script).slice(0,Math.min(8,videoCount)).map((item) => ({
        ...item,
        title:item.title.replace(/^S\d+\s*/,'剧本段 '),

    });
    if (n.type === 'svDirector') return finish({summary:`导演讲戏完成，覆盖 ${episodes} 话 ${videoCount} 个视频段。`,rows:[['镜头调度','已生成'],['表演意图','已生成'],['视频段',`${videoCount} 个`],['依据',plan.basis.join('；')]]},{

        title:item.title,

        status:'ready'
      }))
    });
    if (n.type === 'svShotTable') return finish({summary:`分镜表已生成：${videoCount} 个视频段，每段含关键镜头说明。`,rows:[['分镜段',`${videoCount} 个`],['场景',`${plan.sceneCount || '待细分'} 场`],['可编辑','是'],['状态','待确认']]},{

    if (n.type === 'svAssetCard') return finish({assetCount:episodes * 12,summary:`资产卡已生成：角色、场景、道具和参考图需求已拆分。`,rows:[['角色','6'],['场景',`${episodes * 4}`],['道具',`${episodes * 5}`]]},{

    if (n.type === 'svAssetWorkflow') return finish({workflowPath:`outputs/workflows/assets/${n.id}-asset-workflow.json`,summary:'资产图生成任务已就绪，提示词和参考图槽位已写入后台画布任务。',rows:[['交付物','资产图'],['画布','可打开'],['参考图','已绑定']]},{
      title:'资产图生成结果',

      body:'后台已根据资产卡填入资产图生成所需提示词、参考图和渲染节点。用户侧只需要查看资产图结果。',
      items:makeMediaDeliverableItems('asset_images',plan,'01-资产图与提示词/资产图/preview'),
      primaryArtifactLabel:'资产图',
      primaryArtifactPath:'点击编辑进入无限画布渲染/查看'
    });
    if (n.type === 'svStoryboardWorkflow') return finish({workflowPath:`outputs/workflows/storyboard/${n.id}-storyboard-workflow.json`,summary:'故事板生成任务已就绪，资产图将传入故事板节点。',rows:[['交付物','故事板'],['输入','资产图'],['输出','故事板']]},{
      title:'故事板生成结果',
      kind:'storyboard',
      summary:'故事板渲染任务已准备好，可进入无限画布查看/执行并返回故事板。',
      body:'后台已把资产图、分镜表和镜头描述传入故事板生成任务。用户侧查看的是故事板画面和镜头说明。',
      items:makeMediaDeliverableItems('storyboard',plan,'01-资产图与提示词/故事板/preview'),
      primaryArtifactLabel:'故事板',
      primaryArtifactPath:'点击编辑进入无限画布渲染/查看'
    });
    if (n.type === 'svVideoWorkflow') return finish({workflowPath:`outputs/workflows/video/${n.id}-video-workflow.json`,summary:`视频生成任务已就绪，将生成 ${videoCount} 个视频。`,rows:[['交付物','视频'],['视频数',`${videoCount}`],['估算时长',`${plan.estimatedSeconds} 秒`],['策略','全流程串联']]},{
      title:'视频生成结果',
      kind:'video',
      summary:`视频渲染任务已准备好，目标生成 ${videoCount} 个视频。`,
      body:`目标视频数：${videoCount}\n估算总时长：${plan.estimatedSeconds} 秒\n执行方式：进入无限画布工作流渲染后返回视频结果。`,

    if (n.type === 'svQa') return finish({summary:'QA 审核完成，产物、manifest 和 review ledger 可进入发布门禁。',rows:[['QA review','done'],['Release review','ready'],['文件门禁','通过']]},{

    });
    if (n.type === 'svRelease') return finish({summary:'发布包已生成，release registry、manifest、artifact 和发布历史已闭环。',rows:[['release','ready'],['manifest','exists'],['artifact','exists']]},{

    });
    return finish({summary:TYPE_OUTPUT[n.type] || '自定义节点已完成',rows:[['模式','自定义编排'],['输出','已生成']]},{

      kind:deliverableKindForNode(n),
      summary:TYPE_OUTPUT[n.type] || '自定义节点已完成'
    });
  }

  function cancelNode(id){
    const timer = S.timers.get(id);
    if (timer) clearTimeout(timer);
    S.timers.delete(id);
    if (S.nodes[id]) S.nodes[id].status = 'waiting';
    setStatus('已取消当前节点',false);
    render();
  }

  function editNode(id){
    const n = S.nodes[id];
    if (!n) return;
    if (isWorkflowType(n.type)) {
      openWorkflowEditor(id);
      return;
    }
    S.editorNode = id;
    S.editorMode = 'node';
    const def = getDef(n.type);
    editorTitle.textContent = def.name + '编辑';
    editorSub.textContent = '保存后会回写当前节点，再继续传导到下游。';
    editorBody.innerHTML = editorHtml(n);
    editorMask.classList.add('show');
    editorMask.setAttribute('aria-hidden','false');
  }

  function editOutput(id){
    const n = S.nodes[id];
    if (!n || n.status !== 'success') return;
    S.editorNode = id;
    S.editorMode = 'output';
    const def = getDef(n.type);
    editorTitle.textContent = def.name + '输出结果';
    editorSub.textContent = '保存后会回写当前节点输出，并同步给已连接的下游节点。';
    editorBody.innerHTML = outputEditorHtml(n);
    editorMask.classList.add('show');
    editorMask.setAttribute('aria-hidden','false');
  }

  function outputEditorHtml(n){
    const d = normalizeDeliverable(n);
    const rows = n.data?.rows?.length ? `<div class="smart-list">${renderResultRows(n)}</div>` : '';
    return `${rows}
      <div class="smart-grid-2">
        <div class="smart-field"><label>交付物标题</label><input data-output-field="title" value="${esc(d.title || '')}" /></div>
        <div class="smart-field"><label>交付物类型</label><input data-output-field="kindLabel" value="${esc(deliverableKindLabel(d.kind))}" disabled /></div>
      </div>
      <div class="smart-field"><label>交付物摘要</label><textarea data-output-field="summary">${esc(d.summary || '')}</textarea></div>
      ${renderDeliverableDetailEditor(n,d)}
      <div class="smart-grid-2">
        <div class="smart-field"><label>主交付物</label><input data-output-field="primaryArtifactLabel" value="${esc(d.primaryArtifactLabel || '')}" /></div>
        <div class="smart-field"><label>查看入口 / 产物位置</label><input data-output-field="primaryArtifactPath" value="${esc(d.primaryArtifactPath || '')}" /></div>
      </div>
      <div class="smart-output-note">后台结构化参数、工作流结构和传参数据仍保留在节点内部，只用于继续执行和渲染，不作为用户交付物展示。</div>`;
  }

  function editorHtml(n){
    if (n.type === 'svShotTable') {
      return `<div class="smart-list"><span>EP01-01 <em>雨夜发现古画</em></span><span>EP01-02 <em>现实开始错位</em></span><span>EP02-01 <em>进入画中世界</em></span></div><textarea data-editor-field="table">${esc(n.values.table || '分镜表预览：\\n1. 雨夜，修复室，古画发光。\\n2. 主角靠近，城市霓虹开始倒流。')}</textarea>`;
    }
    return `<textarea data-editor-field="main">${esc(n.values.script || n.values.prompt || n.data?.summary || TYPE_OUTPUT[n.type] || '')}</textarea>`;
  }

  function saveEditor(){
    const id = S.editorNode;
    const n = S.nodes[id];
    if (!n) return closeEditor();
    if (S.editorMode === 'output') return saveOutputEditor(id);
    const textarea = editorBody.querySelector('textarea');
    if (textarea) {
      if (n.type === 'svInput') n.values.script = textarea.value;
      else n.values.prompt = textarea.value;
      n.values.editorText = textarea.value;
    }
    closeEditor();
    render();
    toast('节点编辑已保存');
  }

  function saveOutputEditor(id){
    const n = S.nodes[id];
    if (!n) return closeEditor();
    const existing = normalizeDeliverable(n);
    const title = editorBody.querySelector('[data-output-field="title"]')?.value || existing.title || '';
    const summary = editorBody.querySelector('[data-output-field="summary"]')?.value || existing.summary || '';
    const body = editorBody.querySelector('[data-output-field="body"]')?.value || existing.body || '';
    const primaryArtifactLabel = editorBody.querySelector('[data-output-field="primaryArtifactLabel"]')?.value || existing.primaryArtifactLabel || '';
    const primaryArtifactPath = editorBody.querySelector('[data-output-field="primaryArtifactPath"]')?.value || existing.primaryArtifactPath || '';
    const userDeliverable = {
      ...existing,
      title,
      summary,
      body,
      primaryArtifactLabel,
      primaryArtifactPath
    };
    n.data = {
      ...(n.data || {}),
      nodeId:n.data?.nodeId || n.id,
      type:n.data?.type || n.type,
      summary:summary || n.data?.summary || TYPE_OUTPUT[n.type] || '',
      userDeliverable
    };
    n.values.editedOutput = true;
    propagateOutputToDownstream(id);
    closeEditor();
    render();
    toast('输出结果已保存并同步到下游');
  }

  function propagateOutputToDownstream(id){
    S.conns.filter((conn) => conn.from === id && S.nodes[conn.to]).forEach((conn) => {
      passData(id,conn.to);
    });
  }

  function closeEditor(){
    editorMask.classList.remove('show');
    editorMask.setAttribute('aria-hidden','true');
    S.editorNode = null;
    S.editorMode = null;
  }

  function normalizeWorkflowEditorUrl(rawUrl){
    if (!rawUrl) return '';
    try {
      const url = new URL(rawUrl,location.origin);
      if (url.pathname.endsWith('/image-studio-canvas.html') && !url.pathname.includes('/tools/workbench-web/')) {
        url.pathname = '/tools/workbench-web/image-studio-canvas.html';
      }
      return url.origin === location.origin ? `${url.pathname}${url.search}${url.hash}` : url.toString();
    } catch {
      return rawUrl;
    }
  }

  function openWorkflowEditor(id){
    const n = S.nodes[id];
    if (!n) return;
    const workflowPath = n.data?.workflowPath || n.data?.workflowDraft?.path || `${n.type}-${n.id}.json`;
    const directUrl = normalizeWorkflowEditorUrl(n.data?.editUrl || n.data?.workflowDraft?.editUrl || n.data?.workflowDraft?.canvasExecution?.editUrl || n.data?.canvasRunSession?.session?.editUrl || '');
    if (directUrl) {
      infiniteFrame.src = directUrl;
      if (editorMask.classList.contains('show')) closeEditor();
      switchTab('infinite');
      toast('已进入无限画布工作流编辑');
      return;
    }
    const params = new URLSearchParams({
      smartNode:id,
      workflowPath,
      bridgeBase:getBridgeBase(),
      smartVision:'1',
      mode:'edit',
      ui:'1'
    });
    const src = `/tools/workbench-web/image-studio-canvas.html?${params.toString()}`;
    infiniteFrame.src = src;
    if (editorMask.classList.contains('show')) closeEditor();
    switchTab('infinite');
    toast('已进入无限画布工作流编辑');
  }

  function switchTab(tab){
    S.activeTab = tab;
    if (tab === 'infinite' && !infiniteFrame.getAttribute('src')) {
      infiniteFrame.src = '/tools/workbench-web/image-studio-canvas.html?ui=1';
    }
    app.classList.toggle('show-infinite', tab === 'infinite');
    $('smartTabBtn').classList.toggle('active', tab === 'smart');
    $('infiniteTabBtn').classList.toggle('active', tab === 'infinite');
    if (tab === 'smart') setTimeout(() => { applyTransform(); drawConns(); }, 30);
  }

  function startCreative(){
    if (Object.keys(S.nodes).length === 0) seedInitial();
    const selected = S.nodes[S.selected];
    if (selected) {
      S.selected = selected.id;
      if (selected.status === 'running') cancelNode(selected.id);
      else runNode(selected.id);
      return;
    }
    const first = Object.values(S.nodes).find((n) => n.status !== 'success') || Object.values(S.nodes)[0];
    if (first) {
      S.selected = first.id;
      runNode(first.id);
    }
  }

  function nextStep(){
    const n = S.nodes[S.selected];
    if (!n) return startCreative();
    if (n.status === 'waiting' || n.status === 'failed') return runNode(n.id);
    if (n.status === 'running') return cancelNode(n.id);
    if (n.status === 'success') {
      const next = quickDownstream(n.id,false);
      if (next && S.mode !== 'manual') runNode(next.id);
    }
  }

  function seedInitial(){
    clearFlow(false);
    if (S.track === 'custom') {
      const node = createNode('svCustomInput',0,0);
      S.selected = node.id;
    } else {
      const style = createNode('svStyle',0,0);
      lockStyleNode(style.id);
      const input = createNode('svInput',style.x + style.w + 170,style.y,{});
      S.conns.push({from:style.id,fromPort:'globalStyle',to:input.id,toPort:'globalStyle'});
      passData(style.id,input.id);
      S.selected = input.id;
      render();
    }
    applyTransform();
    setTimeout(() => fitAll(), 50);
  }

  function clearFlow(renderNow=true){
    S.nodes = {};
    S.conns = [];
    S.selected = null;
    S.multiSelected.clear();
    S.selectedConns.clear();
    S.clipboard = null;
    S.pasteCount = 0;
    S.pendingConnect = null;
    S.dynamicPlan = null;
    S.dynamicRuntime = null;
    S.dynamicRuntimeCache = {};
    hideMarquee();
    S.next = 1;
    S.timers.forEach((timer) => clearTimeout(timer));
    S.timers.clear();
    if (renderNow) render();
  }

  function screenToWorld(cx,cy){
    const r = stage.getBoundingClientRect();
    return {x:(cx - r.left - S.tx) / S.scale,y:(cy - r.top - S.ty) / S.scale};
  }

  function applyTransform(){
    const t = `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
    world.style.transform = t;
    connSvg.style.transform = t;
    alignSvg.style.transform = t;
    $('zoomText').textContent = Math.round(S.scale * 100) + '%';
    drawGrid();
    drawMinimap();
    updateSelectionChrome();
  }

  function markViewportMoving(){
    stage.classList.add('viewport-moving');
    if (viewportMovingTimer) clearTimeout(viewportMovingTimer);
    viewportMovingTimer = setTimeout(() => {
      viewportMovingTimer = 0;
      stage.classList.remove('viewport-moving');
      drawGrid();
      drawMinimap();
    },140);
  }

  function schedulePanTransform(){
    markViewportMoving();
    if (panTransformRaf) return;
    panTransformRaf = requestAnimationFrame(() => {
      panTransformRaf = 0;
      applyTransform();
    });
  }

  function panTo(x,y){
    if (!S.panStart) return;
    S.tx = S.panStart.tx + (x - S.panStart.x);
    S.ty = S.panStart.ty + (y - S.panStart.y);
    schedulePanTransform();
  }

  function zoomAt(cx,cy,factor){
    const old = S.scale;
    const next = Math.max(.18,Math.min(2.5,old * factor));
    if (Math.abs(next - old) < .001) return;
    const r = stage.getBoundingClientRect();
    const wx = (cx - r.left - S.tx) / old;
    const wy = (cy - r.top - S.ty) / old;
    S.scale = next;
    S.tx = cx - r.left - wx * next;
    S.ty = cy - r.top - wy * next;
    schedulePanTransform();
  }

  function zoomAtCanvasCenter(factor){
    const r = stage.getBoundingClientRect();
    zoomAt(r.left + r.width / 2,r.top + r.height / 2,factor);
  }

  function openPickerAtCanvasCenter(){
    const r = stage.getBoundingClientRect();
    const sx = r.left + r.width / 2;
    const sy = r.top + r.height / 2;
    const p = screenToWorld(sx,sy);
    openPicker({x:p.x,y:p.y,screenX:sx,screenY:sy});
  }

  function toggleSnap(){
    S.snap = !S.snap;
    $('snapBtn').classList.toggle('active',S.snap);
    toast(S.snap ? '网格吸附已开启' : '网格吸附已关闭');
  }

  function resetView(){
    S.tx = 360;
    S.ty = 170;
    S.scale = 1;
    applyTransform();
  }

  function focusNode(id){
    const n = S.nodes[id || S.selected];
    if (!n) return;
    const r = stage.getBoundingClientRect();
    S.tx = r.width / 2 - (n.x + n.w / 2) * S.scale;
    S.ty = r.height / 2 - (n.y + (n.h || 240) / 2) * S.scale;
    S.selected = n.id;
    render();
  }

  function fitAll(){
    const nodes = Object.values(S.nodes);
    if (!nodes.length) return resetView();
    const pad = 160;
    const minX = Math.min(...nodes.map((n) => n.x));
    const minY = Math.min(...nodes.map((n) => n.y));
    const maxX = Math.max(...nodes.map((n) => n.x + n.w));
    const maxY = Math.max(...nodes.map((n) => n.y + (n.h || 260)));
    const w = Math.max(1,maxX - minX + pad * 2);
    const h = Math.max(1,maxY - minY + pad * 2);
    const r = stage.getBoundingClientRect();
    S.scale = Math.max(.22,Math.min(1.2,Math.min(r.width / w,r.height / h)));
    S.tx = r.width / 2 - (minX + maxX) / 2 * S.scale;
    S.ty = r.height / 2 - (minY + maxY) / 2 * S.scale;
    applyTransform();
  }

  function layoutHorizontal(){
    Object.values(S.nodes).sort(byFlowOrder).forEach((n,i) => {
      n.x = i * 560;
      n.y = (i >= 7 ? 70 : 0);
    });
    render();
    fitAll();
  }

  function layoutVertical(){
    Object.values(S.nodes).sort(byFlowOrder).forEach((n,i) => {
      n.x = 0;
      n.y = i * 360;
    });
    render();
    fitAll();
  }

  function byFlowOrder(a,b){
    const da = Number(a.values?.dynamicStepIndex);
    const db = Number(b.values?.dynamicStepIndex);
    if (Number.isFinite(da) || Number.isFinite(db)) return (Number.isFinite(da) ? da + 2 : flowForTrack().indexOf(a.type)) - (Number.isFinite(db) ? db + 2 : flowForTrack().indexOf(b.type));
    const flow = flowForTrack();
    return flow.indexOf(a.type) - flow.indexOf(b.type);
  }

  function drawGrid(){
    const ctx = grid.getContext('2d');
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(2,window.devicePixelRatio || 1);
    grid.width = Math.max(1,Math.floor(r.width * dpr));
    grid.height = Math.max(1,Math.floor(r.height * dpr));
    grid.style.width = r.width + 'px';
    grid.style.height = r.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);
    const step = Math.max(10,32 * S.scale);
    const ox = ((S.tx % step) + step) % step;
    const oy = ((S.ty % step) + step) % step;
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    for (let x = ox; x < r.width; x += step) {
      for (let y = oy; y < r.height; y += step) ctx.fillRect(x,y,1.2,1.2);
    }
  }

  function nodeAnchor(n,side,portName=''){
    const dir = side === 'out' ? 'out' : 'in';
    const def = getDef(n.type);
    const width = Number(n.w || def.w || 360);
    const height = Number(n.h || 250);
    const y = n.y + height * .5;
    return dir === 'out' ? {x:n.x + width,y} : {x:n.x,y};
  }

  function drawConns(){
    const defs = connSvg.querySelector('defs')?.outerHTML || '';
    connSvg.innerHTML = defs;
    S.conns.forEach((c,idx) => {
      const a = S.nodes[c.from];
      const b = S.nodes[c.to];
      if (!a || !b) return;
      const p1 = nodeAnchor(a,'out',c.fromPort);
      const p2 = nodeAnchor(b,'in',c.toPort);
      const dx = Math.max(80,Math.abs(p2.x - p1.x) * .45);
      const d = `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
      const running = a.status === 'running' || b.status === 'running';
      const completed = a.status === 'success' && b.status === 'success';
      const group = document.createElementNS('http://www.w3.org/2000/svg','g');
      group.setAttribute('class','conn-group' + (S.selectedConns.has(idx) ? ' selected' : ''));
      group.dataset.connIdx = String(idx);
      const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
      hit.setAttribute('class','conn-hit');
      hit.setAttribute('d',d);
      hit.dataset.connIdx = String(idx);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','conn' + (running ? ' flow-active' : '') + (completed ? ' conn-complete' : ''));
      path.setAttribute('d',d);
      path.setAttribute('stroke','currentColor');
      group.appendChild(hit);
      if (running) {
        const glow = document.createElementNS('http://www.w3.org/2000/svg','path');
        glow.setAttribute('class','conn-flow-glow');
        glow.setAttribute('d',d);
        glow.setAttribute('stroke','url(#connAuroraGradient)');
        group.appendChild(glow);
      }
      group.appendChild(path);
      connSvg.appendChild(group);
    });
    if (S.connect) {
      const anchorNode = S.nodes[S.connect.dir === 'in' ? S.connect.to : S.connect.from];
      if (anchorNode) {
        const p1 = S.connect.dir === 'in' ? screenToWorld(S.connect.mouseX,S.connect.mouseY) : nodeAnchor(anchorNode,'out',S.connect.fromPort);
        const p2 = S.connect.dir === 'in' ? nodeAnchor(anchorNode,'in',S.connect.toPort) : screenToWorld(S.connect.mouseX,S.connect.mouseY);
        const dx = Math.max(70,Math.abs(p2.x - p1.x) * .45);
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('class','conn temp flow-active');
        path.setAttribute('d',`M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`);
        path.setAttribute('fill','none');
        connSvg.appendChild(path);
      }
    }
  }

  function selectConnection(index,add=false){
    if (!Number.isInteger(index) || !S.conns[index]) return;
    if (!add) {
      S.selectedConns.clear();
      S.selected = null;
      S.multiSelected.clear();
      updateNodeSelection();
    }
    if (add && S.selectedConns.has(index)) S.selectedConns.delete(index);
    else S.selectedConns.add(index);
    drawConns();
  }

  function removeSelectedConnections(){
    if (!S.selectedConns.size) return false;
    const indexes = [...S.selectedConns].filter((idx) => S.conns[idx]).sort((a,b) => b - a);
    indexes.forEach((idx) => S.conns.splice(idx,1));
    S.selectedConns.clear();
    render();
    toast(`已删除 ${indexes.length} 条连线`);
    return true;
  }

  function drawMinimap(){
    const nodes = Object.values(S.nodes);
    const ctx = minimap.getContext('2d');
    const dpr = Math.min(2,window.devicePixelRatio || 1);
    const w = minimap.clientWidth || 160;
    const h = minimap.clientHeight || 104;
    minimap.width = w * dpr;
    minimap.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = 'rgba(255,255,255,.045)';
    ctx.fillRect(0,0,w,h);
    if (!nodes.length) return;
    const minX = Math.min(...nodes.map((n) => n.x));
    const minY = Math.min(...nodes.map((n) => n.y));
    const maxX = Math.max(...nodes.map((n) => n.x + n.w));
    const maxY = Math.max(...nodes.map((n) => n.y + (n.h || 250)));
    const scale = Math.min((w - 20) / Math.max(1,maxX - minX),(h - 20) / Math.max(1,maxY - minY));
    nodes.forEach((n) => {
      ctx.fillStyle = n.id === S.selected ? 'rgba(247,231,166,.90)' : 'rgba(255,255,255,.55)';
      ctx.fillRect(10 + (n.x - minX) * scale,10 + (n.y - minY) * scale,Math.max(4,n.w * scale),Math.max(4,(n.h || 250) * scale));
    });
  }

  function updateHUD(){
    $('nodeCount').textContent = '节点 ' + Object.keys(S.nodes).length;
    $('connCount').textContent = '连线 ' + S.conns.length;
  }

  function openPicker(pos,options={}){
    if (!options.keepPending) S.pendingConnect = null;
    S.pickerPos = pos;
    renderPicker();
    nodePicker.style.left = (pos.screenX || 180) + 'px';
    nodePicker.style.top = (pos.screenY || 120) + 'px';
    nodePicker.classList.add('show');
    pickerSearch.value = '';
    pickerSearch.focus();
  }

  function renderPicker(){
    const query = (pickerSearch.value || '').trim().toLowerCase();
    const sourceList = S.pendingConnect ? connectCreateTypes() : (S.track === 'custom' ? CUSTOM_FLOW : Object.keys(NODE_DEFS));
    const list = sourceList.filter((type) => {
      const def = getDef(type);
      return !query || def.name.toLowerCase().includes(query) || type.toLowerCase().includes(query);
    });
    pickerList.innerHTML = list.map((type) => {
      const def = getDef(type);
      return `<div class="picker-item" data-type="${type}"><span class="conn-target-ic">${def.icon}</span><div><div class="conn-target-name">${esc(def.name)}</div><div class="conn-target-desc">${esc(def.desc)}</div></div></div>`;
    }).join('');
  }

  function closePicker(){
    nodePicker.classList.remove('show');
  }

  function isTyping(){
    const active = document.activeElement;
    if (!active) return false;
    return active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable;
  }

  function isWheelPanBlockedTarget(target){
    return Boolean(target?.closest?.('input,textarea,select,button,[contenteditable="true"],.node-picker,.smart-editor-mask,.infinite-pane'));
  }

  function isCanvasPanGesture(e){
    return e.button === 1 || (e.button === 0 && S.space && !isTyping());
  }

  function schedulePointerUi(e){
    pointerUiPoint = {x:e.clientX,y:e.clientY};
    if (pointerUiRaf) return;
    pointerUiRaf = requestAnimationFrame(() => {
      pointerUiRaf = 0;
      const point = pointerUiPoint;
      if (!point) return;
      const p = screenToWorld(point.x,point.y);
      $('coordText').textContent = Math.round(p.x) + ',' + Math.round(p.y);
    });
  }

  function beginCanvasPan(e){
    e.preventDefault();
    e.stopPropagation();
    S.canvasMode = 'pan';
    S.panStart = {x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,pointerId:e.pointerId};
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('panning');
  }

  function endCanvasPan(e){
    if (S.canvasMode !== 'pan') return;
    try {
      stage.releasePointerCapture(S.panStart?.pointerId ?? e.pointerId);
    } catch {}
    S.canvasMode = null;
    S.panStart = null;
    stage.classList.remove('panning');
    drawGrid();
    drawMinimap();
  }

  function clearCanvasGestures(){
    if (S.canvasMode === 'pan') {
      S.canvasMode = null;
      S.panStart = null;
      stage.classList.remove('panning');
    }
    if (S.canvasMode === 'marquee') {
      S.canvasMode = null;
      hideMarquee();
    }
    S.drag = null;
    S.resize = null;
  }

  function setMode(mode){
    S.mode = mode;
    document.querySelectorAll('[data-mode]').forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
    $('nextBtn').style.display = mode === 'auto' ? 'none' : '';
    render();
  }

  function setTrack(track){
    S.track = track;
    document.querySelectorAll('[data-track]').forEach((btn) => btn.classList.toggle('active', btn.dataset.track === track));
    clearFlow(false);
    seedInitial();
    toast(track === 'custom' ? '已切换到自定义编排' : '已切换到自动流水线');
  }

  function bindStage(){
    stage.addEventListener('pointerdown', (e) => {
      if (isCanvasPanGesture(e)) {
        closePicker();
        beginCanvasPan(e);
        return;
      }
      if (e.target !== stage && e.target !== grid) return;
      if (S.connect) {
        e.preventDefault();
        return;
      }
      closePicker();
      clearSelection();
      const p = screenToWorld(e.clientX,e.clientY);
      S.canvasMode = 'marquee';
      S.marquee = {
        sx:p.x,
        sy:p.y,
        x:p.x,
        y:p.y,
        w:0,
        h:0,
        startX:e.clientX,
        startY:e.clientY,
        active:false,
        pointerId:e.pointerId
      };
      stage.setPointerCapture(e.pointerId);
      e.preventDefault();
    },true);
    stage.addEventListener('dblclick', (e) => {
      if (e.target.closest('.node,.node-picker,button,input,textarea,select')) return;
      const p = screenToWorld(e.clientX,e.clientY);
      openPicker({x:p.x,y:p.y,screenX:e.clientX,screenY:e.clientY});
    });
    window.addEventListener('wheel', (e) => {
      if (!stage.contains(e.target) || isWheelPanBlockedTarget(e.target)) return;
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault();
    },{passive:false,capture:true});
    stage.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        zoomAt(e.clientX,e.clientY,e.deltaY > 0 ? .9 : 1.1);
        return;
      }
      if (isWheelPanBlockedTarget(e.target)) return;
      e.preventDefault();
      S.tx -= e.deltaX || 0;
      S.ty -= e.deltaY || 0;
      schedulePanTransform();
    },{passive:false});
    stage.addEventListener('pointermove', (e) => {
      schedulePointerUi(e);
    });
    document.addEventListener('pointermove', (e) => {
      if (S.canvasMode === 'pan') panTo(e.clientX,e.clientY);
      if (S.canvasMode === 'marquee' && S.marquee) {
        const dx = Math.abs(e.clientX - S.marquee.startX);
        const dy = Math.abs(e.clientY - S.marquee.startY);
        if (!S.marquee.active && Math.max(dx,dy) < 6) return;
        S.marquee.active = true;
        stage.classList.add('marqueeing');
        const p = screenToWorld(e.clientX,e.clientY);
        const x = Math.min(S.marquee.sx,p.x);
        const y = Math.min(S.marquee.sy,p.y);
        const w = Math.abs(p.x - S.marquee.sx);
        const h = Math.abs(p.y - S.marquee.sy);
        Object.assign(S.marquee,{x,y,w,h});
        const mq = $('marquee');
        mq.style.display = 'block';
        mq.style.left = x * S.scale + S.tx + 'px';
        mq.style.top = y * S.scale + S.ty + 'px';
        mq.style.width = w * S.scale + 'px';
        mq.style.height = h * S.scale + 'px';
      }
      if (S.drag) {
        const moveX = (e.clientX - S.drag.startX) / S.scale;
        const moveY = (e.clientY - S.drag.startY) / S.scale;
        if (!S.drag.moved && Math.hypot(e.clientX - S.drag.startX,e.clientY - S.drag.startY) > 4) S.drag.moved = true;
        S.drag.offsets.forEach((item) => {
          const n = S.nodes[item.id];
          if (!n) return;
          let x = item.x + moveX;
          let y = item.y + moveY;
          if (S.snap) {
            x = Math.round(x / 24) * 24;
            y = Math.round(y / 24) * 24;
          }
          n.x = x;
          n.y = y;
          const el = $(n.id);
          if (el) {
            el.style.left = n.x + 'px';
            el.style.top = n.y + 'px';
          }
        });
        drawConns();
        drawMinimap();
        updateSelectionChrome();
      }
      if (S.resize) {
        const n = S.nodes[S.resize.id];
        if (!n) return;
        n.w = Math.max(300,Math.min(620,S.resize.w + (e.clientX - S.resize.startX) / S.scale));
        const el = $(n.id);
        if (el) {
          el.style.width = n.w + 'px';
          el.style.setProperty('--node-w', n.w + 'px');
          n.h = Math.max(230,el.offsetHeight);
        }
        drawConns();
        drawMinimap();
      }
      if (S.connect) {
        S.connect.mouseX = e.clientX;
        S.connect.mouseY = e.clientY;
        document.querySelectorAll('.node.connect-target').forEach((el) => el.classList.remove('connect-target'));
        document.querySelectorAll('.port.connect-hover').forEach((el) => el.classList.remove('connect-hover'));
        const target = document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.node');
        if (target && target.id !== S.connect.from && target.id !== S.connect.to) {
          target.classList.add('connect-target');
          const portSelector = S.connect.dir === 'in' ? '.port[data-dir="out"]' : '.port[data-dir="in"]';
          target.querySelector(portSelector)?.classList.add('connect-hover');
        }
        drawConns();
      }
    });
    document.addEventListener('pointerup', (e) => {
      endCanvasPan(e);
      if (S.canvasMode === 'marquee') {
        try {
          stage.releasePointerCapture(S.marquee?.pointerId ?? e.pointerId);
        } catch {}
        if (S.marquee?.active && S.marquee.w > 5 && S.marquee.h > 5) {
          const r = {
            left:S.marquee.x,
            top:S.marquee.y,
            right:S.marquee.x + S.marquee.w,
            bottom:S.marquee.y + S.marquee.h
          };
          S.multiSelected.clear();
          Object.values(S.nodes).forEach((n) => {
            const nr = {left:n.x,top:n.y,right:n.x + n.w,bottom:n.y + (n.h || 250)};
            const overlap = !(nr.right < r.left || nr.left > r.right || nr.bottom < r.top || nr.top > r.bottom);
            if (overlap) S.multiSelected.add(n.id);
          });
          S.selected = [...S.multiSelected][0] || null;
          updateNodeSelection();
          if (S.multiSelected.size) toast(`已选中 ${S.multiSelected.size} 个节点`);
        }
        S.canvasMode = null;
        hideMarquee();
      }
      if (S.connect) finishConnect(e);
      if (S.drag) {
        S.drag.ids.forEach((id) => $(id)?.classList.remove('dragging'));
      }
      if (S.resize) {
        const el = $(S.resize.id);
        if (el) el.classList.remove('node-resizing');
      }
      S.drag = null;
      S.resize = null;
    });
    document.addEventListener('pointercancel', () => {
      document.querySelectorAll('.dragging,.node-resizing').forEach((el) => el.classList.remove('dragging','node-resizing'));
      clearCanvasGestures();
    });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
    stage.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); },{capture:true});
    stage.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });
    document.addEventListener('keydown', (e) => {
      const key = String(e.key || '').toLowerCase();
      const mod = e.metaKey || e.ctrlKey;
      const canvasReady = !isTyping() && S.activeTab === 'smart';
      if (canvasReady && mod && key === 'a') {
        e.preventDefault();
        S.multiSelected = new Set(Object.keys(S.nodes));
        S.selected = [...S.multiSelected][0] || null;
        updateNodeSelection();
        if (S.multiSelected.size) toast(`已全选 ${S.multiSelected.size} 个节点`);
        return;
      }
      if (canvasReady && mod && key === 'c') {
        e.preventDefault();
        copySelectionToClipboard();
        return;
      }
      if (canvasReady && mod && key === 'x') {
        e.preventDefault();
        cutSelectionToClipboard();
        return;
      }
      if (canvasReady && mod && key === 'v') {
        e.preventDefault();
        pasteClipboard();
        return;
      }
      if (canvasReady && mod && key === 'd') {
        e.preventDefault();
        copySelectionToClipboard();
        pasteClipboard();
        return;
      }
      if (canvasReady && mod && (key === '=' || key === '+' || e.code === 'NumpadAdd')) {
        e.preventDefault();
        zoomAtCanvasCenter(1.15);
        return;
      }
      if (canvasReady && mod && (key === '-' || key === '_' || e.code === 'NumpadSubtract')) {
        e.preventDefault();
        zoomAtCanvasCenter(.87);
        return;
      }
      if (canvasReady && mod && (key === '0' || e.code === 'Numpad0')) {
        e.preventDefault();
        S.scale = 1;
        applyTransform();
        return;
      }
      if (canvasReady && !mod && e.shiftKey && (e.code === 'Digit1' || e.key === '!')) {
        e.preventDefault();
        fitAll();
        return;
      }
      if (canvasReady && !mod && key === 'f') {
        e.preventDefault();
        focusNode(S.selected);
        return;
      }
      if (canvasReady && !mod && key === 'g') {
        e.preventDefault();
        toggleSnap();
        return;
      }
      if (canvasReady && !mod && e.altKey && e.code === 'KeyH') {
        e.preventDefault();
        layoutHorizontal();
        return;
      }
      if (canvasReady && !mod && e.altKey && e.code === 'KeyV') {
        e.preventDefault();
        layoutVertical();
        return;
      }
      if (canvasReady && !mod && (key === 'n' || e.key === 'Tab')) {
        e.preventDefault();
        openPickerAtCanvasCenter();
        return;
      }
      if (canvasReady && !mod && e.key === 'Enter') {
        e.preventDefault();
        nextStep();
        return;
      }
      if (canvasReady && (e.key === 'Delete' || e.key === 'Backspace')) {
        if (S.selectedConns.size) {
          e.preventDefault();
          removeSelectedConnections();
          return;
        }
        if (selectedNodeIds().length) {
          e.preventDefault();
          deleteSelection();
          return;
        }
      }
      if (e.key === ' ' && !isTyping()) {
        e.preventDefault();
        S.space = true;
      }
      if (e.key === 'Escape') {
        closePicker();
        closeEditor();
        S.pendingConnect = null;
        if (S.connect) cancelConnect();
        hideMarquee();
        clearCanvasGestures();
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === ' ') S.space = false;
    });
    window.addEventListener('blur', () => {
      S.space = false;
      clearCanvasGestures();
    });
  }

  function bindUi(){
    $('smartTabBtn').addEventListener('click', () => switchTab('smart'));
    $('infiniteTabBtn').addEventListener('click', () => switchTab('infinite'));
    $('toolbarToggleBtn')?.addEventListener('click', () => {
      const expanded = !$('toolbar').classList.contains('expanded');
      $('toolbar').classList.toggle('expanded',expanded);
      $('toolbarToggleBtn').setAttribute('aria-expanded',String(expanded));
      $('toolbarToggleBtn').querySelector('.tb-tool-label').textContent = expanded ? '收起' : '展开';
    });
    document.querySelectorAll('[data-mode]').forEach((btn) => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    document.querySelectorAll('[data-track]').forEach((btn) => btn.addEventListener('click', () => setTrack(btn.dataset.track)));
    renderDataPackOptions();
    $('dataPackSelect')?.addEventListener('change', (event) => setActiveDataPack(event.target.value));
    $('syncDataPacksBtn')?.addEventListener('click', syncDataPacksFromAdmin);
    renderExecutionModelOptions();
    $('executionModelSelect')?.addEventListener('change', (event) => setExecutionModel(event.target.value));
    $('startBtn').addEventListener('click', startCreative);
    $('nextBtn').addEventListener('click', nextStep);
    $('resetFlowBtn').addEventListener('click', () => { seedInitial(); toast('流程已重置'); });
    $('fitAllBtn').addEventListener('click', fitAll);
    $('focusSelBtn').addEventListener('click', () => focusNode(S.selected));
    $('layoutHBtn').addEventListener('click', layoutHorizontal);
    $('layoutVBtn').addEventListener('click', layoutVertical);
    $('snapBtn').addEventListener('click', toggleSnap);
    $('selectAllBtn')?.addEventListener('click', () => {
      S.multiSelected = new Set(Object.keys(S.nodes));
      S.selected = [...S.multiSelected][0] || null;
      updateNodeSelection();
      if (S.multiSelected.size) toast(`已全选 ${S.multiSelected.size} 个节点`);
    });
    $('selCopyBtn')?.addEventListener('click', copySelectionToClipboard);
    $('selDelBtn')?.addEventListener('click', deleteSelection);
    $('selBboxBtn')?.addEventListener('click', () => {
      const ids = selectedNodeIds();
      const id = ids[ids.length - 1] || S.selected;
      if (id) quickDownstream(id,true);
    });
    $('manualAddBtn').addEventListener('click', () => {
      const r = stage.getBoundingClientRect();
      const p = screenToWorld(r.left + r.width * .52,r.top + r.height * .5);
      openPicker({x:p.x,y:p.y,screenX:r.left + r.width * .52,screenY:r.top + r.height * .5});
    });
    $('zoomOutBtn').addEventListener('click', () => zoomAtCanvasCenter(.87));
    $('zoomInBtn').addEventListener('click', () => zoomAtCanvasCenter(1.15));
    $('resetBtn').addEventListener('click', resetView);
    pickerSearch.addEventListener('input', renderPicker);
    pickerList.addEventListener('click', (e) => {
      const item = e.target.closest('.picker-item');
      if (!item) return;
      if (S.pendingConnect) {
        completePendingConnection(item.dataset.type);
        closePicker();
        return;
      }
      const n = createNode(item.dataset.type,S.pickerPos.x,S.pickerPos.y);
      S.selected = n.id;
      closePicker();
      render();
    });
    connSvg.addEventListener('click', (e) => {
      const target = e.target.closest?.('.conn-group,.conn-hit,.conn:not(.temp)');
      if (!target || !connSvg.contains(target)) return;
      const idx = Number(target.dataset.connIdx || target.closest?.('.conn-group')?.dataset.connIdx);
      if (!Number.isInteger(idx)) return;
      e.preventDefault();
      e.stopPropagation();
      selectConnection(idx,e.shiftKey || e.metaKey || e.ctrlKey);
    });
    $('editorCloseBtn').addEventListener('click', closeEditor);
    $('editorCancelBtn').addEventListener('click', closeEditor);
    $('editorSaveBtn').addEventListener('click', saveEditor);
    editorBody.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-editor-action]');
      if (!btn) return;
      const id = S.editorNode;
      if (btn.dataset.editorAction === 'openWorkflow' && id) openWorkflowEditor(id);
    });
    window.addEventListener('resize', () => { applyTransform(); drawConns(); });
    window.addEventListener('storage', (event) => {
      if (TOKEN_REFRESH_KEYS.has(event.key)) refreshModelsAfterSharedAuthChange();
    });
    window.addEventListener('focus', refreshModelsAfterSharedAuthChange);
  }

  function probeDelay(ms){
    return new Promise((resolve) => setTimeout(resolve,ms));
  }

  function probeState(){
    const nodes = Object.values(S.nodes).sort(byFlowOrder).map((n) => ({
      id:n.id,
      type:n.type,
      title:nodeDisplayName(n),
      status:n.status || 'waiting',
      selected:n.id === S.selected,
      hasOutput:Boolean(n.data?.userDeliverable || n.data?.summary),
      workflow:Boolean(isWorkflowType(n.type))
    }));
    return {
      ready:true,
      mode:S.mode,
      track:S.track,
      activeTab:S.activeTab,
      selected:S.selected,
      nodeCount:nodes.length,
      connCount:S.conns.length,
      runningCount:nodes.filter((n) => n.status === 'running').length,
      successCount:nodes.filter((n) => n.status === 'success').length,
      failedCount:nodes.filter((n) => n.status === 'failed').length,
      timerCount:S.timers.size,
      dynamicStepCount:S.dynamicPlan?.steps?.length || 0,
      nodes,
      conns:S.conns.map((conn) => ({from:conn.from,to:conn.to,fromPort:conn.fromPort,toPort:conn.toPort}))
    };
  }

  async function waitProbeStable(timeoutMs=12000,stableMs=420){
    const started = Date.now();
    let lastSignature = '';
    let stableSince = Date.now();
    while (Date.now() - started < timeoutMs) {
      const state = probeState();
      const signature = JSON.stringify({
        nodeCount:state.nodeCount,
        connCount:state.connCount,
        runningCount:state.runningCount,
        failedCount:state.failedCount,
        successCount:state.successCount,
        timerCount:state.timerCount,
        selected:state.selected
      });
      if (signature !== lastSignature || state.runningCount || state.timerCount) {
        lastSignature = signature;
        stableSince = Date.now();
      }
      if (!state.runningCount && !state.timerCount && Date.now() - stableSince >= stableMs) return state;
      await probeDelay(80);
    }
    return probeState();
  }

  function prepareProbeFlow(mode){
    S.browserProbeMode = true;
    if (S.track !== 'auto') setTrack('auto');
    setMode(mode);
    seedInitial();
    const input = Object.values(S.nodes).find((node) => node.type === 'svInput');
    if (!input) throw new Error('probe input node missing');
    input.values.script = '浏览器探针剧本：雨夜修复师发现会改变现实的古画。';
    input.values.sourceType = '故事梗概';
    S.selected = input.id;
    render();
    return input;
  }

  async function runAssistedProbe(){
    const input = prepareProbeFlow('assisted');
    runNode(input.id);
    let state = await waitProbeStable(9000);
    if (S.nodes[input.id]?.status !== 'success') return {...state,status:'failed',reason:'input_not_success'};
    nextStep();
    state = await waitProbeStable(9000);
    const downstream = findDownstream(input.id);
    return {
      ...state,
      status:downstream && state.nodeCount >= 3 && state.connCount >= 2 && S.nodes[downstream.id]?.status === 'success' ? 'passed' : 'failed',
      assistedDownstream:downstream ? {id:downstream.id,type:downstream.type,status:S.nodes[downstream.id]?.status} : null
    };
  }

  async function runAutoProbe(){
    const input = prepareProbeFlow('auto');
    startCreative();
    const state = await waitProbeStable(26000,620);
    const release = Object.values(S.nodes).find((node) => node.type === 'svRelease');
    return {
      ...state,
      status:release?.status === 'success' && state.nodeCount >= 12 && state.connCount >= 11 && state.failedCount === 0 ? 'passed' : 'failed',
      release:release ? {id:release.id,status:release.status} : null
    };
  }

  async function ensureAutoProbeFlow(){
    const release = Object.values(S.nodes).find((node) => node.type === 'svRelease' && node.status === 'success');
    if (release) return probeState();
    return runAutoProbe();
  }

  async function runOutputDetailProbe(){
    await ensureAutoProbeFlow();
    let state = probeState();
    const shotNode = Object.values(S.nodes).find((node) => node.type === 'svShotTable' && node.status === 'success');
    if (!shotNode) return {...state,status:'failed',reason:'shot_table_missing'};
    editOutput(shotNode.id);
    await probeDelay(80);
    const shotEditorVisible = editorMask.classList.contains('show') && S.editorMode === 'output';
    const shotEditorText = editorBody.textContent || '';
    const shotSummary = editorBody.querySelector('[data-output-field="summary"]');
    if (shotSummary) shotSummary.value = `${shotSummary.value || ''} 已人工校验。`.trim();
    saveOutputEditor(shotNode.id);
    await probeDelay(80);
    const shotSaved = Boolean(S.nodes[shotNode.id]?.values?.editedOutput && String(S.nodes[shotNode.id]?.data?.userDeliverable?.summary || '').includes('人工校验'));

    const workflowNode = Object.values(S.nodes).find((node) => isWorkflowType(node.type) && node.status === 'success');
    if (!workflowNode) return {...probeState(),status:'failed',reason:'workflow_node_missing',shotEditorVisible,shotSaved};
    workflowNode.data = attachUserDeliverable(workflowNode,workflowNode.data || {},{
      kind:deliverableKindForNode(workflowNode),
      title:'资产图输出验收',
      summary:'资产图渲染结果可查看，内部工作流参数不在交付区展示。',
      items:[{
        id:'probe-asset-01',
        title:'资产图 01',
        description:'用于验证输出详情缩略图和产物路径入口。',
        assetPath:'01-资产图与提示词/资产图/probe-output.png',
        status:'ready'
      }],
      primaryArtifactLabel:'资产图',
      primaryArtifactPath:'01-资产图与提示词/资产图/probe-output.png'
    });
    render();
    editOutput(workflowNode.id);
    await probeDelay(80);
    const workflowEditorVisible = editorMask.classList.contains('show') && S.editorMode === 'output';
    const workflowEditorText = editorBody.textContent || '';
    const mediaSrc = editorBody.querySelector('.smart-media-thumb img,.smart-media-thumb video')?.getAttribute('src') || '';
    const workflowActionVisible = Boolean(editorBody.querySelector('[data-editor-action="openWorkflow"]'));
    openWorkflowEditor(workflowNode.id);
    await probeDelay(160);
    const frameSrc = infiniteFrame.getAttribute('src') || '';
    const workflowOpened = S.activeTab === 'infinite' && frameSrc.includes('image-studio-canvas.html');
    switchTab('smart');
    state = probeState();
    const passed = shotEditorVisible
      && shotSaved
      && workflowEditorVisible
      && workflowActionVisible
      && mediaSrc.includes('/read?path=')
      && workflowOpened
      && !/\{\s*"workflowPath"/.test(shotEditorText)
      && workflowEditorText.includes('交付区');
    return {
      ...state,
      status:passed ? 'passed' : 'failed',
      shotEditorVisible,
      shotSaved,
      workflowEditorVisible,
      workflowActionVisible,
      mediaSrc,
      workflowOpened,
      frameSrc,
      userFacingOnly:!/\{\s*"workflowPath"/.test(shotEditorText),
      workflowEditorHasDeliverySection:workflowEditorText.includes('交付区')
    };
  }

  function deliverableQualityExpectations(){
    return [
      {type:'svWriter',kind:'adapted_script',label:'改编后分话剧本',minItems:1,keywords:['剧本段','视频段']},
      {type:'svDirector',kind:'director_brief',label:'导演讲戏稿',minItems:1,keywords:['镜头','表演']},
      {type:'svShotTable',kind:'shot_table',label:'分镜剧本表',minItems:1,keywords:['镜号','时长','场景','画面']},
      {type:'svAssetCard',kind:'asset_cards',label:'资产卡',minItems:3,keywords:['资产卡','角色','场景']},
      {type:'svAssetWorkflow',kind:'asset_images',label:'资产图',minItems:1,keywords:['资产图','交付区']},
      {type:'svStoryboardWorkflow',kind:'storyboard',label:'故事板',minItems:1,keywords:['故事板','交付区']},
      {type:'svVideoWorkflow',kind:'video',label:'视频成片',minItems:1,keywords:['视频','交付区']},
      {type:'svQa',kind:'qa_report',label:'QA 审核报告',minItems:3,keywords:['门禁','审核']},
      {type:'svRelease',kind:'release_package',label:'发布包',minItems:3,keywords:['发布包','manifest']}
    ];
  }

  function containsInternalPayloadLeak(text){
    return /"workflowPath"|"workflowDraft"|"canvasRunSession"|"dynamicPlan"|"plannerResult"|"adapterPayload"|"internal"|__SMART_CANVAS_V2_PROBE__|\{\s*"[^"]+"\s*:/.test(String(text || ''));
  }

  async function runDeliverableQualityProbe(){
    await ensureAutoProbeFlow();
    const results = [];
    for (const expected of deliverableQualityExpectations()) {
      const node = Object.values(S.nodes).find((item) => item.type === expected.type && item.status === 'success');
      if (!node) {
        results.push({...expected,status:'failed',reason:'node_missing'});
        continue;
      }
      const deliverable = normalizeDeliverable(node);
      editOutput(node.id);
      await probeDelay(50);
      const editorText = editorBody.textContent || '';
      const itemCount = Array.isArray(deliverable.items) ? deliverable.items.length : 0;
      const itemText = Array.isArray(deliverable.items)
        ? deliverable.items.map((item) => [item.title,item.description,item.visual,item.action,item.dialogue,item.prompt].filter(Boolean).join(' ')).join(' ')
        : '';
      const readableText = [editorText,deliverable.title,deliverable.summary,deliverable.body,itemText].filter(Boolean).join(' ');
      const keywordMissing = expected.keywords.filter((keyword) => !readableText.includes(keyword));
      const mediaSrc = editorBody.querySelector('.smart-media-thumb img[src],.smart-media-thumb video[src]')?.getAttribute('src') || '';
      const mediaBroken = ['asset_images','storyboard','video'].includes(expected.kind)
        && Boolean(mediaSrc)
        && !/^(\/read\?path=|data:|blob:|https?:)/.test(mediaSrc);
      const leak = containsInternalPayloadLeak(editorText);
      const passed = deliverable.kind === expected.kind
        && itemCount >= expected.minItems
        && !keywordMissing.length
        && !leak
        && !mediaBroken;
      results.push({
        type:expected.type,
        title:node.title,
        expectedKind:expected.kind,
        kind:deliverable.kind,
        label:expected.label,
        itemCount,
        status:passed ? 'passed' : 'failed',
        keywordMissing,
        leak,
        mediaBroken,
        mediaSrc,
        editorPreview:shortText(editorText.replace(/\s+/g,' '),220)
      });
      closeEditor();
    }
    const failed = results.filter((item) => item.status !== 'passed');
    return {
      ...probeState(),
      status:failed.length ? 'failed' : 'passed',
      checked:results.length,
      failed,
      results
    };
  }

  function installSmartCanvasV2Probe(){
    window.__SMART_CANVAS_V2_PROBE__ = {
      kind:'smart-canvas-v2-browser-probe',
      state:probeState,
      runAssisted:runAssistedProbe,
      runAuto:runAutoProbe,
      runOutputDetail:runOutputDetailProbe,
      runDeliverableQuality:runDeliverableQualityProbe
    };
  }

  bindStage();
  bindUi();
  if (IS_BROWSER_PROBE) installSmartCanvasV2Probe();
  sharedAuthSignature = currentSharedAuthSignature();
  void loadDataPacks();
  void loadExecutionModels();
  loadStyleWordlists().finally(() => {
    seedInitial();
    setMode('assisted');
  });
})();
