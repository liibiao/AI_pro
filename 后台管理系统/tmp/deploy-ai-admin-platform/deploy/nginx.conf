server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  root /var/www/ai-admin/workbench-web;
  index image-studio-canvas-next.html index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location = / {
    return 302 /image-studio-canvas-next.html;
  }

  location = /image-studio-canvas-next.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files /image-studio-canvas-next.html =404;
  }

  location ~* ^/(image-studio|workbench)[^/]*\.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  location /canvas-next/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  location ~* ^/(models|assets)/.*\.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|json)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /admin/index.html {
    alias /var/www/ai-admin/ai-admin-platform/admin-web/dist/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
  }

  location /admin/assets/ {
    alias /var/www/ai-admin/ai-admin-platform/admin-web/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  location /admin/ {
    alias /var/www/ai-admin/ai-admin-platform/admin-web/dist/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files $uri $uri/ /admin/index.html;
  }

  location /agent/ {
    alias /var/www/ai-admin/ai-admin-platform/admin-web/dist/;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files $uri $uri/ /admin/index.html;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /integrations/ {
    proxy_pass http://127.0.0.1:4000/integrations/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    expires -1;
    try_files $uri $uri/ /image-studio-canvas-next.html;
  }
}
