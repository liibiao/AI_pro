 粘贴下方提示词\n\n| 上传序号 | Seedance 名称 | 对应 @资源 | 本地路径 |\n|---------|--------------|-----------|---------|\n| 1 | Image1 | @char-lintian | 06-generated/images/characters/林天觉醒前-v8-1.png |\n| 2 | Image2 | @char-linaotian | 06-generated/images/characters/林傲天-v8-1.png |\n| 3 | Image3 | @char-linxiao | 06-generated/images/characters/林啸-v8-1.png |\n| 4 | Image4 | @scene-trainingground | 06-generated/images/scenes/林家练武场-v8-2.png |\n\n---\n\n## 即梦版（Omni-Reference）\n\n```text\n模式：全能参考（Omni-Reference）。\n要求：人物一致性锁定、主光方向一致、字幕安全区保留、不要多余人物与黑边。\n风格旋钮：纪实克制（可选：纪实克制/形式主义/新黑色/热血爆点）\n\n全局母指令（稳定性优先，镜头只写差异项）：\n\n摄影机系统：真实电影机位语言；镜头以标头/轻长焦为主，少用极端广角避免脸部变形；景深策略=主体清晰、背景可适度虚化；运镜克制，除非剧情动机强烈否则避免花活。\n镜头运动质感：默认稳定电影感；需要压迫/不安时允许轻微手持颗粒感（幅度极小）；高速动作时背景允许速度感，人物与武器边缘必须清晰可读。\n几何门禁（构图稳定）：画面水平 roll=0±1°；倾斜镜头(Dutch angle)默认禁止；地平线/消失点尽量稳定（同一空间不乱漂）；对话/对峙保持眼线高度一致。\n\n光影方案：主光方向全片一致；末世暗灰基底+冷蓝灵纹光作为点光源；人物面部不允许被特效光污染糊掉；关键读点（眼神/手/命中点/道具字）必须被光线照见。\n对比与黑位：黑位干净，不雾化；暗部保留层次，避免整张灰；高光受控，避免塑料反光与过曝。\n\n调色与质感：低饱和冷调为主，爆点只在‘灵纹/雷霆/系统金光’局部提饱和；轻 film grain；锐度分配=人物>关键道具字>背景；拒绝廉价霓虹彩虹全屏光污染。\n\n美术与构图秩序：读点顺序=首看点→第二读点→环境信息；三层景别（前/中/后）清晰；禁止新增角色、禁止乱加道具、禁止乱贴文字UI；字幕安全区必须留白，关键动作不进入安全区。\n\n剪辑与节奏：留白是武器——在‘羞辱/钩子/爆点前’允许抽空；爆点只抬 1-2 拍马上收束；转场只用硬切/叠化/闪切/定格，不要炫技转场。\n\n声音总纲（按《听觉设计与声音蒙太奇规范》）：配音永远优先；环境底噪( Room Tone )先铺空间；拟音必须反映材质与重量；特效音分层（低频冲击/中频肉感/高频碎裂或电弧）；BGM克制，关键台词与关键命中点必须让位；允许‘反高潮静音’与‘先静后响’制造张力。\n\n导演门禁（空间与读点）：先建立空间再动作；人物相对位置与屏幕方向必须跨镜头一致；遵守 180° 轴线（不随意跳轴）；角色与关键道具的“谁前谁后/谁高谁低/谁左谁右/距离与视线落点”必须写清；首看点必须可见且不被特效遮挡。\n群戏门禁（人群调度）：人群必须分组并锁定屏幕方位（左/右/后），三组不穿越主角前景，不互相穿插走位；三组人数固定、动作循环固定、节拍频率固定（每 2 秒最多 1 次集体动作，其他时刻只做微小呼吸/头部微动）；镜头切换时群演保持上一镜结束姿态，禁止瞬间重排；群声与画面方位一致（左侧起哄、右侧窃笑、后景围压），并让位主台词。\n坐标门禁（解决站位漂移）：采用 9:16 归一化屏幕坐标 x,y∈[0,1]（x=左→右，y=上→下）描述站位；主角活动区与群众禁入区必须明确；群演位移≤画面宽度的 3%/秒；命中点/首看点固定在中心偏上 1/3 附近（允许 ±5% 微调）。\n字幕/版式门禁（9:16）：字幕安全区= y0.82-1.00；关键读点（脸/眼神/手/命中点/关键字）禁止进入字幕安全区；群演与道具也不得侵入该区，避免遮挡字幕与信息冲突。\n负向约束（门禁）：禁止额外角色；禁止随机道具；禁止多余 UI/字幕/水印/Logo；禁止黑边与画幅漂移；禁止过度磨皮与塑料高光；禁止全屏雾化导致主体糊。\n\n风格偏好（覆盖项）：\n风格偏好（纪实克制）：机位克制、情绪内收、信息可读优先；少炫技，多用真实空间与表演细节完成压迫与反转。\n摄影机：以标头/轻长焦为主，轻微呼吸感推拉；手持只在“心理不稳”时极弱介入。\n光影：自然主义主光+少量负补光；阴影压迫但不遮眼神与口型。\n声音：环境底噪与拟音比 BGM 更重要；BGM 以低频 Drone 铺底，爆点前先抽空。\n\n打戏门禁：命中点/结果镜头清晰；受力反馈必须落到‘推/退/碎/裂/回弹’的可读结果；音效先给命中瞬态再给尾音与环境回响，禁止一团噪声糊过去。\n打戏控场（可选增强，不替代项目规范）：motion blur on BACKGROUND ONLY (characters and weapons stay crisp), sharp shadows.\n打戏写法（结构增强）：用时间戳微雕动作链与机位（避免‘史诗级激烈’空词）。\n空间锚定：主空间=@林家练武场 | 屏幕方向锁定=@林天:画面右侧，@林傲天:画面左侧，@林啸:画面左侧（上位） | 180°轴线=@林天↔@林傲天（不跳轴） | 距离标尺=对峙 2-4m；拉拽 0.3-0.6m；命中点=中心偏上 1/3 | 地平线与眼线=地平线 y0.42±0.03（同空间稳定）；眼线 y0.48±0.05（对话一致）；roll=0±1° | 连续性=同一空间内左右/前后/高低关系不互换；如需反打先给建立镜头再切\n\n\n## Shot 1 — HOOK（燃烧启动）\n\n【0-4s】\n【运镜】低角度推入→黑金粒子蔓延\n【镜头参数】焦段倾向 35-50mm；中等景深；机位 眼平为主\n【几何约束】地平线 y0.42±0.03（同一空间保持稳定）；眼线 y0.46±0.05；roll=0±1°；禁止跳轴；同空间消失点稳定\n【画面】@林天浑身战损却站起，黑金之力像从血肉里点燃，粒子从胸口向四肢蔓延；人群被杀意逼退，画面出现“危险的反杀气场”。\n【表演】微表情克制：眉压/嘴角紧/下颌线绷；情绪在皮下翻涌\n【参考】@林家练武场, @林天\n【音效】环境底噪: 练武场室外底噪（热浪+尘土+远处人声） | 拟音: 衣料摩擦、脚步踩尘、低声窃笑的气音 | 特效音: 打击主音：低频闷击+中频肉感+高频碎裂（分层）；冲击波/气浪：whoosh+低频sub hit（不要糊成一团） | 状态音: 心跳/呼吸贴近（主观音），随情绪收紧 | BGM: 低频压迫Drone（不旋律化，避免喧宾夺主） | 混音: 群众声做侧后方空间定位，不盖主台词；命中点要清晰可读，先给主音再给尾音\n【位置关系】空间: @林家练武场（前/中/后景层级清晰，保留字幕安全区） | 队形模板: 环形围压 | 主体: @林天 位于画面右侧（坐标: x0.70 y0.70），留出对手/读点的反打空间 | 群众分组锁定: 左侧起哄组=3人(画面左侧中景)，右侧窃笑组=2人(画面右侧中景)，后景围压组=5人(画面中心偏后景)；三组不穿越主体前景，不互相穿插走位，不抢镜头读点；动作循环(节拍锁定): 每 2 秒最多 1 次集体动作；左侧=指指点点+起哄一拍→立刻收声；右侧=交头接耳+压笑气音→停顿；后景=半步前压→停住→半步回弹；其余时刻只做微小呼吸/头部微动；镜头切换连续性: 群演保持上一镜结束姿态与位置，禁止瞬间换站位/换人数；群声方位随画面（左起哄/右窃笑/后压迫），不盖主台词；屏幕坐标锁定(9:16 x,y): 主角活动区 x0.40-0.60 y0.55-0.95（群众禁入）；左组 x0.05-0.30 y0.45-0.75；右组 x0.70-0.95 y0.45-0.75；后组 x0.30-0.70 y0.15-0.45；路径点: 左/右组 A(原位)→B(前压5%)→A；后组 A(y0.35)→B(y0.42)→A；位移≤3%画面宽度/秒；字幕安全区禁入: y0.82-1.00 任何群演/道具/特效不得进入\n【读点保护】首看点=首看点；坐标= x0.50±0.05, y0.33±0.05（中心偏上 1/3 锁定）；对比与清晰度优先（人物>关键道具字/命中点>背景）；任何特效光/运动模糊不得遮挡首看点；禁止侵入字幕安全区 y0.82-1.00\n【风格】统一画风、主光方向与字幕安全区；提示词只写动态变化，不重复静态事实\n\n【转场】叠化→硬切（先稳后狠，保证信息可读）；群演循环不变，只切主角反应\n---\n\n\n## Shot 2 — PROBLEM（血债言语刀）\n\n【4-8s】\n【运镜】中景定镜→轻推卡住脸与眼神\n【镜头参数】焦段倾向 35-50mm；中等景深；机位 眼平为主\n【几何约束】地平线 y0.42±0.04（或以建筑水平线替代）；眼线 y0.48±0.05；roll=0±1°；禁止跳轴；同空间消失点稳定\n【画面】@林天嘴角带血却笑得像刀，盯住@林啸；@林啸杀意更盛逼近，权威与挑衅对撞，空气紧到能听见吞咽声。\n【表演】动作压住；呼吸压低     const tabs = document.getElementById('tabs');

    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }

    async function copyText(text, successText='已复制') {
      try {
        await navigator.clipboard.writeText(text);
        showToast(successText);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(successText);
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function segmentPrompt(text) {
      const source = String(text || '').replace(/\r/g, '').trim();
      if (!source) return [];
      const lines = source.split('\n');
      const segments = [];
      let current = null;
      const pushCurrent = () => {
        if (!current) return;
        current.value = (current.value || '').trim();
        if (current.value) segments.push(current);
        current = null;
      };

      lines.forEach(line => {
        const trimmed = line.trim();
        const fieldMatch = trimmed.match(/^([@A-Za-z0-9_\-\u4e00-\u9fa5\/]+)\s*[:：]\s*(.*)$/);
        if (fieldMatch) {
          pushCurrent();
          current = { label: fieldMatch[1], value: fieldMatch[2] || '' };
          return;
        }
        if (!current) {
          current = { label: '', value: trimmed };
          return;
        }
        current.value += `${current.value ? '\n' : ''}${line}`;
      });
      pushCurrent();
      return segments;
    }

    function classifyPromptLabel(label) {
      const text = String(label || '').trim();
      if (!text) return 'role-plain';
      if (text.startsWith('@')) return 'role-character';
      if (/主体|角色|人物/.test(text)) return 'role-subject';
      if (/空间|场景|环境/.test(text)) return 'role-space';
      if (/光影|氛围|色彩/.test(text)) return 'role-light';
      if (/镜头|运镜|景别|机位/.test(text)) return 'role-camera';
      return 'role-plain';
    }

    function renderPromptContent(text) {

        return `<div class="prompt-plain">${escapeHtml(text || '')}</div>`;

      return `<div class="prompt-segments">${segments.map(segment => {
        const roleClass = classifyPromptLabel(segment.label);
        const head = segment.label ? `<div class="prompt-segment-head"><span class="prompt-tag ${roleClass}">${escapeHtml(segment.label)}</span></div>` : '';
        return `<div class="prompt-segment">${head}<div class="prompt-segment-body">${escapeHtml(segment.value)}</div></div>`;
      }).join('')}</div>`;
    }

    function render() {
      tabs.innerHTML = datasets.map(ds => `<button class="tab-btn ${ds.kind===currentKey?'active':''}" onclick="switchTab('${ds.kind}')">${ds.title}</button>`).join('');
      panels.innerHTML = datasets.map(ds => `
        <section class="panel ${ds.kind===currentKey?'active':''}" id="panel-${ds.kind}">
          <div class="panel-head">
            <div>
              <h2>${ds.title}</h2>
              <span>列结构：# / 时间段 / 景别 / 运镜 / 画面描述 / 光影氛围 / ${ds.promptLabel}</span>
            </div>
            <div>
              <button class="copy-btn secondary" onclick="copyAllPrompts('${ds.kind}')">复制全部提示词</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>时间段</th>
                  <th>景别</th>
                  <th>运镜</th>
                  <th>画面描述</th>
                  <th>光影氛围</th>
                  <th>${ds.promptLabel}</th>
                </tr>
              </thead>
              <tbody>
                ${ds.rows.map(row => `
                  <tr>
                    <td class="small">${escapeHtml(row.id)}</td>
                    <td class="small">${escapeHtml(row.time)}</td>
                    <td class="small">${escapeHtml(row.shot)}</td>
                    <td class="small">${escapeHtml(row.move)}</td>
                    <td class="desc">${escapeHtml(row.desc)}</td>
                    <td class="desc">${escapeHtml(row.light)}</td>
                    <td class="prompt">
                      <div class="prompt-box">${renderPromptContent(row.prompt)}</div>
                      <div class="row-actions">
                        <button class="copy-btn" data-copy-action="prompt" data-dataset-kind="${ds.kind}" data-row-id="${escapeHtml(row.id)}">复制本镜提示词</button>
                        <button class="copy-btn secondary" data-copy-action="row" data-dataset-kind="${ds.kind}" data-row-id="${escapeHtml(row.id)}">复制本镜整行</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `).join('');
    }

    function switchTab(key) {
      currentKey = key;
      if (location.hash !== `#${key}`) {
        history.replaceState(null, '', `#${key}`);
      }
      render();
    }

    window.addEventListener('hashchange', () => {
      const next = (location.hash || '').replace('#', '');
      if (datasets.some(ds => ds.kind === next) && next !== currentKey) {
        currentKey = next;
        render();
      }
    });

    function getCurrentDataset() {
      return datasets.find(ds => ds.kind === currentKey) || datasets[0];
    }

    function copyAllPrompts(kind) {
      const ds = datasets.find(item => item.kind === kind);
      if (!ds) return;
      const text = ds.rows.map(row => `【${row.id || '-'}｜${row.time || '-'}】\n${row.prompt || ''}`).join('\n\n');
      copyText(text, `已复制${ds.title}全部提示词`);
    }

    function copyCurrentAll() {
      copyAllPrompts(currentKey);
    }

    function copyCurrentTable() {
      const ds = getCurrentDataset();
      const header = `#\t时间段\t景别\t运镜\t画面描述\t光影氛围\t${ds.promptLabel}`;
      const lines = ds.rows.map(r => [r.id, r.time, r.shot, r.move, r.desc, r.light, r.prompt].join('\t'));
      copyText([header, ...lines].join('\n'), '已复制当前表格全文');
    }

    function openCurrentSource() {
      const ds = getCurrentDataset();
      if (ds?.url) window.open(ds.url, '_blank');
    }

    function goWorkbench() {
      window.location.href = '/workbench.html';
    }

    function handleRowCopy(event) {
      const button = event.target.closest('[data-copy-action]');
      if (!button) return;

      const datasetKind = button.getAttribute('data-dataset-kind');
      const rowId = button.getAttribute('data-row-id');
      const action = button.getAttribute('data-copy-action');
      const ds = datasets.find(item => item.kind === datasetKind);
      if (!ds) return;
      const row = ds.rows.find(item => String(item.id) === String(rowId));
      if (!row) return;

      if (action === 'prompt') {
        copyText(row.prompt || '', `已复制第${row.id}镜提示词`);
        return;
      }

      if (action === 'row') {
        const fullRowText = `#${row.id} | ${row.time || ''} | ${row.shot || ''} | ${row.move || ''}\n画面描述：${row.desc || ''}\n光影氛围：${row.light || ''}\n${ds.promptLabel}：\n${row.prompt || ''}`;
        copyText(fullRowText, `已复制第${row.id}镜整行`);
      }
    }

    panels.addEventListener('click', handleRowCopy);

    if (location.hash) {
      const next = location.hash.replace('#', '');
      if (datasets.some(ds => ds.kind === next)) {
        currentKey = next;
      }
    }

    render();
  </script>
</body>
</html>
