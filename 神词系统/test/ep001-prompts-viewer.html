          {id:'4', time:'29s-41s', shot:'中景', move:'高低位定镜压视', desc:'林啸上位、婚约、条件威胁连续闪回。', light:'高位冷光照亮林啸，低位暗部吞没兄妹。', prompt:`主体：@林啸（阴鸷掌控）[朝向：俯视下方] 正在 稳稳坐在家主位上→缓缓垂眼看向跪地兄妹→徐徐压住全场，肩背不动，指尖轻贴扶手，表情从冷漠转为审判；@婚约红纸（被掠夺的命运象征）[朝向：平放桌案] 正在 猛然被一只粗暴的手抓起→骤然捏出褶皱→徐徐定在“林婉儿”“林傲天”的名字上；@林天（被逼到角落）[朝向：仰视@林啸] 正在 静静跪着→微微收紧肩膀→渐渐压住屈辱，呼吸发紧，表情从不安转为隐忍（连续闪回压缩）\n空间：前景-婚约红纸与转动的玉扳指 中景-高位@林啸与跪地@林天、@林婉儿 背景-冷暗大殿与空荡阶位（高位与低位形成垂直压制）\n光影：单侧高位冷光只打亮家主位，婚约红纸残留暗暖反光，玉扳指射出冷亮高光，形成强权与掠夺并置的压迫感\n镜头：中景，镜头固定高低位构图并快速掠过婚约纸与扳指，微仰（轴线：兄妹在画下·林啸在画上）\n台词：第1s 旁白：\"家族权力洗牌，林啸上位。他和妹妹，沦为众人眼里‘白吃资源的废物’。\" 第4s 旁白：\"三天前，林啸传命——‘林婉儿到婚龄了，嫁给我儿林傲天。’\" 第8s @林啸：\"除非，你能在这场族中测试中，证明你还有价值。\" 第10s 旁白：\"他清楚——这根本不是婚约，是抢人。他们看中的，不是妹妹，是她身上那跟禁忌遗物一模一样的银色纹路。\"\n音效：环境层-大殿空旷混响 动作层-纸张褶皱声、玉扳指转动轻响、跪地衣料摩擦声 情绪层-冷硬弦乐与低频压迫音 [禁字幕]`},
          {id:'5', time:'41s-53s', shot:'中景', move:'仰拍跟进', desc:'林傲天登场挑衅，林天拳头攥紧银纹一闪。', light:'烈日硬光打金甲形成炫目压场感。', prompt:`主体：@林傲天（傲慢碾压）[朝向：面朝@林天] 正在 大步从人群中走出→骤然停在场中→缓缓抬下巴俯视@林天，金纹战甲随着步伐发亮，肩背展开，表情从玩味转为轻蔑；@林天（强压怒意）[朝向：面朝@林傲天] 正在 静静承受众人目光→渐渐握紧拳头→骤然亮起手腕银纹一丝冷蓝电弧，指节发白，表情从隐忍转为不甘（切回现实后的正面对峙）\n空间：前景-围观人群肩背与扬起的尘土 中景-@林傲天逼近@林天、场中央@黑色巨碑隐约在后 背景-练武场与烈日下翻动的旗影（两人形成压迫性对峙）\n光影：正午烈日从高位打亮@林傲天金甲，甲片反光刺目，@林天仍半陷在阴影边缘，冷蓝电弧像被压住的一次反击，整体光感尖锐、炙热、压迫\n镜头：中景，镜头跟着@林傲天出人群并轻微仰拍逼近，随后定在两人对峙与@林天握拳细节之间，微仰（轴线：@林天在画左·@林傲天在画右）\n台词：第2s @林傲天：\"哟，林天。躲这么久，今天终于露头了？\" 第4s 围观少年C：\"林傲天，天赋异禀，十八岁就聚灵境了，林家年轻一代的第一天才。\" 第6s 围观少年D：\"林天那废物？十年还卡在练体境，早废了。\" 第8s @林傲天：\"这次测试，灵纹若不到A级，你就滚出林家——把婉儿留下。\" 第10s 围观群众：\"A级灵纹？别做梦了！\"\n音效：环境层-练武场嘈杂与烈日热浪底噪 动作层-战甲碰撞声、脚步声、拳头握紧骨节声、电弧轻响 情绪层-铜管压迫音与低频鼓点持续 [禁字幕]`},
          {id:'6', time:'53s-68s', shot:'特写', move:'快速跟拍环绕', desc:'林傲天拍碑，雷霆灵纹A级觉醒全场沸腾。', light:'紫电爆闪压过日光，蓝紫混光统治全场。', prompt:`主体：@执事长老（肃然）[朝向：面朝众人] 正在 稳稳举手宣布开始→缓缓退开测试位置；@林傲天（绝对自信）[朝向：面朝@黑色巨碑] 正在 大步上前→猛然一掌拍上碑面→骤然被雷光包裹，战甲与身体同时吃住后坐力，表情从傲慢转为绝对高位的享受（高潮爆发）\n空间：前景-被强风吹动的衣摆与倒退半步的围观人群 中景-@林傲天与爆闪的@黑色巨碑 背景-练武场边缘和被雷光染蓝的空气（碑顶金字结果悬在画面上方）\n光影：正午日光被雷霆爆闪瞬间压制，紫色闪电与冷蓝反光席卷全场，人物脸部被蓝紫色强光不断切亮，形成极具统治感的觉醒高光\n镜头：特写起手后迅速跟拍到巨碑并环绕捕捉雷光扩散，再拉回结果与全场反应，平视转微仰（结尾动势：定在“A级雷霆灵纹”的结果上）\n台词：第1s @执事长老：\"好了。今日测试，正式开始！\" 第2s @执事长老：\"林傲天，先来。\" 第10s 围观群众：\"天啊——A级雷霆灵纹！！\" 第12s 围观群众：\"不愧是家族年轻一代第一人！\"\n音效：环境层-全场呼吸被抽空后的死寂再到沸腾 动作层-拍碑重击声、雷鸣爆裂、电弧噼啪、狂风掀衣声 情绪层-交响高潮与重击鼓点全面爆发 [禁字幕]`},
          {id:'7', time:'68s-78s', shot:'中景', move:'快速横切', desc:'其他少年测试结果快速掠过，强化等级决定命运。', light:'同一正午硬光下，不同灵纹结果短暂变色。', prompt:`主体：数名林家子弟（紧张各异）[朝向：面朝@黑色巨碑] 正在 依次上前触碑→骤然得到结果→迅速露出惊喜或失落反应，身体动作短促而直接，表情在一瞬间完成命运落差（作为主线压力的对照组）\n空间：前景-触碑的手与碑面反光 中景-轮流上前的测试者 背景-围观人群与仍未散去的雷光余韵（多次快速切换但保持同一空间）\n光影：硬日光保持测试场公开暴晒感，不同灵纹结果在碑面上产生短暂色彩变化，整体仍然是被命运审判的干硬光感\n镜头：中景，镜头快速横切多个测试者与碑面结果，在同一轴线上连续切换，平视（结尾动势：回到仍带雷光余韵的@林傲天）\n台词：第1s 瘦高少年：\"哈哈！E级动物系——猎豹灵纹，终于觉醒了！\" 第5s 憨厚青年：\"唉……D级治疗系，我想上阵杀敌当将军的……\" 第7s 中等少年：\"F级强化系，防御加持……唉，炮灰的命啊。\"\n音效：环境层-围观议论重新升高 动作层-连续拍碑声、短促惊呼、叹息声 情绪层-节奏型弦乐快速推进 [禁字幕]`},
          {id:'8', time:'78s-92s', shot:'中景', move:'硬切跟拍', desc:'林天被点名，林婉儿伸手挽留，林天穿过人群走向巨碑。', light:'阴影区到烈日中心区的路径式光线转变。', prompt:`主体：@林婉儿（无助哀求）[朝向：面朝@林天背影] 正在 颤抖伸手去拉→骤然停在半空→渐渐红了眼眶，手指发白，表情从哀求转为失措；@林天（沉默决绝）[朝向：面朝@黑色巨碑] 正在 没有回头地起身→缓缓离开石阶阴影→一步一步走向场中央，背部逐渐挺直，呼吸压住胸腔起伏，表情从隐忍转为决绝（命运通道开启）\n空间：前景-@林婉儿停在半空的手与石阶边角 中景-@林天穿过自动分开的人群通道 背景-场中央@黑色巨碑与烈日发白的练武场（人物从边缘走入中心）\n光影：角落阴影冷硬包住前半段，随着@林天起身前行，烈日高光一步步把他推出暗部，形成“从废物阴影走向公开审判”的路径式光线变化\n镜头：中景，镜头先硬切到停在半空的手，再跟着@林天穿过人群向巨碑前进，平视（结尾动势：停在碑前）\n台词：第1s @执事长老：\"林天，上来吧。\" 第4s @林婉儿：\"哥，别……\"\n音效：环境层-人群声浪突然压低成窃语 动作层-起身布料摩擦、脚步踩尘声、压抑抽气声 情绪层-大提琴与低频鼓点缓缓上提 [禁字幕]`},
          {id:'9', time:'92s-100s', shot:'特写', move:'缓推后定格', desc:'林天抬手触碑前停住，眼里第一次露出锋利不甘。', light:'碑面冷反光只留下手指与眼中的临界冷光。', prompt:`主体：@林天（不甘将爆）[朝向：面朝@黑色巨碑] 正在 缓缓抬头看向碑面→渐渐抬起手伸向巨碑→骤然在触碰前半寸停住，手腕银纹微亮，呼吸停在胸腔边缘，表情从麻木转为锋利不甘（结尾钩子定格）\n空间：前景-@林天抬起的手与指尖 中景-@林天半身与巨碑表面灵纹 背景-被压暗的人群与练武场\n光影：碑面冷反光与银纹微弱冷蓝光打亮手指和眼睛，背景整体压暗\n镜头：特写，镜头先从手缓缓推到眼睛，再在“不甘”浮现的一瞬间直接定格\n音效：静默热风底噪、指尖轻颤、碑面低频震动、高频细弦骤停 [禁字幕]`}

          {id:'1', time:'0s-8s', shot:'全景', move:'缓慢后退推轨', desc:'屏障笼罩联邦，废土与异兽剪影若隐若现。', light:'冷蓝屏障光压住暖灰废土，末世感强。', prompt:'灰暗苍穹下，巨大能量屏障罩住城市，屏障外荒芜废土风沙弥漫，远处异兽剪影若隐若现，镜头从高空缓慢后退并下落到城市中心的林家区域，末世压抑，电影写实，风沙粒子清晰。旁白保留原文。'},
          {id:'2', time:'8s-26s', shot:'中景', move:'极轻手持横摇', desc:'练武场巨碑、人群、角落兄妹同场出现。', light:'顶光暴晒中央，角落阴影压住兄妹。', prompt:'正午烈日下的林家练武场人头攒动，黑色巨碑立在场中央，围观少年窃笑议论。镜头摇到角落石阶，林天低头缩在阴影里，林婉儿拉着他的衣角，眼眶发红，手腕银色纹路在暗处泛出冷光。林天闭眼深吸气，咬紧牙关，极度隐忍。台词保留原文。'},
          {id:'3', time:'26s-29s', shot:'中景', move:'Match Cut切入', desc:'林战背影与银光物件闪回。', light:'低饱和冷灰记忆光中只有银光突出。', prompt:'从林天紧闭的双眼切入闪回，林战背对镜头站在家族大门前，手中握着发出银光的神秘物件，低饱和冷灰画面里银光是唯一焦点，悲剧而神秘。旁白保留原文。'},
          {id:'4', time:'29s-41s', shot:'中景', move:'高低位定镜压视', desc:'林啸上位、婚约红纸、条件威胁连续闪回。', light:'高位冷光照亮林啸，低位暗部吞没兄妹。', prompt:'冷暗大殿里，林啸高坐家主位，少年林傲天站在他身后，幼年的林天和林婉儿跪在下方。镜头快速切到婚约红纸，上面写着“林婉儿”和“林傲天”，被粗暴捏皱。随后又切回林天跪在林啸面前，林啸慢条斯理转动玉扳指，冷冷提出条件。旁白与台词保留原文。'},
          {id:'5', time:'41s-53s', shot:'中景', move:'仰拍跟进', desc:'林傲天金甲登场挑衅，林天拳头攥紧。', light:'烈日硬光打亮金甲，银纹电弧在阴影里微闪。', prompt:'林傲天穿着金纹战甲从人群中走出，阳光打在金甲上反出刺眼强光，脚步沉重，气场压人。他冷笑着俯视林天。林天默默攥紧拳头，指节发白，手腕上的银色纹路突然闪过一道冷蓝电弧。台词保留原文。'},

    let currentKey = 'storyboard';

    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    const toast = document.getElementById('toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }

    async function copyText(text, successText='已复制') {
      try {
        await navigator.clipboard.writeText(text);
        showToast(successText);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(successText);
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function render() {
      tabs.innerHTML = datasets.map(ds => `<button class="tab-btn ${ds.key===currentKey?'active':''}" onclick="switchTab('${ds.key}')">${ds.title}</button>`).join('');
      panels.innerHTML = datasets.map(ds => `
        <section class="panel ${ds.key===currentKey?'active':''}" id="panel-${ds.key}">
          <div class="panel-head">
            <div>
              <h2>${ds.title}</h2>
              <span>列结构：# / 时间段 / 景别 / 运镜 / 画面描述 / 光影氛围 / ${ds.promptLabel}</span>
            </div>
            <div>
              <button class="copy-btn secondary" onclick="copyAllPrompts('${ds.key}')">复制全部提示词</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>时间段</th>
                  <th>景别</th>
                  <th>运镜</th>
                  <th>画面描述</th>
                  <th>光影氛围</th>
                  <th>${ds.promptLabel}</th>
                </tr>
              </thead>
              <tbody>
                ${ds.rows.map(row => `
                  <tr>
                    <td class="small">${row.id}</td>
                    <td class="small">${row.time}</td>
                    <td class="small">${row.shot}</td>
                    <td class="small">${row.move}</td>
                    <td class="desc">${escapeHtml(row.desc)}</td>
                    <td class="desc">${escapeHtml(row.light)}</td>
                    <td class="prompt">
                      <div class="prompt-box">${escapeHtml(row.prompt)}</div>
                      <div class="row-actions">
                        <button class="copy-btn" data-copy-action="prompt" data-dataset-key="${ds.key}" data-row-id="${row.id}">复制本镜提示词</button>
                        <button class="copy-btn secondary" data-copy-action="row" data-dataset-key="${ds.key}" data-row-id="${row.id}">复制本镜整行</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `).join('');
    }

    function switchTab(key) {
      currentKey = key;
      if (location.hash !== `#${key}`) {
        history.replaceState(null, '', `#${key}`);
      }
      render();
    }

    window.addEventListener('hashchange', () => {
      const next = (location.hash || '#storyboard').replace('#', '');
      if (['storyboard', 'seedance', 'jimeng', 'narrative'].includes(next) && next !== currentKey) {
        currentKey = next;
        render();
      }
    });

    function getCurrentDataset() {
      return datasets.find(ds => ds.key === currentKey);
    }

    function copyAllPrompts(key) {
      const ds = datasets.find(item => item.key === key);
      const text = ds.rows.map(row => `【${row.id}｜${row.time}】\n${row.prompt}`).join('\n\n');
      copyText(text, `已复制${ds.title}全部提示词`);
    }

    function copyCurrentAll() {
      copyAllPrompts(currentKey);
    }

    function copyCurrentTable() {
      const ds = getCurrentDataset();
      const header = `#\t时间段\t景别\t运镜\t画面描述\t光影氛围\t${ds.promptLabel}`;
      const lines = ds.rows.map(r => [r.id, r.time, r.shot, r.move, r.desc, r.light, r.prompt].join('\t'));
      copyText([header, ...lines].join('\n'), '已复制当前表格全文');
    }

    function handleRowCopy(event) {
      const button = event.target.closest('[data-copy-action]');
      if (!button) return;

      const datasetKey = button.getAttribute('data-dataset-key');
      const rowId = button.getAttribute('data-row-id');
      const action = button.getAttribute('data-copy-action');
      const ds = datasets.find(item => item.key === datasetKey);
      if (!ds) return;
      const row = ds.rows.find(item => String(item.id) === String(rowId));
      if (!row) return;

      if (action === 'prompt') {
        copyText(row.prompt, `已复制第${row.id}镜提示词`);
        return;
      }

      if (action === 'row') {
        const fullRowText = `#${row.id} | ${row.time} | ${row.shot} | ${row.move}\n画面描述：${row.desc}\n光影氛围：${row.light}\n${ds.promptLabel}：\n${row.prompt}`;
        copyText(fullRowText, `已复制第${row.id}镜整行`);
      }
    }

    panels.addEventListener('click', handleRowCopy);

    function expandAllPrompts() {
      document.querySelectorAll('.prompt-box').forEach(el => el.style.maxHeight = 'none');
      showToast('已展开全部提示词');
    }

    render();
  </script>
</body>
</html>
